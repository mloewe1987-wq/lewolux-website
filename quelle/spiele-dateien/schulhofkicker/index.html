<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Schulhofkicker – Fußball-Spaß für Kinder | Lewolux Kids</title>
<meta name="description" content="Schulhofkicker: Fußball-Spiel für Kinder von 5 bis 10 Jahren. Weitschuss, Elfmeterschießen, Kopfball-Duell, Spielzüge, Jonglieren und Dribbeln. Lewolux Kids: ohne Werbung, ohne Käufe.">
<meta name="theme-color" content="#3aa7ef">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='%23fff' stroke='%231d1330' stroke-width='5'/%3E%3Cpath d='M32 21l9 6.5-3.4 10.5H26.4L23 27.5z' fill='%231d1330'/%3E%3C/svg%3E">
<style>
:root{--ol:#1d1330;--yel:#ffd23f;--org:#ff6b2c;--pink:#ff4f9a;--teal:#1fbfa9;--blue:#3a8bff;--grn:#4cc046;--pur:#8a5cff;--card:#fff8ea;
--font:"Baloo 2","Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#3aa7ef;font-family:var(--font);color:var(--ol);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:3}
.scr{position:absolute;inset:0;display:none;pointer-events:none}
.scr.on{display:block}
.pe,button,.scroll,.mbox,input{pointer-events:auto}
button{font-family:var(--font);color:inherit}
.btn{font-weight:900;font-size:19px;letter-spacing:.3px;color:#fff;background:var(--org);border:3px solid var(--ol);border-radius:18px;
padding:10px 18px;box-shadow:0 5px 0 var(--ol),inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.38);
text-shadow:0 2px 0 rgba(0,0,0,.28);cursor:pointer;position:relative;transition:transform .07s,box-shadow .07s,filter .1s;
display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.05;white-space:nowrap;touch-action:manipulation}
.btn:hover{filter:brightness(1.06)}
.btn:active,.btn.press{transform:translateY(4px);box-shadow:0 1px 0 var(--ol),inset 0 -3px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.3)}
.btn.yel{background:var(--yel);color:var(--ol);text-shadow:0 2px 0 rgba(255,255,255,.5)}
.btn.teal{background:var(--teal)}.btn.pink{background:var(--pink)}.btn.blue{background:var(--blue)}.btn.grn{background:var(--grn)}.btn.pur{background:var(--pur)}
.btn.gray{background:#9a93ad}.btn.white{background:#fff;color:var(--ol);text-shadow:none}
.btn.big{font-size:28px;padding:12px 32px;border-radius:24px;border-width:4px;box-shadow:0 7px 0 var(--ol),inset 0 -7px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.4)}
.btn.big:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ol),inset 0 -4px 0 rgba(0,0,0,.18)}
.btn.ic{width:56px;height:56px;padding:0;border-radius:18px}
.btn.ic svg{width:30px;height:30px}
.btn svg{width:24px;height:24px;flex:none}
.btn[disabled]{filter:grayscale(.85) brightness(.92);cursor:default}
.btn.off{opacity:.55}
.ico{display:inline-flex;align-items:center;justify-content:center}
#bBack{position:absolute;left:calc(12px + var(--sal));top:calc(12px + var(--sat));z-index:6;display:none}
#coinB{position:absolute;right:calc(12px + var(--sar));top:calc(12px + var(--sat));z-index:6;display:none}
.coinbadge{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ol);border-radius:999px;padding:4px 14px 4px 6px;
font-weight:900;font-size:21px;box-shadow:0 4px 0 var(--ol);line-height:1.1;pointer-events:none}
.coinbadge svg{width:30px;height:30px}
.coinbadge.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
/* ---------- Hub ---------- */
.logo{position:absolute;text-align:center;pointer-events:none;filter:drop-shadow(0 6px 0 rgba(29,19,48,.3));transform:rotate(-3deg);transform-origin:50% 50%}
.logo .l1{display:inline-block;font-weight:900;font-size:16px;color:#fff;background:var(--pink);border:3px solid var(--ol);border-radius:12px;padding:1px 12px 2px;
transform:rotate(-3deg) translateY(8px);box-shadow:0 4px 0 var(--ol);letter-spacing:1.5px;position:relative;z-index:2}
.logo .l2{display:block;font-weight:900;font-size:50px;line-height:.95;color:var(--yel);letter-spacing:1px;white-space:nowrap;
-webkit-text-stroke:.11em var(--ol);paint-order:stroke fill;text-shadow:0 5px 0 var(--org),0 9px 0 var(--ol)}
#tiles{position:absolute;display:grid;gap:12px;pointer-events:auto}
.tile{position:relative;border:4px solid var(--ol);border-radius:22px;padding:0;cursor:pointer;overflow:hidden;background:var(--c,#fff);
box-shadow:0 6px 0 var(--ol),inset 0 -6px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.4);transition:transform .08s,box-shadow .08s;touch-action:manipulation;display:block}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ol)}
.tile canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.tile .tl{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);background:#fff;border:3px solid var(--ol);border-radius:12px;padding:0 9px;font-weight:900;font-size:15px;white-space:nowrap;line-height:1.35;box-shadow:0 3px 0 var(--ol)}
.tile .tb{position:absolute;right:6px;top:6px;background:rgba(29,19,48,.72);color:#fff;border-radius:10px;padding:1px 7px;font-weight:900;font-size:12.5px;display:flex;align-items:center;gap:3px;line-height:1.4}
.tile .tb svg{width:14px;height:14px}
#bShop{position:absolute}
#hubTop{position:absolute;right:calc(12px + var(--sar));top:calc(74px + var(--sat));display:flex;flex-direction:column;gap:10px}
#bGear{position:absolute;left:calc(12px + var(--sal));top:calc(12px + var(--sat))}
#bGear .ring{position:absolute;inset:-7px;pointer-events:none;transform:rotate(-90deg);width:calc(100% + 14px)!important;height:calc(100% + 14px)!important}
.hint{position:absolute;left:50%;bottom:calc(16px + var(--sab));transform:translateX(-50%);background:#fff;border:3px solid var(--ol);border-radius:16px;padding:6px 14px;font-weight:800;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 0 var(--ol);white-space:nowrap;z-index:9}
.hint.on{opacity:1}
/* ---------- Header for menus ---------- */
.hdr{position:absolute;left:0;right:0;top:0;height:calc(80px + var(--sat));display:flex;align-items:center;justify-content:center;pointer-events:none;padding-top:var(--sat)}
.hdr h2{margin:0;font-weight:900;font-size:clamp(20px,6.4vw,30px);color:#fff;-webkit-text-stroke:5px var(--ol);paint-order:stroke fill;text-shadow:0 4px 0 var(--ol);letter-spacing:.5px;transform:rotate(-2deg);white-space:nowrap}
.scroll{position:absolute;left:0;right:0;bottom:0;top:calc(84px + var(--sat));overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px 14px;padding:12px calc(14px + var(--sar)) calc(30px + var(--sab)) calc(14px + var(--sal));max-width:980px;margin:0 auto}
.lcard{position:relative;border:4px solid var(--ol);border-radius:22px;background:var(--card);padding:0 0 8px;cursor:pointer;box-shadow:0 6px 0 var(--ol);display:flex;flex-direction:column;align-items:center;touch-action:manipulation;overflow:visible}
.lcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ol)}
.lcard canvas{width:100%;aspect-ratio:4/3;display:block;border-radius:18px 18px 0 0;border-bottom:3px solid var(--ol)}
.lcard .ln{position:absolute;left:-8px;top:-10px;width:38px;height:38px;border-radius:50%;background:var(--yel);border:3px solid var(--ol);font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ol)}
.lcard .lt{font-weight:900;font-size:15px;line-height:1.1;margin:6px 6px 2px;text-align:center;min-height:17px}
.lcard .ls{display:flex;gap:2px}.lcard .ls svg{width:24px;height:24px}
.lcard.lock{background:#d9d3e6;cursor:default}.lcard.lock canvas{filter:grayscale(1) brightness(.75);opacity:.55}
.lcard .lk{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--ol);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ol)}
.lcard .lk svg{width:30px;height:30px}
.lcard.cur{animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.lcard.cur .ln{background:var(--org);color:#fff}
/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:calc(12px + var(--sat));display:flex;justify-content:center;gap:8px;pointer-events:none;padding:0 76px}
.pill{background:#fff;border:3px solid var(--ol);border-radius:16px;box-shadow:0 4px 0 var(--ol);font-weight:900;padding:4px 12px;font-size:20px;line-height:1.2;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill svg{width:24px;height:24px}
.pill.big{font-size:30px;padding:2px 16px;border-radius:20px}
.pill.dark{background:rgba(29,19,48,.75);color:#fff;border-color:rgba(29,19,48,.9)}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--ol);background:#e6dfd1}
.dot.g{background:var(--grn)}.dot.m{background:#ff8f8f}.dot.n{background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.rbtn{position:absolute;width:78px;height:78px;border-radius:50%;border:4px solid var(--ol);background:rgba(255,255,255,.88);box-shadow:0 6px 0 var(--ol);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer;padding:0}
.rbtn svg{width:44px;height:44px;pointer-events:none}
.rbtn.on{transform:translateY(4px);box-shadow:0 2px 0 var(--ol);background:var(--yel)}
.rbtn.kick{background:rgba(255,107,44,.92)}.rbtn.kick.on{background:var(--yel)}
.rbtn.jump{background:rgba(58,139,255,.92)}.rbtn.jump.on{background:var(--yel)}
.cbtn{position:absolute;pointer-events:auto}
/* ---------- Modal ---------- */
.modal{background:rgba(20,12,36,.55);z-index:20;overflow-y:auto;touch-action:pan-y;pointer-events:auto;padding:34px 16px calc(16px + var(--sab))}
.modal.on{display:flex;flex-direction:column}
.mbox{background:var(--card);border:4px solid var(--ol);border-radius:28px;box-shadow:0 8px 0 var(--ol);padding:20px 18px 20px;width:100%;max-width:420px;
display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative;margin:auto;flex:none;animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.mbox h3{margin:0;font-size:30px;font-weight:900;line-height:1}
.mbox .sub{font-weight:800;font-size:16px;opacity:.75}
.mbox .row{display:flex;gap:12px;width:100%;justify-content:center;flex-wrap:wrap}
.ribbon{position:absolute;top:-24px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--org);color:#fff;border:4px solid var(--ol);border-radius:14px;
padding:2px 18px;font-weight:900;font-size:22px;box-shadow:0 4px 0 var(--ol);white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.ribbon.gold{background:var(--yel);color:var(--ol);text-shadow:none}
.bigstars{display:flex;gap:6px;align-items:flex-end;margin-top:10px;min-height:70px}
.bigstars svg{width:64px;height:64px;transform:scale(0);transition:transform .4s cubic-bezier(.3,1.8,.5,1)}
.bigstars svg:nth-child(2){width:80px;height:80px}
.bigstars svg.show{transform:scale(1)}
.gain{font-size:26px;font-weight:900;display:flex;align-items:center;gap:6px}.gain svg{width:34px;height:34px}
.mcv{width:150px;height:130px}
.bignum{font-size:48px;font-weight:900;line-height:1;color:var(--org);-webkit-text-stroke:2px var(--ol);paint-order:stroke fill}
.rec{background:var(--yel);border:3px solid var(--ol);border-radius:14px;padding:2px 12px;font-weight:900;font-size:20px;animation:pulse .8s infinite;box-shadow:0 3px 0 var(--ol)}
/* Upgrades */
.uprow{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:3px solid var(--ol);border-radius:18px;padding:8px 10px;box-shadow:0 4px 0 var(--ol)}
.uprow canvas{width:56px;height:56px;flex:none}
.uprow .ui{flex:1;text-align:left}
.uprow b{display:block;font-size:17px;line-height:1.1}
.pips{display:flex;gap:4px;margin-top:4px}.pip{width:18px;height:11px;border-radius:6px;border:2px solid var(--ol);background:#e6dcc8}.pip.on{background:var(--org)}
.uprow .btn{font-size:17px;padding:7px 10px;min-width:88px}
.uprow .btn svg{width:20px;height:20px}
/* Settings */
.setrow{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:900;font-size:17px;gap:10px;text-align:left;padding:6px 0;border-bottom:2px dashed #e6d8bd}
.setrow small{display:block;font-weight:700;font-size:12.5px;opacity:.7}
.tog{width:64px;height:36px;border-radius:999px;border:3px solid var(--ol);background:#cfc6dd;position:relative;cursor:pointer;flex:none;padding:0}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--ol);transition:left .15s}
.tog.on{background:var(--teal)}.tog.on:after{left:29px}
input[type=range]{width:130px;accent-color:var(--org)}
.hold{position:relative;overflow:hidden;width:100%;border:3px solid var(--ol);border-radius:16px;padding:11px;font-weight:900;font-size:15px;color:#fff;background:#e2627f;box-shadow:0 4px 0 var(--ol);cursor:pointer}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.4)}
.hold span{position:relative}
.note{font-size:12.5px;opacity:.8;line-height:1.4;font-weight:700;margin:4px 0 0}
/* ---------- Shop ---------- */
#shopPanel{position:absolute;background:var(--card);border:4px solid var(--ol);border-radius:26px;box-shadow:0 7px 0 var(--ol);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;pointer-events:auto}
#shopTabs{display:flex;flex-wrap:wrap;gap:7px 6px;padding:9px 8px 9px;justify-content:center;border-bottom:3px solid var(--ol);background:#ffefc7}
#shopTabs .btn{width:46px;height:46px;padding:0;border-radius:14px;flex:none;box-shadow:0 4px 0 var(--ol)}
#shopTabs .btn svg,#shopTabs .btn canvas{width:30px;height:30px}
.land #shopPanel{grid-template-columns:76px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.land #shopTabs{flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;align-items:center;overflow-y:auto;touch-action:pan-y;border-bottom:0;border-right:3px solid var(--ol);padding:10px 6px 14px}
.land #shopAct{grid-column:1/-1}
#shopTabs .btn.sel{background:var(--yel);transform:translateY(3px);box-shadow:0 2px 0 var(--ol)}
#shopGrid{min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;padding:12px;align-content:start}
.it{position:relative;border:3px solid var(--ol);border-radius:18px;background:#fff;padding:0 0 4px;cursor:pointer;box-shadow:0 4px 0 var(--ol);display:flex;flex-direction:column;align-items:center;touch-action:manipulation;min-width:0}
.it canvas{width:100%;aspect-ratio:1;display:block}
.it .ip{font-weight:900;font-size:15px;display:flex;align-items:center;gap:2px;line-height:1.2}
.it .ip svg{width:17px;height:17px}
.it.sel{background:#fff3b0;outline:4px solid var(--org);outline-offset:1px}
.it.eq{background:#dcffd2}
.it .chk{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--grn);border:3px solid var(--ol);display:flex;align-items:center;justify-content:center}
.it .chk svg{width:16px;height:16px}
.it.leg{background:linear-gradient(160deg,#fff7d6,#ffe08a)}
.it .lg{position:absolute;top:-9px;left:-6px;background:var(--pur);color:#fff;border:2px solid var(--ol);border-radius:8px;font-size:10px;font-weight:900;padding:0 5px;transform:rotate(-8deg)}
#shopAct{border-top:3px solid var(--ol);padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:76px;background:#fff8ea}
#shopAct .nm{font-weight:900;font-size:17px;line-height:1.1;text-align:left;flex:1;min-width:0}
#shopAct .nm small{display:block;font-size:13px;opacity:.7}
#shopAct .btn{font-size:20px}
#numBox{position:absolute;display:none;align-items:center;gap:6px;pointer-events:auto}
#numBox .btn{width:46px;height:46px;padding:0;font-size:26px}
#numBox .pill{font-size:24px;min-width:62px;justify-content:center}
#bTurn{position:absolute}
/* Trick-Show */
#tsBtns{position:absolute;left:0;right:0;bottom:calc(14px + var(--sab));display:flex;justify-content:center;gap:12px;pointer-events:none}
.tsb{width:var(--s,90px);height:var(--s,90px);border-radius:26px;border:4px solid var(--ol);background:var(--c);box-shadow:0 6px 0 var(--ol),inset 0 -6px 0 rgba(0,0,0,.15),inset 0 3px 0 rgba(255,255,255,.4);position:relative;padding:0;cursor:pointer;overflow:hidden;transition:transform .1s,box-shadow .1s,filter .15s;touch-action:manipulation;pointer-events:auto}
.tsb canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tsb.lit{transform:translateY(-8px) scale(1.1);box-shadow:0 10px 0 var(--ol),0 0 0 5px #fff,0 0 34px 12px var(--c)}
.tsb:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ol)}
.tsb.off{filter:saturate(.45) brightness(.92)}
.dl{display:flex;align-items:center;gap:12px;width:100%;justify-content:space-between}
.dl .btn{flex:1;font-size:22px;justify-content:flex-start}
.dl .rec2{font-weight:900;font-size:15px;display:flex;align-items:center;gap:3px;min-width:56px}.dl .rec2 svg{width:20px;height:20px}
.tile .tl{max-width:calc(100% - 6px);overflow:hidden;text-overflow:ellipsis;padding:0 5px;letter-spacing:-.2px}
.tile .tl.band{left:3px;right:3px;bottom:4px;transform:none;max-width:none;padding:0 1px;text-align:center;border-width:2px;border-radius:9px;letter-spacing:-.4px}
/* misc */
#toast{position:fixed;left:50%;top:calc(84px + var(--sat));transform:translateX(-50%) translateY(-20px) scale(.8);opacity:0;z-index:40;pointer-events:none;
background:var(--yel);border:3px solid var(--ol);border-radius:18px;padding:8px 16px;font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--ol);transition:all .3s cubic-bezier(.3,1.6,.5,1);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
#toast svg{width:26px;height:26px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.port .hdr{top:calc(64px + var(--sat));height:50px;padding-top:0}.port .scroll{top:calc(116px + var(--sat))}
.port .hud{flex-direction:column;align-items:center;gap:6px;padding:0 112px 0 76px}
.hud .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.port .hide-port{display:none!important}.land .hide-land{display:none!important}
@media (max-height:430px){.btn.ic{width:50px;height:50px}.coinbadge{font-size:18px}.coinbadge svg{width:26px;height:26px}.hdr{height:calc(66px + var(--sat))}.scroll{top:calc(68px + var(--sat))}.hdr h2{font-size:26px}}
@media (max-height:500px) and (min-aspect-ratio:1/1){.modal{padding-top:28px}.mbox{gap:5px;padding:12px 16px 14px;max-width:460px}.mbox h3{font-size:24px}.bignum{font-size:36px}.gain{font-size:21px}.gain svg{width:26px;height:26px}
 .bigstars{min-height:48px;margin-top:4px}.bigstars svg{width:44px;height:44px}.bigstars svg:nth-child(2){width:56px;height:56px}.mcv{width:110px;height:95px}.mbox:has(.bigstars) .mcv{display:none}
 .setrow{padding:3px 0;font-size:15px}.btn.big{font-size:22px;padding:9px 22px}.uprow{padding:5px 8px}.uprow canvas{width:44px;height:44px}}
@media (prefers-reduced-motion:reduce){.lcard.cur,.rec,.dot.n{animation:none}}

function shadeC(hex,k){const key=hex+k;if(_cc[key])return _cc[key];let h=hex.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');
 let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
 if(k<0){r*=1+k;g*=1+k;b*=1+k}else{r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k}
 return _cc[key]='#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}

 ws:{best:0,up:{kraft:0,flug:0,turbo:0,glueck:0},runs:0},el:{st:[]},kd:{st:[]},sz:{st:[]},jg:{best:0},dr:{best:0},ts:{best:{l:0,m:0,s:0}},

/* ---------- Audio ---------- */
const AU={ctx:null};
function auInit(){
 if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 let c;try{c=AU.ctx=new AC()}catch(e){return}
 AU.master=c.createGain();AU.comp=c.createDynamicsCompressor();AU.comp.threshold.value=-12;AU.comp.ratio.value=5;
 AU.master.connect(AU.comp);AU.comp.connect(c.destination);AU.master.gain.value=.9;
 AU.sfx=c.createGain();AU.sfx.connect(AU.master);AU.duck=c.createGain();AU.duck.connect(AU.master);AU.mus=c.createGain();AU.mus.connect(AU.duck);
 const len=c.sampleRate*1.5,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nbuf=b;
 applyVol();musicStart();
}
function applyVol(){if(!AU.ctx)return;const t=AU.ctx.currentTime;AU.sfx.gain.setTargetAtTime(S.set.sfx?.85:0,t,.05);AU.mus.gain.setTargetAtTime(S.set.music?.2*S.set.mvol:0,t,.1)}
function aOK(){return AU.ctx&&AU.ctx.state==='running'}
function tone(type,f0,f1,dur,vol,o={}){
 if(!aOK()||!S.set.sfx)return;const c=AU.ctx,t=c.currentTime+(o.delay||0);
 const os=c.createOscillator(),g=c.createGain();os.type=type;os.frequency.setValueAtTime(f0,t);
 if(f1!==f0)os.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur*(o.bend||1));
 const a=o.attack||.005;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=o.vibAmt||20;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+.05)}
 let node=os;if(o.filter){const f=c.createBiquadFilter();f.type=o.filter;f.frequency.value=o.ff||1000;f.Q.value=o.q||1;os.connect(f);node=f}
 node.connect(g);g.connect(AU.sfx);os.start(t);os.stop(t+dur+.05);
}
function noise(dur,vol,ft,f0,f1,o={}){
 if(!aOK()||!S.set.sfx)return;const c=AU.ctx,t=c.currentTime+(o.delay||0);
 const s=c.createBufferSource();s.buffer=AU.nbuf;const f=c.createBiquadFilter();f.type=ft;f.Q.value=o.q||1;
 f.frequency.setValueAtTime(f0,t);if(f1!==f0)f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 const g=c.createGain();const a=o.attack||.004;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);
 if(o.hold)g.gain.setValueAtTime(vol,t+o.hold);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(AU.sfx);s.start(t,Math.random()*.4);s.stop(t+dur+.05);
}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
let lastSfx={};
function rl(k,ms){const n=performance.now();if(lastSfx[k]&&n-lastSfx[k]<ms)return false;lastSfx[k]=n;return true}
const SFX={
 tap(){tone('sine',720,360,.07,.2)},
 tick(){tone('triangle',1100,900,.04,.08)},
 kick(p=1){if(!rl('kick',40))return;tone('sine',150,48,.18,.75*p);noise(.07,.5*p,'bandpass',2200,900,{q:.8})},

 bounce(p=1){if(!rl('bnc',50))return;tone('sine',210*rnd(.9,1.1),90,.12,.35*clamp(p,.15,1))},
 boing(){tone('sine',180,520,.28,.35,{vib:18,vibAmt:40});tone('triangle',360,1040,.22,.1)},
 whoosh(p=1){noise(.32,.22*p,'bandpass',300,2400,{q:1.2,attack:.06})},
 coin(){if(!rl('coin',45))return;tone('square',1318,1318,.07,.06,{filter:'lowpass',ff:3000});tone('square',1760,1760,.16,.06,{delay:.06,filter:'lowpass',ff:3200})},

 star(i=0){tone('triangle',NOTE(76+i*4),NOTE(76+i*4),.35,.22);tone('sine',NOTE(88+i*4),NOTE(88+i*4),.3,.08)},
 whistle(n=1){for(let i=0;i<n;i++)tone('sine',2600,2500,i===n-1?.42:.16,.12,{delay:i*.22,vib:28,vibAmt:120,attack:.01})},

/* Musik: fröhliche Schleife, deutlich leiser als Stimme */
const MUS={timer:0,next:0,step:0};
const PROG=[[60,64,67],[67,71,74],[69,72,76],[65,69,72]],BAS=[48,43,45,41];
const MEL=[76,0,79,0,76,74,72,0,74,0,76,0,79,0,0,0, 74,0,71,0,74,76,79,0,77,0,76,0,74,0,0,0, 72,0,76,0,79,0,81,79,76,0,74,0,72,0,0,0, 69,0,72,0,77,76,74,0,72,0,71,0,72,0,0,0];
function musicStart(){if(MUS.timer||!AU.ctx)return;MUS.next=AU.ctx.currentTime+.1;MUS.timer=setInterval(musicTick,70)}
function musicTick(){const c=AU.ctx;if(!c||c.state!=='running'||!S.set.music)return;const sp=60/118/4;
 if(MUS.next<c.currentTime-.2)MUS.next=c.currentTime+.05;
 while(MUS.next<c.currentTime+.18){mStep(MUS.step,MUS.next);MUS.next+=sp*(MUS.step%2?.88:1.12);MUS.step=(MUS.step+1)%64}}
function mN(type,f,t,dur,vol,ff){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 if(ff){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=ff;o.connect(fl);fl.connect(g)}else o.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+dur+.02)}
function mNz(t,dur,vol,ft,f){const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.nbuf;const fl=c.createBiquadFilter();fl.type=ft;fl.frequency.value=f;const g=c.createGain();
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(AU.mus);s.start(t,Math.random());s.stop(t+dur+.02)}
function mStep(s,t){const bar=Math.floor(s/16),b=s%16,ch=PROG[bar];
 if(b===0||b===8||b===10)mN('sine',NOTE(BAS[bar]),t,.2,.5);
 if(b===4||b===12)mNz(t,.1,.22,'bandpass',2000);
 if(b%2===0)mNz(t,.03,.06,'highpass',8000);
 if(b===2||b===6||b===10||b===14)ch.forEach((n,i)=>mN('triangle',NOTE(n),t+i*.01,.14,.08,2400));
 const m=MEL[s];if(m>0)mN('square',NOTE(m),t,.16,.05,2000);
}
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden){AU.ctx.suspend().catch(()=>{});shutUp()}else AU.ctx.resume().catch(()=>{})});

/* ---------- Sprachausgabe (Gerätestimme, Deutsch) ---------- */
const VO={v:null,tries:0};

 if(!de.length)return false;let best=null,bs=-1;for(const v of de){let s=0;if(v.localService)s+=10;if(/google|samsung|anna|petra|helena|katja|marlene|vicki/i.test(v.name))s+=5;if(/^de[-_]DE$/i.test(v.lang))s+=2;if(s>bs){bs=s;best=v}}
 VO.v=best;return true}catch(e){return false}}
function voiceInit(){if(!('speechSynthesis' in window))return;pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}
 const iv=setInterval(()=>{if(pickVoice()||++VO.tries>24)clearInterval(iv)},500)}

/* ---------- Partikel (Welt-Koordinaten der aktuellen Szene, y nach unten) ---------- */
const PTS=[];let PMAX=220;
const PCOL={dust:['#fff'],star:['#ffd23f','#fff','#ffe680'],conf:['#ff4f9a','#ffd23f','#3a8bff','#1fbfa9','#ff6b2c','#8a5cff','#7ee36b'],grass:['#4cb041','#6fd25a','#3d9636'],
 feather:['#fff','#ffe9f2'],water:['#bfe9ff','#fff','#7fd0ff'],spark:['#fff6b0','#ffd23f','#ff9f2c']};
function part(type,x,y,o={}){if(PTS.length>=PMAX)PTS.shift();const a=o.a!==undefined?o.a+rnd(-o.spread||-.5,o.spread||.5):rnd(0,TAU),sp=(o.sp||200)*rnd(.4,1);
 PTS.push({type,x,y,vx:Math.cos(a)*sp+(o.vx||0),vy:Math.sin(a)*sp+(o.vy||0),g:o.g!==undefined?o.g:type==='dust'?-30:type==='conf'?260:type==='feather'?60:600,life:0,max:o.life||rnd(.5,1.1),
  col:o.col||pick(PCOL[type]||PCOL.dust),sz:(o.sz||1)*(type==='dust'?rnd(7,13):type==='conf'?rnd(4,7):type==='star'?rnd(6,10):rnd(3,6)),r:rnd(0,TAU),vr:rnd(-10,10),drag:o.drag||(type==='dust'?3:type==='conf'?1.6:type==='feather'?2.5:.4)})}
function burst(type,x,y,n,o={}){if(LOWEND)n=Math.ceil(n*.6);for(let i=0;i<n;i++)part(type,x,y,o)}
function ring(x,y,r,col='#fff',w=6){if(PTS.length>=PMAX)PTS.shift();PTS.push({type:'ring',x,y,vx:0,vy:0,g:0,life:0,max:.4,col,sz:r,w,r:0,vr:0,drag:0})}
function updParts(dt){for(let i=PTS.length-1;i>=0;i--){const p=PTS[i];p.life+=dt;if(p.life>=p.max){PTS.splice(i,1);continue}
 const d=Math.exp(-p.drag*dt);p.vx*=d;p.vy*=d;p.vy+=p.g*dt;if(p.type==='conf'||p.type==='feather'){p.vy=Math.min(p.vy,p.type==='feather'?60:160);p.vx+=Math.sin(p.life*8+p.r)*40*dt}
 p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt}}
function drawParts(c,scale=1){for(const p of PTS){const k=p.life/p.max,s=p.sz*scale;c.globalAlpha=1;
 if(p.type==='dust'){c.globalAlpha=(1-k)*.75;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,s*(1+k*1.3),0,TAU);c.fill()}
 else if(p.type==='star'){c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=1-k*k;starPath(c,0,0,s,s*.45);c.fillStyle=p.col;c.fill();c.lineWidth=Math.max(1,s*.22);c.strokeStyle=OL;c.stroke();c.restore()}
 else if(p.type==='conf'){c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=1-k*k;c.fillStyle=p.col;c.fillRect(-s,-s*.55*Math.abs(Math.cos(p.life*9+p.r)),s*2,s*1.1*Math.abs(Math.cos(p.life*9+p.r))+.5);c.restore()}
 else if(p.type==='feather'){c.save();c.translate(p.x,p.y);c.rotate(p.r*.3);c.globalAlpha=1-k;c.fillStyle=p.col;c.beginPath();c.ellipse(0,0,s*1.4,s*.55,0,0,TAU);c.fill();c.strokeStyle='rgba(29,19,48,.5)';c.lineWidth=1;c.stroke();c.restore()}
 else if(p.type==='ring'){c.globalAlpha=1-k;c.strokeStyle=p.col;c.lineWidth=p.w*(1-k)+1;c.beginPath();c.arc(p.x,p.y,p.sz*(.3+E.out(k)*1.2),0,TAU);c.stroke()}
 else if(p.type==='spark'){c.globalAlpha=1-k;c.strokeStyle=p.col;c.lineWidth=s*.6;c.lineCap='round';c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.04,p.y-p.vy*.04);c.stroke()}
 else{c.globalAlpha=1-k*k;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,s,0,TAU);c.fill()}}c.globalAlpha=1}
function starPath(c,x,y,R,r,n=5){c.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,q=i%2?r:R;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath()}

/* ---------- Comic-Texte & Effekte (Bildschirm-Koordinaten) ---------- */
const FX={comics:[],pops:[],shake:0,hit:0,flash:0,slow:1};
function comic(text,x,y,col='#ffd23f',size=1,tc){FX.comics.push({text,x,y,t:0,col,tc,size,rot:rnd(-.2,.2),pts:Array.from({length:14},(_,i)=>i%2?rnd(.6,.72):rnd(.95,1.12))});if(FX.comics.length>4)FX.comics.shift()}
function popT(text,x,y,col='#fff',size=1){FX.pops.push({text,x,y,t:0,col,size});if(FX.pops.length>10)FX.pops.shift()}
function shake(a){if(S.set.rm)a*=.15;FX.shake=Math.max(FX.shake,a)}
function hitStop(t){FX.hit=Math.max(FX.hit,t)}
function updFX(dt){FX.shake*=Math.exp(-dt*9);if(FX.shake<.3)FX.shake=0;
 for(let i=FX.comics.length-1;i>=0;i--){FX.comics[i].t+=dt;if(FX.comics[i].t>1)FX.comics.splice(i,1)}
 for(let i=FX.pops.length-1;i>=0;i--){FX.pops[i].t+=dt;if(FX.pops[i].t>1.1)FX.pops.splice(i,1)}
 FX.flash=Math.max(0,FX.flash-dt*3)}
function drawFX(){setT();const u=Math.min(W,H);
 for(const b of FX.comics){const k=b.t;const sc=E.outBack(Math.min(1,k*6))*(1-Math.max(0,k-.78)*4.5);if(sc<=0)continue;const R=clamp(u*.13,52,120)*b.size;
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);ctx.scale(sc,sc);ctx.beginPath();b.pts.forEach((r,i)=>{const a=i/b.pts.length*TAU;ctx.lineTo(Math.cos(a)*R*r*1.3,Math.sin(a)*R*r*.85)});ctx.closePath();
  ctx.fillStyle=b.col;ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.lineJoin='round';ctx.fill();ctx.stroke();
  let fsz=R*.46;ctx.font='900 '+fsz+'px '+FONT;const tw=ctx.measureText(b.text).width;if(tw>R*2.3){fsz*=R*2.3/tw;ctx.font='900 '+fsz+'px '+FONT}
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=fsz*.22;ctx.strokeStyle=OL;ctx.strokeText(b.text,0,3);ctx.fillStyle=b.tc||'#fff';ctx.fillText(b.text,0,3);ctx.restore()}
 for(const p of FX.pops){const k=p.t/1.1;const sc=E.outBack(Math.min(1,p.t*7));const fs=clamp(u*.05,20,34)*p.size;
  ctx.save();ctx.globalAlpha=1-Math.max(0,k-.7)/.3;ctx.translate(p.x,p.y-E.out(k)*50);ctx.scale(sc,sc);ctx.font='900 '+fs+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=fs*.24;ctx.strokeStyle=OL;ctx.strokeText(p.text,0,0);ctx.fillStyle=p.col;ctx.fillText(p.text,0,0);ctx.restore()}
 if(FX.flash>0&&!S.set.rm){ctx.globalAlpha=FX.flash*.5;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}
function shakeXY(){if(!FX.shake)return[0,0];const t=performance.now()/1000;return[Math.sin(t*71)*FX.shake,Math.cos(t*63)*FX.shake]}

 sz(p){if(SZ.st!=='plan'){if(PAD.sz&&PAD.sz.down)SZ.drawing=false;PAD.sz=null;return}
  if(p.hit('x')){$('#szUndo').click();return}if(p.hit('y')){const h=$('#szHint');if(h&&h.style.display!=='none')h.click();return}
  if(!PAD.sz){const q=szS(SZ.ball.x,SZ.ball.y);PAD.sz={x:q.x,y:q.y,down:false}}
  const c=PAD.sz,sp=SZ.view.s*26;c.x+=(p.lx||p.dx*.8)*p.dt*sp;c.y+=(p.ly||p.dy*.8)*p.dt*sp;
  const w=szW(c.x,c.y);w.x=clamp(w.x,40,104);w.y=clamp(w.y,6,58);const q=szS(w.x,w.y);c.x=q.x;c.y=q.y;
  if(p.hit('a')){c.down=true;SCN.pdown({x:c.x,y:c.y})}
  else if(c.down&&p.down('a')){SCN.pmove({x:c.x,y:c.y})}
  else if(c.down&&p.up('a')){c.down=false;SCN.pup({x:c.x,y:c.y});if(SZ.st!=='plan')PAD.sz=null}},
 jg(p){if(p.hit('a')||p.hit('up'))jgTap()},
 dr(p){if(p.hit('a')||p.hit('up'))drJump()},
 ts(p){const m=[['up','y'],['down','a'],['left','x'],['right','rb']];m.forEach((k,i)=>{if(p.hit(k[0])||p.hit(k[1]))tsTap(i)})}};
window.LXPAD_INIT=function(L){
 L.root=()=>$('#par').classList.contains('on')?$('#par'):modalOpen()?$('#modal'):null;
 L.back=()=>{if(PAD.hold)return true;auInit();SFX.tap();goBack();return true};
 L.game=p=>{
  if(SNAME!==PAD.scn){PAD.scn=SNAME;padReset();padHint(!!PADHINT[SNAME])}
  if(PAD.hintT>0){PAD.hintT-=p.dt;if(PAD.hintT<=0)padHint(false)}
  if(!p.active)return false;
  if(padHold(p))return true;
  const g=PADG[SNAME];if(!g||modalOpen()||$('#par').classList.contains('on')){if(EL.aim&&EL.aim.pad)EL.aim=null;return false}
  if(p.down('a')||p.down('b')||p.lx||p.ly||p.dx||p.dy)auInit();
  if(p.hit('b')){padReset();padHint(false);SFX.tap();goBack();return true}
  if(p.hit('start')){padHint(true);return true}
  g(p);return true}};
{const d0=SCENES.sz.draw;SCENES.sz.draw=function(){d0.apply(this,arguments);const c=PAD.sz;if(c&&window.LXPAD&&LXPAD.active&&SZ.st==='plan'){setT();drawHand(ctx,c.x+18,c.y+20,1.15,c.down?1:0);ctx.lineWidth=4;ctx.strokeStyle='#ffd23f';circ(ctx,c.x,c.y,10);ctx.stroke()}}}

boot();
