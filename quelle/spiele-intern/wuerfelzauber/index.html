<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2a1c4f">
<meta name="robots" content="noindex">
<title>Würfelzauber – Lewolux</title>
<style>
@font-face{font-family:F;font-weight:600;src:url(fonts/fredoka-600.woff2) format('woff2')}
@font-face{font-family:F;font-weight:700;src:url(fonts/fredoka-700.woff2) format('woff2')}
:root{--gold:#ffd25e;--ink:#2a1c4f;--purple:#6b3fd6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden;background:#1b1233 url(assets/sky.webp) center/cover;font-family:F,"Trebuchet MS",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
body::before{content:'';position:fixed;inset:0;backdrop-filter:blur(18px) brightness(.55)}
#app{position:absolute;box-shadow:0 0 60px rgba(0,0,0,.5);left:50%;top:50%;width:390px;transform-origin:50% 50%;overflow:hidden;background:#3a2a6e}
img{display:block;-webkit-user-drag:none;pointer-events:none}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bgShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,15,70,.35),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(30,12,60,.55))}
/* HUD */
#hud{position:absolute;left:8px;right:8px;top:8px;height:44px;display:flex;gap:6px;align-items:center;z-index:20}
.pill{height:34px;border-radius:17px;background:linear-gradient(#3a2a7acc,#221659dd);border:2px solid rgba(255,220,140,.75);display:flex;align-items:center;gap:4px;padding:0 9px 0 2px;font-weight:700;font-size:15px;box-shadow:0 3px 8px rgba(20,8,50,.45),inset 0 1px 0 rgba(255,255,255,.2);text-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap}
.pill img{width:34px;height:34px;margin:-4px 0 -4px -4px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#pCoins{flex:1.3}#pGems{flex:.8}
.av{width:44px;height:44px;border-radius:50%;flex:none;position:relative;cursor:pointer;background:conic-gradient(var(--fc,var(--gold)) var(--p,30%),rgba(255,255,255,.25) 0);padding:3px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 18%;background:#ffe2b0}
.av b{position:absolute;right:-4px;bottom:-4px;background:var(--purple);border:2px solid #fff;border-radius:10px;font-size:11px;padding:0 5px}
#shields{display:flex;gap:2px;flex:none}
#shields i{width:20px;height:20px;background:url(assets/ic_shield.webp) center/contain no-repeat;opacity:.25;filter:grayscale(1)}
#shields i.on{opacity:1;filter:none}
/* Königreich */
#kname{position:absolute;left:0;right:0;top:58px;text-align:center;z-index:6;pointer-events:none}
#kname b{font-weight:700;font-size:19px;text-shadow:0 2px 0 #5a2fb0,0 0 14px rgba(120,60,220,.8)}
#kname small{display:block;font-size:12px;font-weight:600;color:#ffe6a8;text-shadow:0 1px 0 #000}
#kingdom{position:absolute;left:0;right:0;top:92px;z-index:4}
.islet{position:absolute;transform:translate(-50%,-100%);cursor:pointer;animation:bob 5s ease-in-out infinite}
.islet img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 10px 10px rgba(30,10,70,.35))}
.islet.empty img{opacity:.5;filter:grayscale(.5) brightness(1.2) drop-shadow(0 8px 8px rgba(30,10,70,.3))}
.islet .stars{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);display:flex;gap:1px;background:rgba(30,15,70,.75);border:1.5px solid rgba(255,220,140,.8);border-radius:10px;padding:1px 5px}
.islet .stars i{width:9px;height:9px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#6a5a9a}
.islet .stars i.on{background:var(--gold)}
.islet .tag{position:absolute;left:50%;top:-4px;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(#ff9a3c,#e8541d);border:2px solid #fff;border-radius:11px;font-size:11px;padding:1px 7px;font-weight:700;animation:pulse 1.2s infinite;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.islet.dmg img{filter:grayscale(.6) brightness(.8) drop-shadow(0 10px 10px rgba(30,10,70,.35))}
.islet .smoke{position:absolute;left:50%;top:20%;font-size:22px;transform:translateX(-50%);animation:smoke 2s infinite}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-7px}}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}}
@keyframes smoke{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:.8}100%{opacity:0;transform:translate(-30%,-30px)}}
/* Seitenknöpfe */
.side{position:absolute;top:120px;display:flex;flex-direction:column;gap:14px;z-index:8}
.side.l{left:6px}.side.r{right:6px}
.sb{width:58px;height:58px;border-radius:50%;position:relative;background:radial-gradient(circle at 40% 30%,#8f6bff,#3c2290);border:3px solid #ffd77a;box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 -4px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sb img{width:44px;height:44px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.sb small{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;background:#2a1c4f;border:1.5px solid #ffd77a;border-radius:8px;padding:0 5px;white-space:nowrap}
.sb i{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:#ff3d6b;border:2px solid #fff;font-style:normal;font-size:11px;display:none;align-items:center;justify-content:center;font-weight:700;padding:0 4px}
.sb i.on{display:flex}
/* Schale und Knöpfe */
#trayWrap{position:absolute;left:6px;right:6px;z-index:10}
#tray{width:100%}
#dice{position:absolute;left:8%;right:8%;top:6%;height:84%;width:84%}
#lion{position:absolute;width:80px;height:90px;object-fit:contain;object-position:50% 100%;left:-4px;top:-54px;z-index:11;animation:lion 3.4s ease-in-out infinite;cursor:pointer}
@keyframes lion{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
#combo{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:12;background:linear-gradient(#ff7ab6,#d92f7a);border:2px solid #fff;border-radius:12px;padding:2px 12px;font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .3s;box-shadow:0 3px 10px rgba(217,47,122,.6)}
#combo.on{opacity:1}
#rollRow{position:absolute;left:10px;right:10px;height:84px;display:flex;align-items:center;gap:6px;z-index:12}
.rb{width:66px;height:66px;flex:none;position:relative;cursor:pointer}
.rb img{width:100%;height:100%;object-fit:contain}
.rb b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.5);line-height:1}
.rb b small{font-size:10px;font-weight:600;margin-top:2px}
#roll{flex:1;height:84px;position:relative;cursor:pointer;transition:transform .08s}
#roll img{width:100%;height:100%;object-fit:fill}
#roll b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:27px;letter-spacing:1px;text-shadow:0 3px 0 #8a0f2e,0 0 10px rgba(255,180,120,.6)}
#roll b small{font-size:11px;font-weight:600;letter-spacing:0;text-shadow:0 1px 0 #8a0f2e}
#roll.down{transform:scale(.95)}
#roll.off{filter:grayscale(.7) brightness(.8)}
#rollInfo{position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:600;z-index:12;text-shadow:0 1px 0 #000}
#rollBar{display:inline-block;width:150px;height:9px;border-radius:5px;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,220,140,.8);vertical-align:middle;margin-right:6px;overflow:hidden}
#rollBar div{height:100%;width:0;background:linear-gradient(90deg,#7ee36a,#3fd0a0)}
/* Effekte */
.float{position:absolute;z-index:60;pointer-events:none;font-weight:700;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 10px rgba(255,200,80,.8);animation:rise 1.3s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.coinfx{position:absolute;width:30px;height:30px;z-index:59;pointer-events:none}
.spark{position:absolute;z-index:58;pointer-events:none;width:10px;height:10px;border-radius:50%;background:radial-gradient(#fff,#ffd25e 40%,rgba(255,210,94,0));animation:sp .9s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#banner{position:absolute;left:0;right:0;top:36%;z-index:70;text-align:center;pointer-events:none;display:none}
#banner div{display:inline-block;font-size:34px;font-weight:700;padding:6px 22px;background:linear-gradient(90deg,rgba(80,30,160,0),rgba(80,30,160,.9),rgba(80,30,160,0));text-shadow:0 3px 0 #2a0b5e,0 0 18px #ffcf6b;animation:ban 1.8s ease forwards}
@keyframes ban{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#flash{position:absolute;inset:0;z-index:69;pointer-events:none;background:radial-gradient(circle,rgba(255,240,180,.85),rgba(255,200,80,0) 70%);opacity:0}
#flash.on{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
/* Fenster */
.ov{position:absolute;inset:0;z-index:80;background:rgba(14,6,36,.72);display:flex;align-items:center;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.panel{width:356px;max-height:92%;overflow:auto;border-radius:22px;background:linear-gradient(#4b2f9e,#2a1a63);border:3px solid #ffd77a;box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.2);padding:16px;position:relative;animation:pin .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes pin{from{transform:scale(.7);opacity:0}}
.panel h2{text-align:center;font-size:22px;margin:0 0 8px;text-shadow:0 2px 0 #1b0b45}
.panel p{font-size:14px;line-height:1.35;text-align:center;color:#efe4ff;margin:6px 0}
.x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:#ff5d7a;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;z-index:2}
.btn{display:block;width:max-content;max-width:100%;margin:12px auto 0;min-width:180px;text-align:center;padding:12px 18px;border-radius:16px;background:linear-gradient(#7ee36a,#2fae5a);border:3px solid #fff;font-size:18px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 5px 0 #1d7a3c;cursor:pointer}
.btn.gold{background:linear-gradient(#ffe066,#f5a524);box-shadow:0 5px 0 #b86f0a;color:#5a2b00;text-shadow:none}
.btn.off{filter:grayscale(1) brightness(.8);pointer-events:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d7a3c}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.row{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border:1.5px solid rgba(255,220,140,.35);border-radius:14px;padding:8px}
.row img{width:64px;height:64px;object-fit:contain;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px}
.row .t small{display:block;font-size:12px;color:#d8c9ff}
.mini{padding:8px 10px;border-radius:12px;background:linear-gradient(#ffe066,#f5a524);border:2px solid #fff;color:#5a2b00;font-weight:700;font-size:13px;text-align:center;white-space:nowrap;cursor:pointer;box-shadow:0 3px 0 #b86f0a}
.mini.off{filter:grayscale(1);opacity:.6;pointer-events:none}
.mini.red{background:linear-gradient(#ff8a7a,#e0364f);color:#fff;box-shadow:0 3px 0 #8a1a2e}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.card{border-radius:14px;background:rgba(0,0,0,.25);border:2px solid rgba(255,220,140,.4);padding:6px;text-align:center;position:relative}
.card img{width:100%;aspect-ratio:1;object-fit:contain}
.card b{display:block;font-size:12px}
.card small{font-size:10px;color:#d8c9ff}
.card.lock img{filter:brightness(0) opacity(.35)}
.card.on{border-color:#7ee36a;box-shadow:0 0 12px #7ee36a}
.r0{color:#d8e6c8}.r1{color:#8fd0ff}.r2{color:#d49cff}.r3{color:#ffcf5a}.r4{color:#ff9ce0}
/* Minispiele */
#game2{position:absolute;inset:0;z-index:75;display:none;overflow:hidden}
#game2 .bg2{position:absolute;inset:0;background:url(assets/sky.webp) center/cover;filter:hue-rotate(-25deg) saturate(1.2) brightness(.85)}
#g2head{position:absolute;left:0;right:0;top:14px;text-align:center;z-index:3}
#g2head b{font-size:22px;text-shadow:0 2px 0 #1b0b45,0 0 12px #ff5d7a}
#g2head small{display:block;font-size:13px;color:#ffe6a8}
#g2k{position:absolute;left:0;right:0;top:80px;height:420px;z-index:2}
#meter{position:absolute;left:30px;right:30px;height:26px;border-radius:13px;background:rgba(0,0,0,.5);border:2px solid #fff;overflow:hidden;z-index:4}
#meter .zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#ffe066,#7ee36a,#ffe066)}
#meter .needle{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:#fff;box-shadow:0 0 8px #fff;border-radius:3px}
.target{outline:3px dashed #ff5d7a;outline-offset:4px;border-radius:12px}
.proj{position:absolute;width:44px;height:44px;z-index:6;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#fff,#ffd25e 35%,#ff6b2b 60%,rgba(255,80,0,0) 72%);box-shadow:0 0 30px #ff9a3c}
.boom{position:absolute;z-index:7;pointer-events:none;width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffd25e 25%,#ff6b2b 45%,rgba(255,80,0,0) 70%);animation:boom .6s ease-out forwards}
@keyframes boom{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
#tiles{position:absolute;left:30px;right:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;z-index:4}
.tile{aspect-ratio:1;border-radius:16px;background:radial-gradient(circle at 40% 30%,#8f6bff,#3c2290);border:3px solid #ffd77a;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 0 #23125a;position:relative}
.tile img{width:78%;height:78%;object-fit:contain}
.tile.open{background:radial-gradient(circle,#fff6cf,#f5b938);transform:rotateY(360deg);transition:transform .5s}
.tile b{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:13px;text-shadow:0 1px 0 #000}
/* Glücksrad */
#wheel{width:280px;height:280px;margin:10px auto;border-radius:50%;position:relative;border:6px solid #ffd77a;box-shadow:0 0 24px rgba(255,210,94,.6);transition:transform 4.2s cubic-bezier(.12,.8,.15,1)}
#wheelPin{position:absolute;left:50%;top:44px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #ff3d6b;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 2px 2px #000)}
.hero{position:absolute;pointer-events:none}
#padHelp{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:10px;color:#e4d8ff;opacity:.8;z-index:12;display:none}
#focus{position:absolute;z-index:90;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 3px #4aa3ff,0 0 14px #4aa3ff;pointer-events:none;display:none;transition:all .12s}

/* ---- v2 ---- */
.side{top:112px}
.sb{width:52px;height:52px}
.sb img{width:40px;height:40px}
#payBtn{position:absolute;right:8px;top:58px;z-index:21;background:linear-gradient(#ffe066,#f5a524);color:#5a2b00;border:2px solid #fff;border-radius:12px;font-size:12px;font-weight:700;padding:3px 8px;cursor:pointer;box-shadow:0 3px 0 #b86f0a}
#payBtn b{display:inline-block;width:16px;height:16px;border-radius:50%;background:#5a2b00;color:#ffe066;text-align:center;line-height:16px;font-size:11px;margin-left:2px}
#deck{position:absolute;right:2px;bottom:30px;width:50px;height:66px;z-index:11;cursor:pointer}
#deck .dk{position:absolute;inset:0;border-radius:8px;background:url(assets/card_back.webp) center/cover,linear-gradient(#7b4ce0,#3c2290);border:2px solid #ffd77a;box-shadow:0 3px 6px rgba(0,0,0,.4)}
#deck .dk:nth-child(1){transform:rotate(-8deg) translate(-4px,2px)}#deck .dk:nth-child(2){transform:rotate(5deg) translate(3px,1px)}
#deck .dk.top{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#9b6bff,#3c2290);}
#deck .dk.top::after{content:'';width:38px;height:38px;background:url(assets/ic_card.webp) center/contain no-repeat}
#deck span{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);display:flex;align-items:center;gap:1px;background:#2a1c4f;border:1.5px solid #ffd77a;border-radius:9px;padding:0 5px 0 1px;font-size:11px;white-space:nowrap}
#deck span img{width:16px;height:16px}
#petOnTray{position:absolute;right:-2px;top:-46px;width:66px;z-index:11;animation:lion 3s ease-in-out infinite reverse;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
#result{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);z-index:12;background:rgba(30,12,70,.88);border:2px solid #ffd77a;border-radius:14px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:3px;opacity:0;pointer-events:none}
#result b{color:#ffe27a;font-size:15px;margin-left:4px}
#result.on{animation:resIn 2.6s ease forwards}
@keyframes resIn{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}10%{opacity:1;transform:translate(-50%,0) scale(1.05)}18%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;top:100px;transform:translateX(-50%);z-index:95;background:rgba(20,8,50,.94);border:2px solid #ffd77a;border-radius:14px;padding:8px 14px;font-size:14px;font-weight:600;max-width:340px;text-align:center;pointer-events:none;transition:opacity .3s}
#auto.on{filter:brightness(1.25) drop-shadow(0 0 8px #ffd25e)}
.btn.red{background:linear-gradient(#ff8a7a,#e0364f);box-shadow:0 5px 0 #8a1a2e}
.tag.red{background:linear-gradient(#ff8a7a,#e0364f);animation:none;top:auto;bottom:-22px}
.red{color:#ff9a8a}
.tip{font-size:12.5px!important;color:#ffe6a8!important;background:rgba(0,0,0,.2);border-radius:10px;padding:6px 8px}
.panel h3{font-size:15px;margin:10px 0 4px;color:#ffe27a}
.smoke{position:absolute;left:50%;top:25%;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:radial-gradient(circle,rgba(90,80,100,.8),rgba(90,80,100,0) 70%);animation:smoke 2s infinite}
.bar{height:8px;border-radius:4px;background:rgba(0,0,0,.4);margin:4px 2px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#ffd25e,#7ee36a);transition:width .4s}
@keyframes pulse2{50%{transform:scale(1.1) rotate(4deg)}}
.rays{position:absolute;width:300px;height:300px;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,230,140,0),rgba(255,230,140,.55),rgba(255,230,140,0),rgba(255,230,140,.55),rgba(255,230,140,0));animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card small{display:block}
.grid3.g4{grid-template-columns:repeat(4,1fr);gap:6px}
.cardart{width:100%;aspect-ratio:.72;border-radius:10px;background:center/cover no-repeat,linear-gradient(#7b4ce0,#3c2290);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.card.lock .cardart{filter:grayscale(1) brightness(.5)}
.cardflip{width:170px;height:236px;margin:6px auto 0;perspective:900px}
.cf-in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.cardflip.flip .cf-in{transform:rotateY(180deg)}
.cf-back,.cf-front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px}
.cf-back{background:url(assets/ic_card.webp) center/60% no-repeat,radial-gradient(circle,#9b6bff,#2a1a63);border:4px solid #ffd77a}
