<script>
"use strict";
/* =====================================================================
   Omas Dachboden – Cozy-Sortierspiel (Hochkant 9:16)
   ===================================================================== */
const O='#5b3a29';let E=0,SY=92,TY=518,AH=640;
const $=s=>document.querySelector(s);
const app=$('#app');
let SC=1;
function fit(){const nh=Math.round(Math.min(800,Math.max(640,360*innerHeight/innerWidth)));const ch=nh!==AH;AH=nh;E=AH-640;SY=92+E;TY=518+E;
 app.style.height=AH+'px';app.style.marginTop=(-AH/2)+'px';$('#stage').style.height=(400+E)+'px';$('#track').style.top=E+'px';$('#hint').style.top=(492+E)+'px';$('#tray').style.top=(518+E)+'px';
 SC=Math.min(innerWidth/360,innerHeight/AH);app.style.transform=`scale(${SC})`;return ch}
function loc(e){const r=app.getBoundingClientRect();return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
const rnd=(a,b)=>a+Math.random()*(b-a);
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%9973;return h}

/* ================= Ton: sanfte Klänge + Musik ================= */
let AC=null,master,sfxBus,musBus,sndMode=0;// 0 alles an · 1 Musik aus · 2 stumm
function au(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();
  const dl=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter(),wet=AC.createGain();dl.delayTime.value=.27;fb.gain.value=.32;lp.type='lowpass';lp.frequency.value=1900;wet.gain.value=.4;
  sfxBus=AC.createGain();musBus=AC.createGain();sfxBus.connect(master);musBus.connect(master);sfxBus.connect(dl);musBus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(master);
  const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);applySnd();startMusic()}
 if(AC.state==='suspended')AC.resume()}catch(e){}}
function applySnd(){if(!AC)return;const t=AC.currentTime;master.gain.setTargetAtTime(sndMode===2?0:.9,t,.08);musBus.gain.setTargetAtTime(sndMode===0?.5:0,t,.3);$('#sndBtn').textContent=['🎵','🔊','🔈'][sndMode]}
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume()});
function note(f,{t=0,d=.4,v=.08,type='sine',a=.005,bus,slide=0,lp=0}={}){if(!AC||sndMode===2&&bus!==musBus)return;try{const T=(t>1e3?t:AC.currentTime+t),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,T);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,T+d);
 g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(v,T+a);g.gain.exponentialRampToValueAtTime(.0001,T+d);let n=o;
 if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl}n.connect(g).connect(bus||sfxBus);o.start(T);o.stop(T+d+.05)}catch(e){}}
function hush(d=.1,v=.04,f=1200,type='lowpass',t=0,bus){if(!AC)return;try{const T=t>1e3?t:AC.currentTime+t,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
