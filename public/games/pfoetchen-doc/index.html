<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pfötchen-Doc – Lewolux Kids</title>
<meta name="theme-color" content="#5aa9e6">
<style>
@font-face{font-family:F;src:url(fonts/fredoka-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--ink:#23405e;--bl:#5aa9e6;--pk:#ff6fa5;--gr:#4cc26a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8f7;font-family:F,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
img{-webkit-user-drag:none;user-select:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#bgb{position:fixed;inset:-40px;background:url(assets/bg.webp?v=1) center/cover;filter:blur(18px) brightness(.85)}
#stage{position:absolute;left:50%;top:50%;transform-origin:0 0;overflow:hidden}
.scr{position:absolute;inset:0}
#kbg{position:absolute;inset:0;background:url(assets/bg.webp?v=1) center 75%/cover}
#hud{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:14px;padding:12px 18px;z-index:30}
.rb{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 6px 0 #a9cbe6,0 10px 18px rgba(0,0,0,.2);display:grid;place-items:center;font-size:40px;flex:none;transition:transform .12s}
.rb:active{transform:translateY(4px) scale(.95);box-shadow:0 2px 0 #a9cbe6}
.coins{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.93);border-radius:40px;padding:6px 18px 6px 8px;font-size:34px;box-shadow:0 5px 0 rgba(0,0,0,.15);flex:none}
.coin{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23a 40%,#e89b0c);box-shadow:inset 0 -4px 0 #c87a00,0 2px 0 #9a5d00;display:inline-grid;place-items:center;color:#b06a00;font-size:24px;flex:none}
.coin::before{content:"🐾";font-size:.8em;filter:sepia(1) saturate(3) hue-rotate(-10deg) brightness(.8)}
#prog{display:flex;gap:6px;margin-left:auto;background:rgba(255,255,255,.88);border-radius:40px;padding:6px 10px}
#prog i{width:56px;height:56px;border-radius:50%;background:#e3eef8 center 30%/92% no-repeat;display:block;position:relative;opacity:.55}
#prog i.now{opacity:1;box-shadow:0 0 0 4px var(--pk)}
#prog i.done{opacity:1}
#prog i.done::after{content:"❤";position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--pk);color:#fff;font-size:16px;display:grid;place-items:center}
/* Tisch & Patient */
#table{position:absolute;z-index:6}
#table img{width:100%;display:block}
#pat{position:absolute;z-index:8;transform-origin:50% 100%}
#pat .pi{position:absolute;inset:0;transform-origin:50% 100%;touch-action:none}
#pat .pi>img{position:absolute;left:0;top:0;width:100%;height:100%}
#pat.idle .pi{animation:breathe 1.8s ease-in-out infinite}
#pat.sad .pi{animation:sadB 2.2s ease-in-out infinite}
#pat.happy .pi{animation:jump .5s ease-in-out infinite}
#pat.shake .pi{animation:shake .12s linear 4}
#pat.sneeze .pi{animation:sneezeA .6s ease-in-out}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
@keyframes sadB{50%{transform:scale(1.01,.985) rotate(-1.5deg)}}
@keyframes jump{50%{transform:translateY(-36px) scale(1.03,.98)}}
@keyframes shake{25%{transform:translateX(-7px) rotate(-3deg)}75%{transform:translateX(7px) rotate(3deg)}}
@keyframes sneezeA{0%{transform:none}40%{transform:scale(1.05,.95) rotate(-4deg)}55%{transform:translateY(-10px) rotate(6deg) scale(.96,1.05)}100%{transform:none}}
.ovl{position:absolute;pointer-events:none;transform:translate(-50%,-50%);transition:opacity .35s,transform .35s}
.ovl img{display:block;width:100%;height:auto}
.ovl.gone{opacity:0!important;transform:translate(-50%,-50%) scale(.3)!important}
.cheek{position:absolute;width:16%;height:9%;border-radius:50%;background:radial-gradient(#ff5a5a,rgba(255,90,90,0) 70%);transform:translate(-50%,-50%);pointer-events:none;transition:opacity .5s;mix-blend-mode:multiply}
#spot{position:absolute;z-index:13;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;touch-action:none}
#spot::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(rgba(255,255,255,.55),rgba(255,240,120,.25) 60%,rgba(255,240,120,0) 72%);box-shadow:0 0 0 5px rgba(255,255,255,.9),0 0 26px 10px rgba(255,214,60,.85);animation:glow 1s ease-in-out infinite}
#spot svg{position:absolute;inset:-10%;width:120%;height:120%;transform:rotate(-90deg)}
#spot circle{fill:none;stroke:#4cc26a;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .12s}
#hand{position:absolute;left:55%;top:60%;font-size:64px;pointer-events:none;animation:handB .8s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
@keyframes handB{50%{transform:translate(-8px,-14px) scale(1.1)}}
@keyframes glow{50%{transform:scale(1.12);opacity:.75}}
#toolCur{position:absolute;z-index:16;pointer-events:none;transform:translate(-50%,-50%) rotate(-15deg);filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
#toolCur.work{animation:work .18s ease-in-out infinite}
@keyframes work{50%{transform:translate(-50%,-50%) rotate(-4deg) translateY(5px)}}
#clinic{touch-action:none}
.tool.lift{transform:translateY(-8px) scale(1.06)}
.ovl.em span{display:block;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.ovl.target{filter:drop-shadow(0 0 8px rgba(255,230,90,.95))}
.ovl.germ img{animation:wig .7s ease-in-out infinite}
.ovl.steam{width:9%;aspect-ratio:1}
.ovl.steam span{width:100%;height:100%;border-radius:50%;background:radial-gradient(rgba(255,255,255,.95),rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 70%);animation:steamA 1.4s ease-in-out infinite}
@keyframes steamA{50%{transform:translateY(-10px) scale(1.15)}}
.tag{position:absolute;z-index:15;transform:translate(-50%,-50%);background:#fff;border-radius:22px;padding:6px 16px;font-size:36px;color:#3b7fc0;box-shadow:0 5px 0 rgba(0,0,0,.15);pointer-events:none;transition:color .3s,transform .3s}
.tag.hot{color:#e5484d}.tag.boom{transform:translate(-50%,-50%) scale(1.3)}
.pourui{position:absolute;z-index:14;width:0;height:0;pointer-events:none}
.pourui .bottle{position:absolute;width:120px;left:-40px;top:-175px;transform-origin:60% 80%;transition:transform .3s;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.pourui .bottle.pour{transform:rotate(-120deg) translate(10px,30px)}
.pourui .meter{position:absolute;left:-150px;top:-110px;width:26px;height:150px;border-radius:13px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);overflow:hidden}
.pourui .meter i{position:absolute;left:0;right:0;bottom:62%;height:38%;background:#bff0c8;border-top:3px solid #4cc26a}
.pourui .meter b{position:absolute;left:4px;right:4px;bottom:4px;border-radius:9px;background:#a0522d;height:0}
.spoon{position:absolute;z-index:15;width:0;height:0;pointer-events:none;transition:left .2s,top .2s}
.spoon.held{transition:none}
.spoon i{position:absolute;left:-60px;top:-28px;width:120px;height:56px;border-radius:50%;background:radial-gradient(#f4f6f8,#b9c3cc);box-shadow:0 5px 0 #8b97a2,inset 0 4px 8px rgba(0,0,0,.2)}
.spoon i::after{content:"";position:absolute;left:110px;top:20px;width:90px;height:16px;border-radius:8px;background:#b9c3cc;box-shadow:0 4px 0 #8b97a2}
.spoon s{position:absolute;left:12px;top:8px;width:96px;height:40px;border-radius:50%;background:radial-gradient(#c96a33,#8a3d14);transform:scale(0);transition:transform .08s}
.sheart{position:absolute;z-index:17;transform:translate(-50%,-50%);pointer-events:none;line-height:1}
#vcur{position:absolute;z-index:60;font-size:64px;transform:translate(-30%,-10%);pointer-events:none;filter:drop-shadow(0 0 6px #3be8ff) drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.demo{display:flex;align-items:flex-end;z-index:95}
.demo span{margin-left:-30%;line-height:1}
/* Sprechblase */
#bub{position:absolute;z-index:12;background:#fff;border-radius:34px;padding:14px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 0 rgba(0,0,0,.12),0 14px 30px rgba(0,0,0,.2);transform-origin:100% 100%;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s}
#bub.off{transform:scale(0);opacity:0;pointer-events:none}
#bub::after{content:"";position:absolute;right:-30px;top:30px;border:14px solid transparent;border-left:24px solid #fff}
#bub .bi{width:96px;height:96px;border-radius:22px;background:#eef6fd;display:grid;place-items:center;position:relative}
#bub .bi img{width:86px;height:86px;object-fit:contain}
#bub .bi.done{background:#d7f7c9}
#bub .bi.done::after{content:"✔";position:absolute;right:-8px;top:-8px;width:34px;height:34px;border-radius:50%;background:var(--gr);color:#fff;font-size:22px;display:grid;place-items:center}
#bub .bi.rw{cursor:pointer;box-shadow:0 0 0 4px #ffd23a;animation:bob2 1s ease-in-out infinite}
#bub .bi.rw:nth-child(2){animation-delay:-.5s}
@keyframes bob2{50%{transform:translateY(-6px)}}
/* Doktor */
#doc{position:absolute;z-index:9;transform-origin:50% 100%}
#doc .ci{height:100%;transform-origin:50% 100%;animation:breathe 2.2s ease-in-out infinite}
#doc .ci>img{height:100%;display:block}
#doc.talk .ci{animation:talk .3s ease-in-out infinite}
@keyframes talk{50%{transform:scale(1.02,.98) translateY(-4px)}}
/* Werkzeug-Ablage */
#tray{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px;padding:12px 16px calc(12px + var(--sb));background:linear-gradient(#ffffff,#dcecf9);border-top:6px solid #a9cbe6;box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.tool{width:104px;height:104px;border-radius:24px;background:#fff;box-shadow:0 6px 0 #9fc2df,0 9px 14px rgba(0,0,0,.18);display:grid;place-items:center;position:relative;transition:transform .12s,box-shadow .12s}
.tool img{width:86%;height:86%;object-fit:contain}
.tool:active{transform:translateY(5px);box-shadow:0 1px 0 #9fc2df}
.tool.sel{box-shadow:0 0 0 6px var(--gr),0 6px 0 #9fc2df;transform:translateY(-8px)}
.tool.hint img{animation:wig .6s ease-in-out infinite}
.tool.hint{box-shadow:0 0 0 6px #ffd23a,0 0 24px 6px rgba(255,210,60,.8)}
.tool.no{animation:shake .12s linear 3}
.tool.new::before{content:"NEU";position:absolute;top:-10px;right:-10px;background:var(--pk);color:#fff;font-size:16px;padding:3px 8px;border-radius:12px;z-index:2}
@keyframes wig{25%{transform:rotate(-12deg) scale(1.08)}75%{transform:rotate(12deg) scale(1.08)}}
.pt{position:fixed;left:0;top:0;pointer-events:none;z-index:100;font-size:44px;line-height:1;will-change:transform,opacity}
.fly{position:fixed;left:0;top:0;pointer-events:none;z-index:90;will-change:transform}
/* Titel */
#title{background:url(assets/title.webp?v=1) center/cover}
.port #title{background-position:64% center}
#title .logo{position:absolute;left:50%;top:calc(22px + var(--st));transform:translateX(-50%);font-size:90px;color:#fff;text-align:center;line-height:.92;-webkit-text-stroke:4px #1f5d93;paint-order:stroke fill;text-shadow:0 8px 0 #1f5d93,0 14px 24px rgba(0,0,0,.3);white-space:nowrap;animation:logo 2.6s ease-in-out infinite}
#title .logo span{color:#ffd23a}
@keyframes logo{50%{transform:translateX(-50%) rotate(-2deg) scale(1.03)}}
.pbr{display:none}.port .pbr{display:inline}
.port #title .logo{top:calc(110px + var(--st));font-size:96px}
#tmenu{position:absolute;left:0;right:0;bottom:calc(26px + var(--sb));display:flex;justify-content:center;align-items:flex-end;gap:22px;flex-wrap:wrap;padding:0 16px}
.big{width:150px;height:150px;border-radius:40px;background:#fff;box-shadow:0 9px 0 #8fb8dd,0 14px 26px rgba(0,0,0,.3);display:grid;place-items:center;position:relative;transition:transform .12s}
.big:active{transform:translateY(6px);box-shadow:0 3px 0 #8fb8dd}
.big img{width:116px;height:116px;object-fit:contain}
.big .em{font-size:84px}
.big.play{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9ff0b0,#3fbf62);box-shadow:0 10px 0 #23863e,0 16px 30px rgba(0,0,0,.35);animation:pulse2 1.4s ease-in-out infinite}
.big.play svg{width:110px;height:110px;margin-left:14px}
.port .big.play{order:-1;margin:0 calc(50% - 105px)}
@keyframes pulse2{50%{transform:scale(1.06)}}
.badge{position:absolute;top:-10px;right:-10px;min-width:44px;height:44px;border-radius:22px;background:var(--pk);color:#fff;font-size:24px;display:grid;place-items:center;padding:0 8px;box-shadow:0 3px 0 #c23b74}
#ttop{position:absolute;left:0;right:0;top:calc(14px + var(--st));display:flex;justify-content:space-between;padding:0 18px;z-index:3}
#gift{position:absolute;z-index:4;width:150px;height:150px;animation:giftW 1.2s ease-in-out infinite}
#gift .em{font-size:110px;display:block;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
@keyframes giftW{0%,100%{transform:rotate(0)}10%{transform:rotate(-10deg) scale(1.08)}20%{transform:rotate(10deg) scale(1.08)}30%{transform:rotate(0)}}
#notd{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.93);border-radius:30px;padding:10px 14px 8px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
#notd img{height:120px}
#notd b{font-size:24px;display:flex;align-items:center;gap:6px}
/* Panels */
.panel{position:absolute;inset:0;background:linear-gradient(#7cc0ee,#4a90c9);display:flex;flex-direction:column}
.ptop{display:flex;align-items:center;gap:14px;padding:calc(12px + var(--st)) 18px 10px}
.ptop h2{margin:0;font-size:48px;color:#fff;display:flex;align-items:center;gap:12px;text-shadow:0 4px 0 rgba(0,0,0,.2)}
.grid{flex:1;overflow:auto;display:grid;gap:16px;padding:10px 18px calc(18px + var(--sb));align-content:start;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.card{background:#fff;border-radius:28px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 7px 0 rgba(0,0,0,.18);position:relative}
.card .pic{height:170px;display:flex;align-items:flex-end;justify-content:center}
.card .pic img{max-height:170px;max-width:100%}
.card.lock .pic img{filter:brightness(0) opacity(.3)}
.card .hearts{font-size:26px;color:var(--pk);min-height:32px}
/* Kuschelzimmer */
#room .rbg{position:absolute;left:0;right:0;top:0;background:url(assets/room.webp?v=1) center bottom/cover}
#room .rhud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:calc(12px + var(--st)) 18px;z-index:30}
#rarea{position:absolute;left:0;right:0;top:0}
.ritem{position:absolute;transform:translateX(-50%);transform-origin:50% 100%}
.ritem img{display:block;width:100%;height:auto}
.ritem.pet{transition:transform .2s}
.ritem.pet.happy{animation:jumpR .5s ease-in-out 3}
@keyframes jumpR{50%{transform:translateX(-50%) translateY(-30px)}}
#rshop{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;overflow-x:auto;padding:10px 16px calc(10px + var(--sb));background:rgba(255,255,255,.92);border-top:6px solid #a9cbe6;scrollbar-width:none;justify-content:safe center}
#rshop::-webkit-scrollbar{display:none}
.deco{flex:none;width:118px;height:132px;border-radius:22px;background:#fff;box-shadow:0 5px 0 #9fc2df;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.deco img{height:78px;max-width:100px;object-fit:contain}
.deco .pr{display:flex;align-items:center;gap:4px;font-size:24px}
.deco .pr .coin{width:30px;height:30px;font-size:14px}
.deco.own{background:#e5f8e9}
.deco.own .pr{color:var(--gr);font-size:30px}
.deco.poor{opacity:.55}
/* Overlay */
#ov{position:absolute;inset:0;z-index:60;background:rgba(20,50,90,.5);display:grid;place-items:center}
.box{background:#fff;border-radius:44px;padding:28px 34px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 12px 0 #8fb8dd,0 20px 50px rgba(0,0,0,.35);animation:boxIn .45s cubic-bezier(.3,1.6,.5,1);max-width:92%}
@keyframes boxIn{from{transform:scale(.3)}}
.stars{display:flex;gap:12px}
.stars i{font-style:normal;font-size:110px;color:#e1e9f2;line-height:1}
.stars i.on{color:#ffc21a;animation:starIn .5s cubic-bezier(.3,1.8,.5,1) both;text-shadow:0 6px 0 #d48a00}
@keyframes starIn{from{transform:scale(0) rotate(-180deg)}}
.row{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.got{display:flex;align-items:center;gap:10px;font-size:52px}
.newi{display:flex;flex-direction:column;align-items:center;background:#fff4d6;border-radius:26px;padding:10px 16px;position:relative}
.newi img{height:110px}
.newi.sil img{height:140px;filter:brightness(0) opacity(.45)}
.newi::before{content:"NEU";position:absolute;top:-12px;background:var(--pk);color:#fff;font-size:20px;padding:3px 10px;border-radius:12px}
.go{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9ff0b0,#3fbf62);box-shadow:0 8px 0 #23863e;display:grid;place-items:center}
.go svg{width:62px;height:62px;margin-left:8px}
#flash{position:absolute;inset:0;z-index:55;pointer-events:none;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);opacity:0}
#flash.on{animation:flash .7s}
@keyframes flash{30%{opacity:.85}}
#siren{position:absolute;inset:0;z-index:54;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,60,60,0) 55%,rgba(255,60,60,.45))}
#siren.on{animation:siren .5s ease-in-out 6}
@keyframes siren{50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="bgb"></div>
<div id="stage">
  <section id="title" class="scr">
    <div class="logo">Pfötchen-<br class="pbr"><span>Doc</span></div>
    <div id="ttop"><span class="coins"><span class="coin"></span><b class="cv">0</b></span><button class="rb snd" data-say="Ton" aria-label="Ton">🔊</button></div>
    <button id="gift" hidden data-say="Geschenk" aria-label="Geschenk"><span class="em">🎁</span></button>
    <div id="notd" hidden><b><span>🚑</span><span class="coin" style="width:30px;height:30px;font-size:14px"></span><span>×2</span></b><img alt=""></div>
    <div id="tmenu">
      <button class="big" id="bAlbum" data-say="Tier-Album" aria-label="Tier-Album"><img src="assets/p1_3.webp?v=1" alt=""><span class="badge" hidden id="albN"></span></button>
      <button class="big play" id="bPlay" data-say="Behandeln" aria-label="Behandeln"><svg viewBox="0 0 24 24"><path d="M5 3.5v17l15-8.5z" fill="#fff" stroke="#1d7a36" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      <button class="big" id="bRoom" data-say="Kuschelzimmer" aria-label="Kuschelzimmer"><img src="assets/deco_0.webp?v=1" alt=""><span class="badge" hidden id="roomN"></span></button>
    </div>
  </section>

  <section id="clinic" class="scr" hidden>
    <div id="kbg"></div>
    <div id="hud"><button class="rb" id="kHome" data-say="Zurück" aria-label="Zurück">🏠</button><span class="coins"><span class="coin"></span><b class="cv">0</b></span><div id="prog"></div></div>
    <div id="table"><img src="assets/table.webp?v=1" alt=""></div>
    <div id="pat" hidden><div class="pi"><img alt=""><div class="ovs"></div></div></div>
    <div id="bub" class="off"></div>
    <div id="doc"><div class="ci"><img src="assets/doc_1.webp?v=1" alt=""></div></div>
    <img id="toolCur" hidden alt="">
    <div id="tray"></div>
    <div id="siren"></div>
    <div id="flash"></div>
  </section>

  <section id="room" class="scr" hidden>
    <div class="rbg"></div>
    <div id="rarea"></div>
    <div class="rhud"><button class="rb back" data-say="Zurück" aria-label="Zurück">🏠</button><span class="coins"><span class="coin"></span><b class="cv">0</b></span></div>
    <div id="rshop"></div>

/* 1) Werkzeug zum Tier ziehen */

/* Reiben/Schrubben: Werkzeug über alle Ziele bewegen */

    tg.forEach(g => g.el.classList.add("target"));

      rem: () => { say(o.say); tg.filter(g => g.hp > 0).forEach(g => g.el.animate([{ scale: 1 }, { scale: 1.4 }, { scale: 1 }], 600)); },
      down(x, y) { [lx, ly] = o.t != null ? tp() : [x, y]; if (o.t != null) { showCur(o.t, lx, ly, o.sz); $("#toolCur").classList.add("work"); } },
