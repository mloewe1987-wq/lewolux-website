<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16122f">
<title>Ring Legends</title>

<link href="fonts/fonts.css" rel="stylesheet">
<style>:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #eeeafc; --bg2: #ddd6fa; --surface: #ffffff; --surface2: #f4f1ff;
  --ink: #1a1638; --ink-soft: #5b5580; --line: rgba(26, 22, 56, .12);
  --red: #e0233d; --blue: #2d6cdf; --gold: #f2b705; --gold-deep: #9c6b00; --rope-white: #ffffff;
  --display: 'Bungee', 'Impact', 'Arial Black', sans-serif;
  --body: 'Barlow Semi Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --sign: 'Permanent Marker', 'Brush Script MT', cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16122f; --bg2: #221b4a; --surface: #262052; --surface2: #2f2862;
    --ink: #f3f0ff; --ink-soft: #aaa3d8; --line: rgba(255, 255, 255, .1); --rope-white: #e8e6f5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16122f; --bg2: #221b4a; --surface: #262052; --surface2: #2f2862;
  --ink: #f3f0ff; --ink-soft: #aaa3d8; --line: rgba(255, 255, 255, .1); --rope-white: #e8e6f5;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
img, svg { max-width: 100%; }

.app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding-bottom: 88px; }

/* ---------- Header & Seile ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg);
}
.logo { font-family: var(--display); font-size: 21px; font-weight: 400; margin: 0; flex: 1; letter-spacing: .01em; line-height: 1; }
.coins {
  display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums;
}
.coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff4b5, var(--gold) 55%, var(--gold-deep)); box-shadow: inset 0 0 0 2px rgba(0,0,0,.12); }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; }
.icon-btn:active { background: var(--line); }
.ropes { display: grid; gap: 3px; padding: 0 0 2px; }
.ropes i { display: block; height: 3px; }
.ropes i:nth-child(1) { background: var(--red); }
.ropes i:nth-child(2) { background: var(--rope-white); box-shadow: 0 0 0 .5px var(--line); }
.ropes i:nth-child(3) { background: var(--blue); }

main { padding: 16px 14px 24px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 22px; border-radius: 14px; font-weight: 700; font-size: 17px; }
.btn.small { min-height: 36px; padding: 0 14px; font-size: 15px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn.primary { background: var(--gold); color: #2a1d00; box-shadow: 0 3px 0 var(--gold-deep); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-deep); }
.btn.primary:disabled { background: var(--line); color: var(--ink-soft); box-shadow: none; }
.btn.ghost { border: 2px solid var(--line); background: var(--surface); }
.btn.danger { background: var(--red); color: #fff; }
.btn.text { min-height: 32px; padding: 0 6px; color: var(--ink-soft); font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar.big { height: 12px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); border-radius: inherit; transition: width .6s ease; }
.muted { color: var(--ink-soft); }
.small { font-size: 14px; }

/* ---------- Packs ---------- */
.pack-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pack-slot { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.pack-btn { width: 100%; filter: drop-shadow(0 10px 14px rgba(0,0,0,.25)); transition: transform .2s; }
.pack-slot.ready .pack-btn { animation: packIdle 3.2s ease-in-out infinite; }
.pack-slot.pack-gold.ready .pack-btn { animation-delay: -1.6s; }
.pack-btn:disabled { filter: grayscale(.75) brightness(.8) drop-shadow(0 6px 8px rgba(0,0,0,.2)); }
.pack-btn:not(:disabled):active { transform: scale(.96); }
@keyframes packIdle { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-6px) rotate(1deg); } }
.pack-svg { display: block; width: 100%; height: auto; }
.pack-title { font-family: var(--display); font-size: 34px; }
.pack-sub { font-family: var(--body); font-weight: 700; font-size: 17px; }
.pack-shine { animation: shine 3.6s ease-in-out infinite; }
@keyframes shine { 0%, 60% { transform: translateX(0); } 100% { transform: translateX(440px); } }
.pack-info { display: grid; gap: 2px; min-height: 48px; }
.pack-info strong { font-size: 17px; line-height: 1.15; }
.pack-info span { font-size: 15px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.progress-card {
  display: flex; align-items: center; gap: 16px; width: 100%; margin-top: 22px; padding: 14px 16px;
  background: var(--surface); border-radius: 18px; border: 1px solid var(--line); text-align: left;
}
.progress-num { font-family: var(--display); font-size: 18px; color: var(--ink-soft); white-space: nowrap; }
.progress-num span { font-size: 36px; color: var(--ink); }
.progress-text { flex: 1; display: grid; gap: 8px; }
.quest-callout {
  display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 12px; padding: 14px 16px;
  border-radius: 18px; background: var(--gold); color: #2a1d00; font-weight: 700;
}

/* ---------- Sheet ---------- */
.sheet-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(8, 6, 24, .55); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet {
  width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0;
  padding: 8px 18px calc(24px + env(safe-area-inset-bottom, 0px)); animation: sheetUp .28s cubic-bezier(.2, .9, .3, 1);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--surface); padding: 8px 0; }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 0; }
.sheet h3 { font-size: 17px; margin: 22px 0 6px; }
@keyframes sheetUp { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.odds-table { display: grid; gap: 2px; margin: 12px 0; overflow-x: auto; }
.odds-row { display: grid; grid-template-columns: 1.6fr 1fr 1.1fr; gap: 8px; padding: 9px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: 15px; }
.odds-row.head { font-weight: 700; color: var(--ink-soft); font-size: 14px; }
.rar { font-weight: 700; }
.rar-uncommon { color: #7d8799; } .rar-rare { color: #b8860b; } .rar-ultra { color: #c2185b; } .rar-mythic { color: #7b2ff7; }
.row-toggle { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-weight: 600; }
.row-toggle input { width: 22px; height: 22px; accent-color: var(--red); }
textarea.code { width: 100%; margin: 8px 0; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); font: 13px/1.3 ui-monospace, Menlo, monospace; resize: vertical; }

/* ---------- Karte ---------- */
.card { container-type: inline-size; position: relative; width: 100%; aspect-ratio: 5 / 7; border-radius: 5cqw; overflow: hidden; user-select: none; -webkit-user-select: none; }
.card-frame { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 3.4cqw; border-radius: inherit; }
.card-art { position: relative; aspect-ratio: 250 / 200; border-radius: 2.5cqw; overflow: hidden; order: 2; }
.art-svg { display: block; width: 100%; height: 100%; }
.card-head { order: 1; display: flex; align-items: center; justify-content: space-between; gap: 2cqw; padding: 1.5cqw 2.5cqw 2cqw 3cqw; }
.card-name { font-family: var(--display); font-size: 6.4cqw; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-ovr { font-family: var(--display); font-size: 6cqw; line-height: 1; padding: 1.2cqw 2cqw; border-radius: 2cqw; background: rgba(0,0,0,.12); }
.card-body { order: 3; flex: 1; display: flex; flex-direction: column; gap: 1.6cqw; padding: 2.4cqw 3cqw 1.2cqw; }
.card-gimmick { font-size: 4.6cqw; font-weight: 700; font-style: italic; line-height: 1.15; }
.card-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5cqw; }
.card-stats span { display: flex; flex-direction: column; align-items: center; font-size: 3.3cqw; font-weight: 600; padding: 1.2cqw 0; border-radius: 2cqw; background: rgba(0,0,0,.08); line-height: 1.1; }
.card-stats b { font-family: var(--display); font-weight: 400; font-size: 6cqw; }
.card-flavor { font-size: 3.7cqw; line-height: 1.25; opacity: .85; flex: 1; }
.card-foot { display: flex; justify-content: space-between; font-size: 3.4cqw; font-weight: 700; opacity: .8; }
.card-mininum { position: absolute; left: 4cqw; bottom: 3cqw; font-family: var(--display); font-size: 13cqw; line-height: 1; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
.card.mini .card-art { position: absolute; inset: 3.4cqw; aspect-ratio: auto; }

/* Gewöhnlich: matt */
.card.r-common .card-frame { background: #bdb8cc; color: #1f1b38; }
.card.r-common .card-body, .card.r-common .card-head { background: transparent; }
.card.r-common:not(.mini) .card-frame { background: linear-gradient(#c9c4d6, #aaa4bd); }
/* Ungewöhnlich: Silber */
.card.r-uncommon .card-frame { background: linear-gradient(135deg, #f3f5f9, #9aa1b1 30%, #eef0f5 50%, #8b93a5 75%, #dfe3ea); color: #1c2030; }
/* Selten: Gold */
.card.r-rare .card-frame { background: linear-gradient(135deg, #fff1b8, #d4a017 25%, #fff3c4 45%, #a87400 70%, #f9d976); color: #2a1d00; }
.card.r-rare .card-art { box-shadow: 0 0 0 .8cqw #7a5500; }
@keyframes sheen { 0% { background-position: 130% 0; } 60%, 100% { background-position: -130% 0; } }

/* Full Art: Ultra & Mythic */
.full .card-frame { padding: 0; color: #fff; }
.full .card-art { position: absolute; inset: 0; aspect-ratio: auto; border-radius: 0; }
.full .card-head { position: absolute; top: 0; left: 0; right: 0; padding: 5cqw 6cqw 10cqw 6.5cqw; background: linear-gradient(rgba(0,0,0,.55), transparent); }
.full .card-name, .full .card-gimmick { text-shadow: 0 .6cqw 1.6cqw rgba(0,0,0,.8); }
.full .card-ovr { background: rgba(255,255,255,.18); backdrop-filter: blur(2px); }
.full .card-body { position: absolute; left: 0; right: 0; bottom: 0; padding: 14cqw 6.5cqw 5.5cqw; background: linear-gradient(transparent, rgba(0,0,0,.82) 45%); flex: none; }
.full .card-stats span { background: rgba(255,255,255,.14); }
.full .card-flavor { flex: none; }
.card.r-ultra { box-shadow: inset 0 0 0 1.4cqw rgba(255,255,255,.5); }
.card.r-mythic { box-shadow: inset 0 0 0 1.8cqw #ffd700; }
.card.r-mythic::before {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit; padding: 1.8cqw;
  background: conic-gradient(from var(--a, 0deg), #ffd700, #ff4d6d, #c77dff, #4cc9f0, #80ffdb, #ffd700);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: spin 4s linear infinite;
}
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes spin { to { --a: 360deg; } }
@keyframes holo { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
.card-sign { position: absolute; right: 5cqw; top: 24%; z-index: 4; transform: rotate(-12deg); text-align: right; color: #ffd700; font-family: var(--sign); text-shadow: 0 0 2cqw rgba(0,0,0,.9); }
.card-sign span { display: block; font-size: 8cqw; line-height: 1; background: linear-gradient(100deg, #a87400 0%, #ffd700 calc(var(--mx) - 20%), #fffbe6 var(--mx), #ffd700 calc(var(--mx) + 20%), #a87400 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 .4cqw .6cqw rgba(0,0,0,.9)); }
.card-sign small { font-family: var(--body); font-weight: 700; font-size: 3.6cqw; color: #fff; }

/* Kartenrücken */
.card-back { background: #1a1638; box-shadow: inset 0 0 0 3cqw #2a2360; }
.back-inner { position: absolute; inset: 7cqw; border-radius: 3cqw; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8cqw;
  background: repeating-linear-gradient(45deg, #231d4d 0 4cqw, #1d1842 4cqw 8cqw); }
.back-logo { font-family: var(--display); font-size: 30cqw; line-height: 1; color: var(--gold); text-shadow: 1.2cqw 1.2cqw 0 var(--red); }
.back-ropes { width: 100%; display: grid; gap: 1.2cqw; }
.back-ropes i { height: 1.6cqw; }
.back-ropes i:nth-child(1) { background: var(--red); } .back-ropes i:nth-child(2) { background: #fff; } .back-ropes i:nth-child(3) { background: var(--blue); }
.aura-ultra { animation: aura 1.2s ease-in-out infinite; --aura: #4cc9f0; }
.aura-mythic { animation: aura .8s ease-in-out infinite; --aura: #ffd700; }
@keyframes aura { 50% { box-shadow: inset 0 0 0 3cqw #2a2360, 0 0 0 1.5cqw var(--aura), 0 0 10cqw var(--aura); } }

/* ---------- Album ---------- */
.album-head { display: grid; gap: 10px; margin-bottom: 14px; }
.album-count { font-weight: 600; color: var(--ink-soft); }
.album-count span { font-family: var(--display); font-size: 40px; color: var(--ink); line-height: 1; margin-right: 4px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin: 0 -14px 14px; padding-inline: 14px; scrollbar-width: none; }
.chips button { flex: none; padding: 8px 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.album-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 440px) { .album-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.slot { position: relative; display: block; width: 100%; content-visibility: auto; contain-intrinsic-block-size: auto 110px; }
.slot.owned:active { transform: scale(.95); }
.slot-count { position: absolute; top: -5px; right: -5px; min-width: 24px; padding: 1px 6px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700; }
.slot.unknown { min-width: 0; aspect-ratio: 5 / 7; border-radius: 8px; overflow: hidden; background: var(--surface2); border: 2px dashed var(--line); color: var(--line); display: grid; }
.slot.unknown .art-svg { grid-area: 1 / 1; align-self: center; height: auto; color: rgba(90, 80, 150, .22); }
.slot-q { grid-area: 1 / 1; place-self: center; font-family: var(--display); font-size: 30px; color: var(--ink-soft); opacity: .6; }
.slot-num { grid-area: 1 / 1; place-self: end start; margin: 0 0 4px 6px; font-weight: 700; font-size: 13px; color: var(--ink-soft); }
.u-rare, .u-ultra, .u-mythic { border-style: solid; }
.u-rare { border-color: rgba(212, 160, 23, .4); } .u-ultra { border-color: rgba(194, 24, 91, .35); } .u-mythic { border-color: rgba(123, 47, 247, .45); }

.detail { position: fixed; inset: 0; z-index: 50; background: rgba(8, 6, 24, .88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: calc(56px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px)); animation: fade .2s; color: #f3f0ff; }
.detail-close { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; color: #fff; }
.detail-card { width: min(78vw, 46vh, 360px); perspective: 900px; }
.detail-card .card { box-shadow: 0 30px 60px rgba(0,0,0,.5); }
.detail-info { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 420px; }
.detail-info .icon-btn { color: #fff; flex: none; }
.detail-info dl { flex: 1; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 15px; }
.detail-info dt { color: #aaa3d8; font-size: 13px; }
.detail-info dd { margin: 0; font-weight: 700; }

/* ---------- Quests ---------- */
.quest-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.quest { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.quest.done { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.quest.claimed { opacity: .55; }
.quest-main { flex: 1; display: grid; gap: 3px; }
.quest-main span { color: var(--ink-soft); font-size: 15px; }
.quest-main .bar { margin-top: 6px; }
.quest-main small { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.quest-state { font-size: 14px; font-weight: 700; color: var(--ink-soft); }

/* ---------- Tabbar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface);
  padding-bottom: env(safe-area-inset-bottom, 0px); max-width: 520px; margin: 0 auto; }
.tabbar .ropes { grid-column: 1 / -1; }
.tabbar button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 10px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.tabbar button.on { color: var(--ink); }
.tabbar button.on svg { color: var(--red); }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--red); color: #fff; font-style: normal; font-size: 12px; line-height: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; max-width: min(92vw, 460px);
  padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 600; animation: toastIn .25s ease-out; text-align: center; }
@keyframes toastIn { from { transform: translate(-50%, 20px); opacity: 0; } }

/* ============ Opening ============ */
.opening {
  position: fixed; inset: 0; z-index: 80; overflow: hidden; color: #f3f0ff; touch-action: none;
  background: radial-gradient(ellipse at 50% 35%, #2c2468 0%, #0c0920 70%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px));
  animation: fade .25s;
}
.opening-glow { position: absolute; inset: -20%; pointer-events: none; opacity: 0; transition: opacity .4s; }
.impact-rare .opening-glow { opacity: .8; background: radial-gradient(circle at 50% 45%, rgba(242,183,5,.55), transparent 55%); }
.impact-ultra .opening-glow { opacity: 1; background: radial-gradient(circle at 50% 45%, rgba(76,201,240,.55), rgba(247,37,133,.25) 35%, transparent 60%); }
.impact-mythic .opening-glow { opacity: 1; background: conic-gradient(from 0deg at 50% 45%, rgba(255,215,0,.5), rgba(255,77,109,.4), rgba(199,125,255,.45), rgba(76,201,240,.4), rgba(255,215,0,.5)); animation: spinBg 5s linear infinite; }
@keyframes spinBg { to { transform: rotate(360deg); } }
.hint { color: #aaa3d8; font-weight: 600; text-align: center; margin: 14px 0; min-height: 1.4em; }

.pack-stage { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pack-wrap { position: relative; width: min(62vw, 40vh, 280px); aspect-ratio: 2 / 3; cursor: grab; }
.pack-piece { position: absolute; inset: 0; filter: drop-shadow(0 20px 30px rgba(0,0,0,.6)); }
.pack-top { clip-path: inset(0 0 85.3% 0); transition: opacity .3s .2s; transform-origin: 0 100%; }
.pack-bottom { clip-path: inset(14.7% 0 0 0); transition: transform .5s cubic-bezier(.5, 0, .7, .4), opacity .5s; }
.pack-bottom.torn { transform: translateY(40vh) scale(.9); opacity: 0; }
.tear-guide { position: absolute; left: 0; top: 14.7%; height: 3px; background: #fff; box-shadow: 0 0 12px #fff; pointer-events: none; }

.deal-stage { position: relative; width: min(56vw, 38vh, 260px); aspect-ratio: 5 / 7; }
.deal-card { position: absolute; inset: 0; animation: deal .5s cubic-bezier(.2, .9, .3, 1.2) both; }
.deal-card .card { box-shadow: 0 10px 30px rgba(0,0,0,.5); }
@keyframes deal {
  from { transform: translateY(45vh) scale(.6) rotate(0); opacity: 0; }
  to { transform: translateX(var(--x)) rotate(var(--rot)); opacity: 1; }
}

.reveal-top { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; right: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: #aaa3d8; }
.reveal-top .btn.text { color: #f3f0ff; }
.reveal-stage { position: relative; width: min(72vw, 52vh, 340px); aspect-ratio: 5 / 7; perspective: 1200px; cursor: pointer; }
.stack-card { position: absolute; inset: 0; }
.stack-card .card { box-shadow: 0 8px 20px rgba(0,0,0,.4); }
.flip-card { position: absolute; inset: 0; animation: cardIn .35s cubic-bezier(.2, .9, .3, 1.15); }
.flip-card.leaving { animation: cardOut .26s ease-in forwards; }
.flip-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .65s cubic-bezier(.3, 1.3, .5, 1); }
.flipped .flip-inner { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip-front { transform: rotateY(180deg); }
.flip-face .card { box-shadow: 0 24px 50px rgba(0,0,0,.55); }
@keyframes cardIn { from { transform: translate(8px, 8px) rotate(2deg) scale(.97); } }
@keyframes cardOut { to { transform: translate(-120%, -8%) rotate(-18deg); opacity: 0; } }

.impact-rare .reveal-stage { animation: shake .35s ease-in-out .05s; }
.impact-ultra .reveal-stage { animation: shake .45s ease-in-out .05s 2; }
.impact-mythic .reveal-stage { animation: shakeHard .5s ease-in-out .05s 3; }
.impact-ultra .flip-front .card, .impact-mythic .flip-front .card { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes shake { 20% { transform: translate(-6px, 2px) rotate(-1deg); } 40% { transform: translate(6px, -2px) rotate(1deg); } 60% { transform: translate(-4px, 1px); } 80% { transform: translate(3px, -1px); } }
@keyframes shakeHard { 15% { transform: translate(-10px, 4px) rotate(-2deg); } 30% { transform: translate(10px, -4px) rotate(2deg); } 50% { transform: translate(-8px, 2px) rotate(-1deg); } 70% { transform: translate(6px, -2px) rotate(1deg); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }

.burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; z-index: 5; }
.burst i { position: absolute; left: 0; top: 0; border-radius: 50%; animation: burst .9s cubic-bezier(.1, .8, .3, 1) both; box-shadow: 0 0 8px currentColor; }
.burst i:nth-child(3n) { border-radius: 2px; }
@keyframes burst {
  0% { transform: translate(-50%, -50%) scale(.2); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(200deg); opacity: 0; }
}

.reveal-tags { position: absolute; left: 0; right: 0; bottom: -44px; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; animation: tagIn .3s .35s both; }
@keyframes tagIn { from { transform: translateY(8px); opacity: 0; } }
.tag { padding: 5px 12px; border-radius: 99px; font-size: 14px; font-weight: 700; background: rgba(255,255,255,.14); }
.tag-new { background: var(--red); color: #fff; }
.tag-dup { background: var(--gold); color: #2a1d00; }
.tag-r-rare { background: #d4a017; color: #2a1d00; }
.tag-r-ultra { background: linear-gradient(90deg, #4cc9f0, #f72585); color: #fff; }
.tag-r-mythic { background: linear-gradient(90deg, #ffd700, #ff4d6d, #c77dff, #4cc9f0); color: #1a0033; }
.phase-reveal .hint { margin-top: 58px; }
.tray { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: min(86vw, 340px); }
.tray-empty { aspect-ratio: 5 / 7; border-radius: 6px; border: 2px dashed rgba(255,255,255,.18); }
.tray-slot .card { animation: fade .3s; }

.summary { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; max-height: 100%; }
.summary-title { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.05; margin: 8px 0 4px; text-align: center; }
.summary-title.s-rare { color: #f9d976; }
.summary-title.s-ultra { background: linear-gradient(90deg, #4cc9f0, #f72585, #fee440); -webkit-background-clip: text; background-clip: text; color: transparent; }
.summary-title.s-mythic { background: linear-gradient(90deg, #ffd700, #ff4d6d, #c77dff, #4cc9f0, #ffd700); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: holo 3s linear infinite; }
.summary-meta { color: #aaa3d8; margin: 0 0 16px; text-align: center; }
.summary-meta b { color: var(--gold); }
.summary-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; width: 100%; }
.summary-card { position: relative; grid-column: span 2; animation: tagIn .35s both; }
.summary-grid.n5 .summary-card:nth-child(4) { grid-column: 2 / span 2; }
.summary-badge { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.summary-badge.new { background: var(--red); color: #fff; }
.summary-badge.dup { background: var(--gold); color: #2a1d00; }
.summary-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 26px; }
.summary-actions .btn.ghost { background: transparent; border-color: rgba(255,255,255,.25); color: #f3f0ff; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ============ Holo-System (Schritt 4) ============ */
@property --mx { syntax: '<percentage>'; inherits: true; initial-value: 50%; }
@property --my { syntax: '<percentage>'; inherits: true; initial-value: 50%; }
.card { --mx: 50%; --my: 50%; }
.holo-wrap { --rx: 0deg; --ry: 0deg; perspective: 1000px; touch-action: none; }
.holo-wrap .card { --mx: inherit; --my: inherit; transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .18s ease-out; will-change: transform; }
.holo-wrap.idle { animation: holoIdle 7s ease-in-out infinite; }
@keyframes holoIdle { 0%, 100% { --mx: 22%; --my: 18%; } 50% { --mx: 78%; --my: 82%; } }

.card-holo, .card-glare { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; z-index: 3; }
.card-glare {
  background: radial-gradient(farthest-corner circle at var(--mx) var(--my), rgba(255,255,255,.75) 0%, rgba(255,255,255,.18) 22%, transparent 55%);
  mix-blend-mode: overlay; opacity: .55;
}
.card.r-common .card-glare { opacity: .22; }
.card.mini .card-glare, .card.mini.r-common .card-holo, .card.mini.r-uncommon .card-holo, .card.mini.r-rare .card-holo { display: none; }

/* Silber: schmaler Lichtstreifen */
.card.r-uncommon .card-holo {
  background: linear-gradient(110deg, transparent calc(var(--mx) - 28%), rgba(255,255,255,.65) var(--mx), transparent calc(var(--mx) + 28%));
  mix-blend-mode: soft-light;
}
/* Gold: Folienstreifen + feiner Glitzer */
.card.r-rare .card-holo {
  background:
    linear-gradient(110deg, transparent calc(var(--mx) - 24%), rgba(255,236,150,.85) var(--mx), transparent calc(var(--mx) + 24%)),
    radial-gradient(circle, rgba(255,255,255,.5) 0 .5px, transparent 1.2px) calc(var(--mx) * .2) calc(var(--my) * .2) / 8px 8px;
  mix-blend-mode: overlay; opacity: .8;
}
/* Ultra Rare: Regenbogen-Hologramm mit Scanlines, konzentriert ums Licht */
.card.r-ultra .card-holo {
  background:
    repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.09) 2px 3px),
    repeating-linear-gradient(125deg, #ff0080 0%, #ffd000 6%, #00ffa3 12%, #00c3ff 18%, #b000ff 24%, #ff0080 30%);
  background-size: 100% 100%, 220% 220%;
  background-position: 0 0, var(--mx) var(--my);
  mix-blend-mode: color-dodge; opacity: .38; filter: brightness(.7) contrast(1.5) saturate(1.3);
  -webkit-mask: radial-gradient(circle at var(--mx) var(--my), #000 0%, rgba(0,0,0,.12) 55%);
  mask: radial-gradient(circle at var(--mx) var(--my), #000 0%, rgba(0,0,0,.12) 55%);
}
/* Secret Mythic: Regenbogen + zweilagiger Gold-Glitzer */
.card.r-mythic .card-holo {
  background:
    radial-gradient(circle, #fff 0 .7px, transparent 1.4px) calc(var(--mx) * -.4) calc(var(--my) * -.4) / 9px 9px,
    radial-gradient(circle, #ffd700 0 1px, transparent 1.8px) calc(var(--mx) * .6) calc(var(--my) * .6) / 13px 13px,
    repeating-linear-gradient(135deg, #ffd700 0%, #ff4d6d 6%, #c77dff 12%, #4cc9f0 18%, #80ffdb 24%, #ffd700 30%) var(--mx) var(--my) / 240% 240%;
  mix-blend-mode: color-dodge; opacity: .42; filter: brightness(.75) contrast(1.4);
  -webkit-mask: radial-gradient(circle at var(--mx) var(--my), #000 0%, rgba(0,0,0,.18) 60%);
  mask: radial-gradient(circle at var(--mx) var(--my), #000 0%, rgba(0,0,0,.18) 60%);
}
.card.mini.r-ultra .card-holo, .card.mini.r-mythic .card-holo { opacity: .35; }

/* Summary: dritter Button */
.summary-actions .btn.again { grid-column: 1 / -1; }

/* ============ Hall of Fame (Full-Art-Illustration) ============ */
.card.r-legend { box-shadow: inset 0 0 0 1.1cqw rgba(255,255,255,.9), 0 0 0 0 transparent; }
.card.r-legend::before {
  content: ''; position: absolute; inset: 0; z-index: 5; pointer-events: none; border-radius: inherit; padding: 1.3cqw;
  background: conic-gradient(from var(--a, 0deg), #ffffff, #ffd700, #ff9f1c, #ff4d6d, #c77dff, #4cc9f0, #80ffdb, #ffffff);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: spin 6s linear infinite;
}
/* geätzte Illustrations-Textur + Glitzer + Regenbogen, konzentriert ums Licht */
.card.r-legend .card-holo {
  background:
    radial-gradient(circle, #fff 0 .6px, transparent 1.3px) calc(var(--mx) * -.5) calc(var(--my) * -.5) / 7px 7px,
    radial-gradient(circle, #ffd700 0 .9px, transparent 1.7px) calc(var(--mx) * .7) calc(var(--my) * .7) / 11px 11px,
    repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.1) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(115deg, #ff0080 0%, #ffd000 7%, #00ffa3 14%, #00c3ff 21%, #b000ff 28%, #ff0080 35%) var(--mx) var(--my) / 260% 260%;
  mix-blend-mode: color-dodge; opacity: .5; filter: brightness(.8) contrast(1.35);
  -webkit-mask: radial-gradient(circle at var(--mx) var(--my), #000 0%, rgba(0,0,0,.25) 65%);
  mask: radial-gradient(circle at var(--mx) var(--my), #000 0%, rgba(0,0,0,.25) 65%);
}
.card.mini.r-legend .card-holo { opacity: .4; }
.card.mini.r-legend::before { padding: 3cqw; }
.illus-caption {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; justify-content: space-between; align-items: flex-end; gap: 3cqw;
  padding: 16cqw 5cqw 4.5cqw; color: #fff; background: linear-gradient(transparent, rgba(10,4,24,.78) 55%);
}
.illus-caption > div:first-child { display: grid; min-width: 0; }
.illus-name { font-family: var(--display); font-size: 7cqw; line-height: 1.05; text-shadow: 0 .5cqw 1.5cqw rgba(0,0,0,.8); }
.illus-gimmick { font-weight: 700; font-style: italic; font-size: 4.4cqw; color: #ffd700; }
.illus-meta { display: grid; justify-items: end; font-weight: 700; font-size: 3.5cqw; white-space: nowrap; }
.illus-meta small { font-family: var(--sign); font-size: 4.6cqw; color: #ffd700; font-weight: 400; }
.rar-legend { color: #d4a017; }
.tag-r-legend { background: linear-gradient(90deg, #fff, #ffd700, #ff9f1c, #ff4d6d, #c77dff, #4cc9f0); color: #1a0033; }
.aura-legend { animation: aura .6s ease-in-out infinite; --aura: #ffffff; }
.u-legend { border-style: solid; border-color: rgba(255, 215, 0, .55); }
.summary-title.s-legend { background: linear-gradient(90deg, #fff, #ffd700, #ff9f1c, #ff4d6d, #c77dff, #4cc9f0, #fff); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: holo 2.5s linear infinite; }
.impact-legend .opening-glow { opacity: 1; background: conic-gradient(from 0deg at 50% 45%, rgba(255,255,255,.55), rgba(255,215,0,.5), rgba(255,77,109,.4), rgba(199,125,255,.45), rgba(76,201,240,.45), rgba(255,255,255,.55)); animation: spinBg 3.5s linear infinite; }
.impact-legend .reveal-stage { animation: shakeHard .5s ease-in-out .05s 4; }
.impact-legend .flip-front .card { animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
.impact-rare.phase-summary .summary-grid { animation: shake .35s ease-in-out; }
.impact-ultra.phase-summary .summary-grid { animation: shake .45s ease-in-out 2; }
.impact-mythic.phase-summary .summary-grid, .impact-legend.phase-summary .summary-grid { animation: shakeHard .5s ease-in-out 3; }

/* ============ Alle aufdecken: gleichzeitiger Flip ============ */
.summary-card.sum-flip { perspective: 900px; }
.sum-inner { position: relative; width: 100%; aspect-ratio: 5 / 7; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3, 1.3, .5, 1); }
.summary-card.flipped .sum-inner { transform: rotateY(180deg); }
.summary-card .summary-badge { animation: tagIn .25s both; }

/* ============ Öffnen-Einstellungen ============ */
.open-prefs { margin-top: 18px; padding: 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 12px; background: var(--surface2); }
.seg button { min-height: 40px; border-radius: 10px; font-weight: 700; font-size: 15px; color: var(--ink-soft); line-height: 1.1; padding: 4px; }
.seg button.on { background: var(--ink); color: var(--bg); }
.row-toggle.compact { padding: 4px 4px 0; font-size: 16px; }

/* ============ Automatisch weiter öffnen ============ */
.auto-next { width: 100%; margin-top: 18px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 12px; color: #aaa3d8; font-weight: 600; font-size: 15px; }
.auto-next-bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.auto-next-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); transform-origin: left; animation: autoNext linear both; }
@keyframes autoNext { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.auto-next .btn.ghost { background: transparent; border-color: rgba(255,255,255,.25); color: #f3f0ff; }
.auto-next + .summary-actions { margin-top: 14px; }

/* ============ Ring & Vitrine ============ */
.ring-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.ring-head h2 { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.1; margin: 0 0 2px; }
.ring-head p { margin: 0; }
.ring-score { display: grid; justify-items: end; line-height: 1; flex: none; }
.ring-score b { font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--gold); }
.ring-score span { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-top: 3px; }
.ring-stage { position: relative; width: 100%; aspect-ratio: 400 / 330; border-radius: 18px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.35); isolation: isolate; }
.ring-stage.preview { border-radius: 10px; box-shadow: none; }
.ring-layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.ring-layer.front { z-index: 3; }
.ring-mat-logo { font-family: var(--display); font-size: 17px; }
.ring-apron-text { font-family: var(--display); font-size: 17px; letter-spacing: .06em; }
.ring-neon-text { font-family: var(--display); font-size: 16px; }
.ring-slot { position: absolute; z-index: 2; display: block; padding: 0; transform-origin: 50% 100%; transition: transform .2s; }
.ring-slot:active { transform: scale(.94); }
.ring-slot .card { box-shadow: 0 6px 14px rgba(0,0,0,.45); }
.ring-slot.champ { z-index: 2; }
.ring-slot.champ.filled { animation: champFloat 3.2s ease-in-out infinite; }
.ring-slot.champ.filled::before { content: ''; position: absolute; inset: -30% -40% -8%; z-index: -1; background: radial-gradient(ellipse at 50% 60%, rgba(255,215,0,.55), transparent 65%); pointer-events: none; }
@keyframes champFloat { 50% { transform: translateY(-4px); } }
.ring-slot-empty { display: grid; place-items: center; aspect-ratio: 5 / 7; border-radius: 8px; border: 2px dashed rgba(255,255,255,.75); background: rgba(0,0,0,.28); color: #fff; font-family: var(--display); font-size: clamp(16px, 5vw, 28px); }
.champ-tag { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); white-space: nowrap; padding: 2px 8px; border-radius: 99px; background: var(--gold); color: #2a1d00; font-size: 11px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.ring-hint { margin: 10px 2px 0; }
.shop-title { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 26px 0 10px; }
.ring-shop { display: grid; gap: 10px; }
.ring-offer { display: grid; grid-template-columns: 116px 1fr; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.ring-offer.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.ring-offer-info { display: grid; gap: 2px; min-width: 0; }
.ring-offer-info strong { font-size: 16px; line-height: 1.15; }
.ring-offer-info span { font-size: 14px; color: var(--ink-soft); line-height: 1.25; }
.ring-offer .btn { white-space: nowrap; }
.ring-state { font-size: 14px; font-weight: 700; color: var(--gold-deep); padding: 0 6px; }
.picker-chips { margin: 12px 0 10px; padding-inline: 0; }
.picker-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding-bottom: 8px; }
.picker-card { position: relative; display: grid; gap: 4px; text-align: center; }
.picker-card.current .card { outline: 3px solid var(--gold); outline-offset: 2px; }
.picker-name { font-size: 12px; font-weight: 600; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.picker-badge { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 1px 7px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 700; }

.ring-offer-action { margin-top: 6px; display: flex; }
.ring-offer-action .ring-state { padding: 6px 0; }

/* ============ Packs: drei nebeneinander ============ */
.pack-info strong { font-size: 15px; }
.pack-info span { font-size: 13px; }
.pack-tag { font-style: normal; font-size: 12px; font-weight: 700; color: var(--red); line-height: 1.15; }
.pack-badge { font-family: var(--display); font-size: 16px; }
.pack-badge-s { font-family: var(--body); font-weight: 700; font-size: 9px; }
.pack-slot .btn.text.small { font-size: 13px; }

/* ============ Rumble: 30 Karten kompakt ============ */
.summary-grid.many { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.summary-grid.many .summary-card { grid-column: span 1; }
.summary-grid.many .summary-badge { font-size: 10px; padding: 1px 5px; bottom: -6px; }
.summary-grid.many .summary-special { font-size: 9px; padding: 0 4px; }
.summary-grid.n6 .summary-card { grid-column: span 2; }
.summary-special { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); z-index: 6; white-space: nowrap; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 700; color: #fff; }
.summary-special.sp-turn { background: linear-gradient(90deg, var(--red), var(--blue)); }
.summary-special.sp-runin { background: #111; box-shadow: 0 0 0 1.5px var(--gold); }
.tag-turn { background: linear-gradient(90deg, #e0233d, #2d6cdf); color: #fff; }
.tag-runin { background: #111; color: var(--gold); box-shadow: 0 0 0 1.5px var(--gold); }

/* ============ Run-in ============ */
.runin { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 18px; text-align: center; cursor: pointer; animation: shakeHard .5s ease-in-out 2; }
.runin.heel { background: radial-gradient(circle at 50% 40%, rgba(224,35,61,.55), rgba(10,4,16,.96) 70%); }
.runin.face { background: radial-gradient(circle at 50% 40%, rgba(45,108,223,.55), rgba(10,4,16,.96) 70%); }
.runin-flash { position: absolute; inset: 0; background: #fff; pointer-events: none; animation: flash .45s ease-out forwards; }
@keyframes flash { from { opacity: .9; } to { opacity: 0; } }
.runin-title { font-family: var(--display); font-weight: 400; font-size: 46px; line-height: 1; margin: 0; color: #fff; text-shadow: 3px 3px 0 var(--red); animation: slam .45s cubic-bezier(.2, 1.6, .4, 1) both; }
.runin.face .runin-title { text-shadow: 3px 3px 0 var(--blue); }
@keyframes slam { from { transform: scale(2.6) rotate(-8deg); opacity: 0; } }
.runin-text { max-width: 340px; margin: 0; color: #e8e4ff; font-size: 16px; animation: tagIn .3s .3s both; }
.runin-text b { color: #fff; }
.runin-stage { position: relative; width: min(56vw, 34vh, 240px); aspect-ratio: 5 / 7; margin: 14px 0 6px; }
.runin-card { position: absolute; inset: 0; animation: storm .55s cubic-bezier(.2, 1.2, .4, 1) .15s both; }
.runin.heel .runin-card { --from: 120vw; }
.runin.face .runin-card { --from: -120vw; }
@keyframes storm { from { transform: translateX(var(--from)) rotate(20deg); } }
.runin-stolen { position: absolute; width: 46%; left: -30%; top: 30%; z-index: 2; animation: steal 1.1s ease-in .7s both; }
@keyframes steal { 0% { transform: none; opacity: 1; } 100% { transform: translate(-80vw, -30vh) rotate(-60deg); opacity: 0; } }
.runin-bubble { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); width: max-content; max-width: 280px; padding: 8px 12px; border-radius: 14px; background: #fff; color: #1a1638; font-weight: 700; font-size: 14px; line-height: 1.25; box-shadow: 0 6px 16px rgba(0,0,0,.4); animation: tagIn .3s 1.1s both; z-index: 3; }

/* ============ Gürtel ============ */
.belt-svg { display: block; width: 100%; height: auto; }
.belt-win { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 20px; padding: 10px 14px; border-radius: 16px; background: linear-gradient(90deg, rgba(242,183,5,.22), rgba(242,183,5,.05)); box-shadow: 0 0 0 1px rgba(242,183,5,.5); animation: tagIn .4s both; }
.belt-win-art { width: 110px; flex: none; filter: drop-shadow(0 4px 10px rgba(242,183,5,.5)); animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
.belt-win strong { display: block; color: var(--gold); font-size: 16px; }
.belt-win span { color: #e8e4ff; font-size: 15px; }
.belt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.belt-tile { display: grid; gap: 4px; padding: 12px 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: center; }
.belt-tile strong { font-size: 15px; line-height: 1.15; }
.belt-tile span { font-size: 13px; color: var(--ink-soft); }
.belt-tile.worn { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.belt-tile.unknown strong { color: var(--ink-soft); }
.belt-sheet-art { max-width: 280px; margin: 8px auto 12px; }
.belt-bar i { background: linear-gradient(90deg, #cd7f32, var(--gold), #fff1b8); }
.champ-belt { position: absolute; left: -12%; right: -12%; top: 58%; z-index: 3; filter: drop-shadow(0 3px 5px rgba(0,0,0,.5)); pointer-events: none; }
.belt-row { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 12px; padding: 10px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
.belt-row-art { width: 88px; flex: none; }
.belt-row-text { display: grid; gap: 2px; }
.belt-row-text strong { font-size: 16px; }
.belt-row-text span { font-size: 14px; color: var(--ink-soft); }
.belt-pick { display: grid; gap: 8px; margin-top: 8px; }
.belt-pick-row { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface2); text-align: left; }
.belt-pick-row.on { border-color: var(--gold); }
.belt-pick-row:disabled { opacity: .5; }
.belt-pick-row span { display: grid; }
.belt-pick-row span span { font-size: 14px; color: var(--ink-soft); }

/* ============ Album-Reiter & Season 1 ============ */
.album-tabs { margin-bottom: 14px; }
.season-banner { display: grid; gap: 2px; padding: 12px 14px; border-radius: 16px; color: #fff; background: linear-gradient(110deg, #b5121b 0%, #b5121b 48%, #1f4fbf 52%, #1f4fbf 100%); }
.season-banner strong { font-family: var(--display); font-weight: 400; font-size: 18px; }
.season-banner span { font-size: 14px; opacity: .92; }
.turn-bar i { background: linear-gradient(90deg, var(--red), var(--blue)); }
.u-turn { border-style: solid; border-image: linear-gradient(135deg, rgba(224,35,61,.6), rgba(45,108,223,.6)) 1; }
.album-tip { margin: 12px 2px 0; }

/* Turn-Karten: zweifarbiger Rahmen + Band */
.card.turn::after { content: ''; position: absolute; inset: 0; z-index: 6; pointer-events: none; border-radius: inherit; padding: 1.8cqw;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.card.turn-face::after { background: linear-gradient(135deg, #e0233d 0 40%, #ffffff 50%, #2d6cdf 60% 100%); }
.card.turn-heel::after { background: linear-gradient(135deg, #2d6cdf 0 40%, #111 50%, #e0233d 60% 100%); }
.turn-ribbon { position: absolute; top: 15%; right: -9cqw; z-index: 7; transform: rotate(35deg); padding: .8cqw 10cqw; font-family: var(--display); font-size: 4.2cqw; line-height: 1.1; color: #fff; box-shadow: 0 1cqw 2cqw rgba(0,0,0,.35); pointer-events: none; }
.turn-face .turn-ribbon { background: #2d6cdf; }
.turn-heel .turn-ribbon { background: #e0233d; }
.card.mini .turn-ribbon { font-size: 7cqw; padding: 1cqw 12cqw; top: 13%; }

/* ============ Detail: Einmarsch & Trash Talk ============ */
.detail-card { position: relative; }
.detail-actions { display: flex; gap: 10px; }
.detail-actions .btn.ghost { background: transparent; color: #f3f0ff; border-color: rgba(255,255,255,.3); }
.talk-bubble { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); z-index: 8; width: max-content; max-width: min(88vw, 320px); padding: 10px 14px; border-radius: 16px; background: #fff; color: #1a1638; font-weight: 700; font-size: 15px; line-height: 1.3; box-shadow: 0 8px 20px rgba(0,0,0,.45); animation: tagIn .25s both; }
.talk-bubble::before { content: ''; position: absolute; left: 50%; top: -8px; margin-left: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: #fff; }

/* ============ Einmarsch ============ */
.entrance { position: fixed; inset: 0; z-index: 95; overflow: hidden; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: calc(40px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: #05030f; animation: fade .3s; cursor: pointer; }
.entrance.heel { --c1: #e0233d; --c2: #f2b705; }
.entrance.face { --c1: #2d6cdf; --c2: #4cc9f0; }
.entrance.tweener { --c1: #7b2ff7; --c2: #06d6a0; }
.ent-lights i { position: absolute; top: -10%; width: 26vw; height: 130%; transform-origin: 50% 0; background: linear-gradient(var(--c1), transparent 75%); opacity: .35; mix-blend-mode: screen; animation: sweep 2.4s ease-in-out infinite alternate; }
.ent-lights i:nth-child(1) { left: 5%; animation-delay: -.4s; }
.ent-lights i:nth-child(2) { left: 28%; background: linear-gradient(var(--c2), transparent 75%); animation-delay: -1.2s; }
.ent-lights i:nth-child(3) { left: 50%; animation-delay: -.8s; }
.ent-lights i:nth-child(4) { left: 72%; background: linear-gradient(var(--c2), transparent 75%); animation-delay: -1.8s; }
@keyframes sweep { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
.ent-ramp { position: absolute; left: 50%; bottom: 0; width: 70%; height: 38%; transform: translateX(-50%); background: linear-gradient(transparent, rgba(255,255,255,.08)); clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); }
.ent-announce { position: relative; z-index: 2; text-align: center; min-height: 120px; }
.ent-from { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .04em; color: #d8d2ff; animation: tagIn .5s both; }
.ent-name { margin: 6px 0 2px; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 10vw, 46px); line-height: 1.02; text-shadow: 3px 3px 0 var(--c1), 0 0 24px var(--c2); animation: slam .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.ent-gimmick { margin: 0; font-style: italic; font-weight: 700; color: var(--c2); animation: tagIn .4s .3s both; }
.ent-card { position: relative; z-index: 2; width: min(60vw, 38vh, 280px); margin-top: 16px; transform: translateY(70vh); transition: transform .9s cubic-bezier(.2, 1.1, .3, 1); cursor: default; }
.ent-card.in { transform: none; }
.ent-pyro { position: absolute; bottom: 0; width: 22vw; height: 45vh; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at 50% 100%, #fff6c9 0%, var(--c2) 25%, var(--c1) 50%, transparent 70%); opacity: 0; animation: pyro 1.2s ease-out; }
.ent-pyro.l { left: 2%; } .ent-pyro.r { right: 2%; }
@keyframes pyro { 0% { opacity: 0; transform: scaleY(.2); transform-origin: bottom; } 20% { opacity: 1; transform: scaleY(1.1); } 100% { opacity: 0; transform: scaleY(.9); } }
.ent-bubble { position: relative; z-index: 3; margin-top: 18px; max-width: 320px; padding: 12px 16px; border-radius: 18px; background: #fff; color: #1a1638; font-weight: 700; font-size: 16px; line-height: 1.3; box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: tagIn .3s both; display: grid; gap: 4px; }
.ent-bubble small { font-weight: 600; font-size: 12px; color: #6a6490; }
.ent-hint { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; margin: 0; text-align: center; font-size: 13px; color: rgba(255,255,255,.55); z-index: 2; }

.pack-slot .btn.text.small { font-size: 12px; white-space: nowrap; gap: 3px; padding: 0 2px; }
.pack-slot .btn.text.small svg { width: 14px; height: 14px; }
.card.mini .card-mininum { font-size: 11cqw; }

.tabbar button { font-size: 12px; }

/* ============ Kartenzustand ============ */
.card.has-cond { background: #f3efe6; }
.card.has-cond .card-frame { transform: translate(var(--cx, 0), var(--cy, 0)); }
.cond-layer { position: absolute; inset: 0; z-index: 8; pointer-events: none; border-radius: inherit; }
.cond-layer svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cond-list { list-style: none; margin: 6px 0; padding: 0; display: grid; gap: 2px; font-size: 14px; }
.cond-list li::before { content: '•'; color: var(--ink-soft); margin-right: 6px; }

/* ============ Slab (Grading-Case) ============ */
.slab { container-type: inline-size; position: relative; padding: 3.5cqw; border-radius: 5cqw; display: grid; gap: 3cqw;
  background: linear-gradient(145deg, rgba(255,255,255,.55), rgba(210,220,235,.25) 40%, rgba(255,255,255,.45));
  box-shadow: inset 0 0 0 .8cqw rgba(255,255,255,.75), inset 0 0 0 1.6cqw rgba(160,170,190,.35), 0 3cqw 7cqw rgba(0,0,0,.35); backdrop-filter: blur(2px); }
.slab-label { display: grid; grid-template-columns: 1fr auto; gap: 1cqw 3cqw; padding: 2.6cqw 3.4cqw; border-radius: 2cqw; background: #f7f7f2; color: #1a1638; box-shadow: inset 0 0 0 .5cqw #c7141f; }
.slab.gem .slab-label { background: linear-gradient(135deg, #fff6c9, #ffd700 45%, #fff1b8 70%, #e0b43a); box-shadow: inset 0 0 0 .6cqw #9c6b00; }
.slab-l { display: grid; min-width: 0; font-size: 3.6cqw; line-height: 1.2; }
.slab-l b { font-family: var(--display); font-weight: 400; font-size: 3.8cqw; }
.slab-name { font-weight: 700; font-size: 4.4cqw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slab-r { display: grid; justify-items: end; align-content: center; line-height: 1; }
.slab-gname { font-size: 3.4cqw; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.slab-grade { font-family: var(--display); font-weight: 400; font-size: 13cqw; line-height: .95; }
.slab-cert { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 3cqw; font-size: 3.2cqw; font-weight: 700; color: #5b5580; }
.slab-barcode { flex: 1; max-width: 40%; height: 3.4cqw; background: repeating-linear-gradient(90deg, #1a1638 0 .5cqw, transparent .5cqw 1cqw, #1a1638 1cqw 1.3cqw, transparent 1.3cqw 2.1cqw); }
.slab-window { padding: 2cqw; border-radius: 3cqw; background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 .6cqw rgba(255,255,255,.5); }
.slab.small .slab-cert { display: none; }
.slab.small .slab-l span:not(.slab-name) { display: none; }

/* ============ Grading-Screen ============ */
.grading-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.grading-head h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; }
.grading-head p { margin: 2px 0 0; }
.queue { display: grid; gap: 8px; margin-bottom: 12px; }
.queue-empty { margin: 0; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px dashed var(--line); font-size: 15px; }
.queue-row { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.queue-row.done { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.queue-info { display: grid; gap: 5px; min-width: 0; }
.queue-info strong { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slab-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.slab-tile { display: grid; gap: 4px; text-align: center; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.dealer { margin-top: 6px; }
.dealer .chips { flex-wrap: wrap; margin: 10px 0; }
.upgrades { display: grid; gap: 8px; padding-bottom: 8px; }
.upgrade-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.upgrade-row > div { display: grid; gap: 2px; }
.upgrade-row strong { font-size: 16px; }
.upgrade-lvl { font-size: 13px; font-weight: 700; color: var(--gold-deep); }

/* Einreichen & Exemplare */
.submit-detail { display: grid; grid-template-columns: 42% 1fr; gap: 14px; align-items: start; margin-bottom: 14px; }
.submit-detail strong { display: block; font-size: 17px; }
.copies { display: grid; gap: 10px; padding-bottom: 8px; }
.copy-row { display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: start; padding: 10px; border-radius: 14px; background: var(--surface2); }
.copy-art { display: block; width: 100%; }
.copy-info { display: grid; gap: 4px; }
.copy-info .cond-list { font-size: 13px; margin: 0; }
.copy-value { font-weight: 700; font-size: 14px; }
.copy-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

/* Ergebnis & Slab-Ansicht */
.grade-reveal, .slab-modal { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(24px + env(safe-area-inset-top, 0px)) 18px calc(24px + env(safe-area-inset-bottom, 0px)); background: radial-gradient(circle at 50% 40%, #2c2468, #0b0820 70%); color: #f3f0ff; animation: fade .25s; overflow-y: auto; }
.grade-reveal.g10.shown { background: radial-gradient(circle at 50% 40%, rgba(255,215,0,.45), #1a0d00 70%); }
.gr-kicker { margin: 0; font-weight: 700; letter-spacing: .06em; color: #aaa3d8; text-transform: uppercase; font-size: 13px; }
.gr-slab { position: relative; width: min(66vw, 42vh, 300px); }
.gr-cover { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 5%; background: repeating-linear-gradient(45deg, #1f1a46 0 12px, #262052 12px 24px); color: #d8d2ff; font-weight: 700; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .7; } }
.gr-info { display: grid; justify-items: center; gap: 8px; text-align: center; animation: tagIn .35s both; }
.gr-info h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; }
.g10 .gr-info h2 { color: #ffd700; text-shadow: 0 0 18px rgba(255,215,0,.6); }
.gr-info p { margin: 0; }
.gr-subs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 14px; color: #d8d2ff; }
.gr-subs b { color: #fff; }
.gr-actions { display: flex; gap: 10px; margin-top: 4px; }
.gr-actions .btn.ghost { background: transparent; border-color: rgba(255,255,255,.3); color: #f3f0ff; }
.slab-modal { background: rgba(8,6,24,.9); }
.slab-modal-inner { display: grid; justify-items: center; gap: 12px; width: min(78vw, 46vh, 340px); }
.slab-modal-inner > .slab, .slab-modal-inner > .card { width: 100%; }
.slab-value { margin: 0; }

/* ============ Werbe-Pack ============ */
.ad-btn { min-height: 34px; padding: 0 10px; font-size: 13px; margin-top: 2px; }
.adbreak { position: fixed; inset: 0; z-index: 96; display: flex; flex-direction: column; gap: 18px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: #0b0820; color: #f3f0ff; animation: fade .2s; }
.ad-top { display: flex; justify-content: space-between; align-items: center; }
.ad-top .btn.text { color: #d8d2ff; }
.ad-label { padding: 3px 10px; border-radius: 6px; background: #f2b705; color: #2a1d00; font-weight: 700; font-size: 13px; }
.ad-box { flex: 1; display: grid; align-content: center; justify-items: center; gap: 8px; border-radius: 18px; border: 2px dashed rgba(255,255,255,.2); background: repeating-linear-gradient(45deg, #151036 0 14px, #1a1440 14px 28px); text-align: center; padding: 20px; }
.ad-box p { margin: 0; font-size: 18px; font-weight: 700; }
.ad-box small { color: #aaa3d8; }
.ad-bar { width: 70%; height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 10px; }
.ad-bar i { display: block; height: 100%; background: var(--gold); transform-origin: left; animation: autoNext linear both; }
.ad-reward { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 14px; }
.ad-reward p { margin: 0; }

/* ============ Anmeldeserie ============ */
.streak { margin-bottom: 14px; padding: 12px; border-radius: 18px; background: linear-gradient(120deg, rgba(224,35,61,.18), rgba(45,108,223,.18)); border: 1px solid var(--line); }
.streak.done { background: var(--surface); }
.streak-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.streak-head > div { display: grid; gap: 1px; }
.streak-head strong { font-size: 16px; }
.streak-head span { font-size: 14px; color: var(--ink-soft); }
.streak-days { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.streak-days li { display: grid; justify-items: center; gap: 1px; padding: 6px 2px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); font-size: 11px; color: var(--ink-soft); }
.streak-days li b { font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
.streak-days li.pack b { color: var(--blue); }
.streak-days li.big { background: linear-gradient(135deg, #fff1b8, #f2b705); color: #3d2c00; border-color: transparent; }
.streak-days li.big b { color: #3d2c00; }
.streak-days li.got { opacity: .45; }
.streak-days li.today { outline: 2px solid var(--red); outline-offset: 1px; opacity: 1; }
.voucher-tag { font-style: normal; font-size: 12px; font-weight: 700; color: var(--gold-deep); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .voucher-tag { color: var(--gold); } }

/* ============ Tages-Quests ============ */
.daily-panel { margin-bottom: 8px; }
.daily-panel .shop-title { margin-top: 0; }
.daily-bonus { margin-top: 10px; background: linear-gradient(90deg, var(--red), var(--blue)); color: #fff; }
.daily-bonus:disabled { background: var(--line); color: var(--ink-soft); }

/* ============ Einstieg ============ */
.intro { position: fixed; inset: 0; z-index: 97; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: calc(24px + env(safe-area-inset-top, 0px)) 22px calc(24px + env(safe-area-inset-bottom, 0px)); background: #05030f; color: #fff; text-align: center; --c1: #e0233d; --c2: #2d6cdf; }
.intro-mic { font-size: 54px; position: relative; z-index: 2; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
.intro-card { position: relative; z-index: 2; max-width: 360px; animation: tagIn .35s both; }
.intro-card h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 8vw, 36px); line-height: 1.05; text-shadow: 3px 3px 0 var(--red); }
.intro-card p { margin: 0; font-size: 17px; color: #e3deff; }
.intro-pack { position: relative; z-index: 2; width: 130px; animation: packIdle 3s ease-in-out infinite; filter: drop-shadow(0 14px 24px rgba(0,0,0,.6)); }
.intro-dots { position: relative; z-index: 2; display: flex; gap: 6px; }
.intro-dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.25); }
.intro-dots i.on { background: var(--gold); }
.intro-btn { position: relative; z-index: 2; max-width: 360px; }
.intro-skip { position: relative; z-index: 2; color: #aaa3d8; }

/* ============ Walkout ============ */
.walkout { position: fixed; inset: 0; z-index: 99; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(40px + env(safe-area-inset-top, 0px)) 16px calc(18px + env(safe-area-inset-bottom, 0px)); background: #030208; color: #fff; --c1: #7b2ff7; --c2: #ffd700; animation: fade .4s; }
.walkout.legend { --c1: #ffffff; --c2: #ffd700; }
.walkout.side-face { --c1: #2d6cdf; } .walkout.side-heel { --c1: #e0233d; }
.walkout .ent-lights { opacity: 0; transition: opacity .6s; }
.walkout.s3 .ent-lights, .walkout.s4 .ent-lights, .walkout.s5 .ent-lights, .walkout.s6 .ent-lights { opacity: 1; }
.wo-flare { position: absolute; left: 50%; top: 58%; width: 140vmax; height: 140vmax; transform: translate(-50%, -50%) scale(.2); border-radius: 50%; background: radial-gradient(circle, var(--c2) 0%, var(--c1) 18%, transparent 45%); opacity: .0; animation: flare 1.1s .2s ease-out forwards; }
.walkout.legend .wo-flare { background: conic-gradient(from 0deg, #fff, #ffd700, #ff4d6d, #c77dff, #4cc9f0, #80ffdb, #fff); -webkit-mask: radial-gradient(circle, #000 0 20%, transparent 46%); mask: radial-gradient(circle, #000 0 20%, transparent 46%); }
@keyframes flare { to { opacity: .75; transform: translate(-50%, -50%) scale(1) rotate(40deg); } }
.wo-smoke { position: absolute; left: -10%; right: -10%; bottom: 0; height: 40%; background: radial-gradient(ellipse at 30% 100%, rgba(255,255,255,.22), transparent 60%), radial-gradient(ellipse at 75% 100%, rgba(255,255,255,.18), transparent 55%); animation: smoke 6s ease-in-out infinite alternate; pointer-events: none; }
@keyframes smoke { to { transform: translateX(6%); } }
.wo-clues { position: relative; z-index: 2; display: grid; gap: 10px; justify-items: center; min-height: 190px; }
.wo-clue { display: grid; justify-items: center; padding: 8px 18px; border-radius: 14px; background: rgba(0,0,0,.45); box-shadow: 0 0 0 1px rgba(255,255,255,.2); animation: slam .45s cubic-bezier(.2, 1.6, .4, 1) both; }
.wo-clue small { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c2); }
.wo-clue b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.wo-stage { position: relative; z-index: 2; flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.wo-ramp { position: absolute; left: 50%; bottom: 0; width: 80%; height: 55%; transform: translateX(-50%); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); background: linear-gradient(rgba(255,255,255,.04), rgba(255,255,255,.14)); }
.wo-figure { position: relative; width: min(58vw, 34vh, 250px); margin-bottom: 4vh; animation: walk 1.8s cubic-bezier(.3, .6, .4, 1) both; filter: drop-shadow(0 0 18px var(--c1)); }
@keyframes walk { from { transform: translateY(-18vh) scale(.35); opacity: 0; } 40% { opacity: 1; } to { transform: none; } }
.wo-color { animation: fade .9s both; }
.wo-name { position: absolute; bottom: 42%; margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 10vw, 48px); text-align: center; line-height: 1; text-shadow: 3px 3px 0 var(--c1), 0 0 26px var(--c2); animation: slam .5s cubic-bezier(.2, 1.6, .4, 1) both; z-index: 3; }
.wo-card { position: relative; width: min(58vw, 36vh, 260px); animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); z-index: 4; }
.walkout.s6 .wo-name { bottom: auto; top: -12px; position: relative; margin-bottom: 14px; }
.wo-skip { position: relative; z-index: 3; color: rgba(255,255,255,.6); }
.wo-hint { position: relative; z-index: 3; margin: 8px 0 0; color: rgba(255,255,255,.6); font-size: 14px; }

/* ============ Teilen ============ */
.share-row { display: flex; justify-content: center; width: 100%; margin-top: 16px; }
.share-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
.share-btn { background: transparent !important; color: #f3f0ff; border-color: rgba(255,255,255,.3) !important; }
.share-img { display: block; width: 100%; max-width: 340px; margin: 6px auto 10px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.detail-actions { flex-wrap: wrap; justify-content: center; max-width: 420px; }

/* ============ Codes & Statistik ============ */
.code-open { margin-top: 12px; }
.code-input { width: 100%; margin: 6px 0 10px; padding: 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface2); color: var(--ink); font: 700 20px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .08em; text-align: center; }
.code-input:focus { outline: none; border-color: var(--gold); }
.code-msg { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; font-weight: 700; }
.code-msg.ok { background: rgba(6,214,160,.15); color: #06a77d; }
.code-msg.err { background: rgba(224,35,61,.12); color: var(--red); }
.settings-quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 8px; }
.stats-sec { margin-bottom: 14px; }
.stats-sec h3 { margin: 10px 0 6px; font-family: var(--display); font-weight: 400; font-size: 17px; }
.stats-sec dl { margin: 0; display: grid; }
.stats-sec dl > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
.stats-sec dl > div.sub { padding-left: 14px; font-size: 14px; color: var(--ink-soft); }
.stats-sec dt { color: inherit; }
.stats-sec dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

/* ============ Stables & Fehden ============ */
.album-tabs button { font-size: 14px; }
.stable-list, .feud-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.stable { padding: 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--c1); }
.stable.complete { box-shadow: 0 0 0 2px var(--gold); }
.stable-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.stable-head > div { display: grid; }
.stable-head strong { font-size: 16px; }
.stable-head span { font-size: 13px; font-style: italic; color: var(--ink-soft); }
.stable-count { font-family: var(--display); font-weight: 400; font-size: 20px; }
.stable-members { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
.stable-note { margin: 6px 0 0; }
.st-mini { position: relative; }
.st-mini.unknown { aspect-ratio: 5 / 7; border-radius: 8px; border: 2px dashed var(--line); background: var(--surface2); display: grid; overflow: hidden; }
.st-mini.unknown .art-svg { grid-area: 1 / 1; align-self: center; height: auto; color: rgba(90, 80, 150, .25); }
.st-mini.unknown span { grid-area: 1 / 1; place-self: center; font-family: var(--display); font-size: 22px; color: var(--ink-soft); opacity: .6; }
.team-card { border-radius: 14px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
.team-card svg { display: block; width: 100%; height: auto; }
.team-card-name { font-family: var(--display); font-size: 22px; }
.feud { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.feud.ready { border-color: var(--red); }
.feud-mid { display: grid; justify-items: center; text-align: center; gap: 2px; }
.feud-mid b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--red); line-height: 1; }
.feud-mid span { font-size: 14px; font-weight: 700; }
.synergies { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.syn { padding: 7px 12px; border-radius: 99px; font-size: 13px; font-weight: 700; text-align: left; }
.stable-syn { background: var(--gold); color: #2a1d00; }
.feud-syn { background: var(--red); color: #fff; }
.faceoff { display: grid; gap: 12px; padding-bottom: 8px; }
.fo-line { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; animation: tagIn .3s both; }
.fo-line.right { grid-template-columns: 1fr 56px; }
.fo-line.right .fo-pic { order: 2; }
.fo-line p { margin: 0; padding: 10px 12px; border-radius: 14px; background: var(--surface2); font-weight: 600; font-size: 15px; line-height: 1.3; }
.fo-line.right p { background: rgba(224,35,61,.12); text-align: right; }
.fo-line p b { display: block; font-size: 12px; color: var(--ink-soft); }

/* ============ Karte des Tages ============ */
.featured { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center; margin-bottom: 14px; padding: 10px 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: inset 4px 0 0 var(--gold); }
.featured-info { display: grid; gap: 1px; min-width: 0; }
.featured-info small { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--gold-deep); }
.featured-info strong { font-size: 16px; }
.featured-info span { font-size: 13px; color: var(--ink-soft); }
.featured-info em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--red); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .featured-info small { color: var(--gold); } }
.seg.album-tabs { grid-template-columns: repeat(4, 1fr); }

/* ============ Fehlpressungen ============ */
.card.mp-swap .card-art { filter: hue-rotate(165deg) saturate(1.35); }
.card.mp-shift .card-art { transform: translate(7cqw, -5cqw); box-shadow: -2cqw 2cqw 0 rgba(0,0,0,.25); }
.card.mp-upside .card-art .art-svg { transform: rotate(180deg); }
.card.mp-ghost .card-art .art-svg { filter: drop-shadow(4cqw 1.5cqw 0 rgba(255, 0, 90, .45)) drop-shadow(-3cqw -1cqw 0 rgba(0, 200, 255, .35)); }
.card.mp-blank .card-name, .card.mp-blank .card-gimmick, .card.mp-blank .card-flavor, .card.mp-blank .card-stats b, .card.mp-blank .illus-name { color: transparent !important; text-shadow: none !important; }
.card.mp-blank .card-stats span { color: transparent; }
.mp-tag { position: absolute; left: 3cqw; top: 40%; z-index: 7; transform: rotate(-8deg); padding: .6cqw 3cqw; border: .6cqw solid #e0233d; border-radius: 1.5cqw; color: #e0233d; background: rgba(255,255,255,.85); font-family: var(--display); font-size: 5cqw; line-height: 1.1; pointer-events: none; }
.card.mini .mp-tag { font-size: 9cqw; top: 36%; }
.tag-mp { background: #fff; color: var(--red); box-shadow: 0 0 0 2px var(--red); }
.summary-special.sp-mp { background: #fff; color: var(--red); box-shadow: 0 0 0 1.5px var(--red); }

/* ============ Autogramme ============ */
.autograph { position: absolute; left: 6%; right: 6%; top: 44%; z-index: 7; transform: rotate(-14deg); text-align: center; font-family: var(--sign); font-size: 10cqw; line-height: 1; color: #1f4fbf; text-shadow: 0 0 1cqw rgba(255,255,255,.9), 0 0 2.5cqw rgba(255,255,255,.7); pointer-events: none; white-space: nowrap; overflow: hidden; }
.card.full .autograph, .card.illus .autograph { color: #ffd700; text-shadow: 0 0 1cqw rgba(0,0,0,.9); }
.card.mini .autograph { font-size: 14cqw; }
.variant-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.vt { padding: 1px 7px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.vt.mp { background: rgba(224,35,61,.12); color: var(--red); }
.vt.sig { background: rgba(45,108,223,.14); color: var(--blue); }
.signing { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center; margin-bottom: 14px; padding: 10px 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: inset 4px 0 0 var(--blue); }
.signing-info { display: grid; gap: 3px; min-width: 0; justify-items: start; }
.signing-info small { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--blue); }
.signing-info strong { font-size: 16px; }
.signing-info span { font-size: 13px; color: var(--ink-soft); }
.sign-list { display: grid; gap: 8px; padding-bottom: 8px; }
.sign-row { display: grid; grid-template-columns: 70px 1fr; gap: 12px; align-items: center; padding: 8px; border-radius: 14px; background: var(--surface2); text-align: left; font-size: 14px; }

/* ============ Wochenthema ============ */
.weekly { margin-top: 16px; padding: 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 8px; }
.weekly-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.weekly-head > div:first-child { display: grid; gap: 1px; }
.weekly-head small { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--red); }
.weekly-head strong { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.1; }
.weekly-head span { font-size: 13px; color: var(--ink-soft); }
.weekly-rank { display: grid; justify-items: end; text-align: right; flex: none; }
.weekly-rank b { font-family: var(--display); font-weight: 400; font-size: 17px; color: var(--gold-deep); }
.weekly-rank span { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.weekly-next { margin: 0; }
.weekly-slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 14px; }
.weekly-slots li { display: flex; gap: 6px; padding: 4px 2px; border-bottom: 1px solid var(--line); }
.weekly-slots li b { margin-left: auto; font-variant-numeric: tabular-nums; }
.weekly-slots li.ok { color: var(--ink); } .weekly-slots li.no { color: var(--ink-soft); text-decoration: line-through; } .weekly-slots li.empty { color: var(--ink-soft); font-style: italic; }
.weekly-ranks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.weekly-ranks span { display: grid; justify-items: center; padding: 5px 2px; border-radius: 8px; background: var(--surface2); font-size: 10px; font-weight: 700; color: var(--ink-soft); text-align: center; line-height: 1.15; }
.weekly-ranks span em { font-style: normal; font-weight: 600; }
.weekly-ranks span.on { background: var(--gold); color: #2a1d00; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .weekly-rank b { color: var(--gold); } }

/* ============ Sammelmappen ============ */
.binder-btn { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 6px 12px 6px 6px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.binder-sw, .binder-prev { display: inline-flex; border-radius: 99px; overflow: hidden; }
.binder-sw i { width: 10px; height: 22px; }
.binder-prev { border-radius: 10px; width: 64px; height: 44px; }
.binder-prev i { flex: 1; }
.binder-list { display: grid; gap: 8px; padding-bottom: 8px; }
.binder-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); }
.binder-row.on { border-color: var(--gold); }
.binder-row > div { display: grid; }
.binder-row span { font-size: 13px; color: var(--ink-soft); }
.binder-row em { font-style: normal; font-weight: 700; color: var(--gold-deep); font-size: 14px; }
.album-screen { border-radius: 20px; transition: background .3s; }
.album-screen[class*="binder-"]:not(.binder-standard) { margin: -6px -8px 0; padding: 14px 12px 16px; }
/* Retro-Leder */
.binder-retro { background: radial-gradient(circle at 30% 20%, #8b5a2b, #5a3a22 70%); box-shadow: inset 0 0 0 6px #4a2f1b, inset 0 0 0 8px transparent, inset 0 0 0 9px #f0d9a8; color: #fbeed5; --ink-soft: #e2cba3; --surface: rgba(0,0,0,.18); --surface2: rgba(0,0,0,.22); --line: rgba(240,217,168,.35); }
.binder-retro .slot.unknown { background: rgba(0,0,0,.2); border-color: rgba(240,217,168,.45); border-style: dashed; }
.binder-retro .slot.owned .card { filter: sepia(.25); box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.binder-retro .album-count span { color: #fff6df; }
/* Comic */
.binder-comic { background: radial-gradient(circle, rgba(0,0,0,.18) 1.2px, transparent 1.6px) 0 0 / 9px 9px, #ffd23f; color: #111; --ink: #111; --ink-soft: #3a2a00; --surface: #fff; --surface2: #fff4c2; --line: #111; }
.binder-comic .slot.owned .card, .binder-comic .slot.unknown { outline: 3px solid #111; outline-offset: 0; box-shadow: 4px 4px 0 #111; }
.binder-comic .slot.unknown { background: #fff; }
.binder-comic .album-count span { color: #e0233d; text-shadow: 2px 2px 0 #111; }
.binder-comic .bar { background: #fff; outline: 2px solid #111; }
/* Neon-Nacht */
.binder-neon { background: linear-gradient(180deg, #05010f, #140630); color: #f3f0ff; --ink: #f3f0ff; --ink-soft: #b9a8ff; --surface: rgba(255,43,214,.08); --surface2: rgba(34,240,255,.08); --line: rgba(34,240,255,.35); }
.binder-neon .slot.owned .card { box-shadow: 0 0 0 1.5px #22f0ff, 0 0 12px rgba(34,240,255,.6); }
.binder-neon .slot.unknown { background: transparent; border: 1.5px solid rgba(255,43,214,.6); box-shadow: 0 0 10px rgba(255,43,214,.35) inset; }
.binder-neon .album-count span { color: #22f0ff; text-shadow: 0 0 12px #22f0ff; }
/* Goldene Edition */
