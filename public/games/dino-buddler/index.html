<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd3f4">
<meta name="description" content="Dino-Buddler – grab Dinos aus, bau ihre Knochen zusammen und erwecke sie zum Leben. Lewolux Kids: ohne Werbung, ohne Käufe, ohne Lesen.">
<title>Dino-Buddler | Lewolux Kids</title>
<style>
@font-face{font-family:F;src:url(fonts/fredoka-700.woff2) format("woff2");font-weight:700;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3f4;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:F,"Trebuchet MS",system-ui,sans-serif;color:#4a2e1a}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.scr{position:fixed;inset:0;display:none;overflow:hidden}
.scr.on{display:block}
.bg{position:absolute;inset:0;background-size:cover;background-position:center bottom}
/* runde Knöpfe */
.b{position:absolute;z-index:30;border:0;outline:0;cursor:pointer;padding:0;border-radius:50%;width:var(--bs);height:var(--bs);background:radial-gradient(circle at 50% 35%,#fff,#ffeccc);box-shadow:0 calc(var(--bs)*.07) 0 #d99b54,0 calc(var(--bs)*.12) calc(var(--bs)*.2) rgba(80,40,10,.28);display:grid;place-items:center;transition:transform .12s,opacity .3s;touch-action:manipulation}
.b img{width:78%;height:78%;object-fit:contain}
.b svg{width:56%;height:56%}
.b:active,.b.pr{transform:translateY(4px) scale(.94)}
.b:focus-visible{outline:4px solid #fff;outline-offset:3px}
.b.big{--bs:calc(var(--u)*13)}
.b.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
:root{--u:min(1vw,1.6vh);--bs:calc(var(--u)*9.5);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
@media (orientation:portrait){:root{--u:min(1.9vw,1vh)}}
.tl{left:calc(var(--sl) + var(--u)*2.2);top:calc(var(--st) + var(--u)*2.2)}
.tr{right:calc(var(--sr) + var(--u)*2.2);top:calc(var(--st) + var(--u)*2.2)}
/* Titel */
#title .bg{background-color:#8fd3f4}
#title h1{position:absolute;left:0;right:0;top:calc(var(--st) + 6vh);margin:0;text-align:center;font-size:calc(var(--u)*11);line-height:1;color:#fff;letter-spacing:.02em;text-shadow:0 .08em 0 #c8611f,0 .14em .2em rgba(90,40,10,.35);-webkit-text-stroke:.06em #c8611f;paint-order:stroke fill;animation:wob 3s ease-in-out infinite}
#title h1 span{display:inline-block;animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-.18em)}}
@keyframes wob{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
#play{left:50%;bottom:calc(var(--sb) + 7vh);--bs:calc(var(--u)*18);margin-left:calc(var(--bs)/-2);background:radial-gradient(circle at 50% 35%,#a8ff7a,#3fbf3a);box-shadow:0 calc(var(--bs)*.07) 0 #23852a,0 calc(var(--bs)*.14) calc(var(--bs)*.22) rgba(20,60,10,.35);animation:pulse 1.4s ease-in-out infinite}
#play svg{width:50%;height:50%;margin-left:8%}
/* Park */
#park .bg{transition:filter 1.2s}
#night{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,20,70,.86),rgba(40,30,90,.62) 55%,rgba(20,20,60,.7));opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:5}
.night #night{opacity:1}
#stars{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity 1.5s}
.night #stars{opacity:1}
#stars i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:tw 2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
#dinos{position:absolute;inset:0;z-index:6}
.dino{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform;cursor:pointer}
.dino .in{position:relative;transform-origin:50% 100%}
.dino img.body{display:block;width:100%;height:100%;object-fit:contain}
.dino .acc{position:absolute;pointer-events:none}
.dino .shadow{position:absolute;left:12%;right:12%;bottom:-4%;height:9%;border-radius:50%;background:rgba(40,60,10,.28);filter:blur(3px)}
.dino.fly .shadow{display:none}
.zz{position:absolute;font-size:calc(var(--u)*3.4);color:#fff;text-shadow:0 2px 6px rgba(0,0,40,.6);animation:zz 2.4s ease-out forwards;pointer-events:none;z-index:9}
@keyframes zz{from{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}to{opacity:0;transform:translate(30px,-70px) scale(1.3)}}
.heart{position:absolute;width:calc(var(--u)*5);pointer-events:none;z-index:40;animation:heart 1.3s ease-out forwards}
@keyframes heart{0%{opacity:0;transform:translate(-50%,0) scale(.3)}25%{opacity:1;transform:translate(-50%,-30%) scale(1.15)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-260%) scale(.8)}}
/* Sammelleiste oben */
#strip{position:absolute;z-index:20;top:calc(var(--st) + var(--u)*2.4);left:50%;transform:translateX(-50%);display:flex;gap:calc(var(--u)*.6);padding:calc(var(--u)*.8) calc(var(--u)*1.4);background:rgba(255,255,255,.55);border-radius:999px;box-shadow:0 4px 14px rgba(60,40,10,.15);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:calc(100vw - var(--bs)*2 - var(--u)*10)}
#strip button{width:calc(var(--u)*5.4);height:calc(var(--u)*5.4);border:0;padding:0;background:none;cursor:pointer;flex:none}
#strip img{width:100%;height:100%;object-fit:contain}
#strip .no img{filter:brightness(0) opacity(.25)}
@media (orientation:portrait){#strip{flex-wrap:wrap;justify-content:center;width:calc(var(--u)*34);border-radius:calc(var(--u)*3)}}
/* Leiste unten */
#bar{position:absolute;z-index:30;left:50%;bottom:calc(var(--sb) + var(--u)*2.2);transform:translateX(-50%);display:flex;gap:calc(var(--u)*2.4);align-items:flex-end}
#bar .b{position:relative}
.badge{position:absolute;top:-6%;right:-6%;width:34%;height:34%;border-radius:50%;background:#ff4d5a;color:#fff;display:grid;place-items:center;font-size:calc(var(--u)*2.2);box-shadow:0 2px 0 #b8222e;animation:pulse 1s infinite}
/* Buddel */
#buddel{position:absolute;z-index:35;left:calc(var(--sl) + var(--u)*1);bottom:calc(var(--sb) + var(--u)*1);width:calc(var(--u)*15);cursor:pointer;transform-origin:50% 100%;animation:idle 2.6s ease-in-out infinite;pointer-events:auto}
#buddel img{width:100%;display:block}
#buddel.talk{animation:talk .32s ease-in-out infinite}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.97)}}
@keyframes talk{0%,100%{transform:scale(1,1) rotate(0)}50%{transform:scale(1.05,.95) rotate(-2deg)}}
#bubble{position:absolute;z-index:36;left:calc(var(--sl) + var(--u)*13);bottom:calc(var(--sb) + var(--u)*12);min-width:calc(var(--u)*7);height:calc(var(--u)*6);padding:0 calc(var(--u)*1.6);border-radius:calc(var(--u)*3);background:#fff;box-shadow:0 4px 12px rgba(60,40,10,.2);display:flex;align-items:center;gap:calc(var(--u)*.6);opacity:0;transform:scale(.4);transform-origin:0 100%;transition:opacity .25s,transform .25s;pointer-events:none}
#bubble.on{opacity:1;transform:scale(1)}
#bubble i{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);border-radius:50%;background:#e0893c;animation:dots 1s infinite}
#bubble i:nth-child(2){animation-delay:.15s}#bubble i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,100%{transform:translateY(0)}50%{transform:translateY(-35%)}}
/* Nest mit Tages-Ei */
#nest{position:absolute;z-index:7;width:calc(var(--u)*11);cursor:pointer;display:none}
#nest.on{display:block}
#nest img{width:100%;animation:eggw 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes eggw{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(0)}}
/* Futter */
#tray{position:absolute;z-index:31;left:50%;bottom:calc(var(--sb) + var(--u)*17);transform:translate(-50%,30px);display:flex;gap:calc(var(--u)*1.6);padding:calc(var(--u)*1.2) calc(var(--u)*2);border-radius:calc(var(--u)*4);background:rgba(255,248,235,.92);box-shadow:0 8px 24px rgba(60,40,10,.25);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#tray.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#tray .food{width:calc(var(--u)*10);height:calc(var(--u)*10);cursor:grab;touch-action:none;display:grid;place-items:center;border-radius:calc(var(--u)*2.4);background:#fff;box-shadow:0 3px 0 #ecd2ad}
#tray .food img{width:82%;height:82%;object-fit:contain}
.drag{position:fixed;z-index:80;width:calc(var(--u)*10);height:calc(var(--u)*10);pointer-events:none;transform:translate(-50%,-60%) scale(1.15);filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.drag img{width:100%;height:100%;object-fit:contain}
/* Graben */
#dig .bg{filter:saturate(1.05)}
#pit{position:absolute;z-index:5;border-radius:calc(var(--u)*3);overflow:hidden;box-shadow:0 0 0 calc(var(--u)*.9) #a8692f,0 0 0 calc(var(--u)*1.6) #f6d39a,0 18px 40px rgba(70,30,0,.4);background:#c88a4c}
#layer{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#c98d55,#a5672f)}
#layer::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,220,170,.25),transparent 40%),radial-gradient(circle at 70% 75%,rgba(90,40,10,.18),transparent 45%)}
.item{position:absolute;transform-origin:50% 50%;filter:drop-shadow(0 3px 2px rgba(60,20,0,.35))}
.item canvas,.item img{width:100%;height:100%;display:block}
#sand,#fx{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#sand{cursor:none}
#fx{pointer-events:none}
#brush{position:absolute;z-index:8;width:calc(var(--u)*11);pointer-events:none;transform-origin:20% 90%;display:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
#found{position:absolute;z-index:20;left:50%;bottom:calc(var(--sb) + var(--u)*1.6);transform:translateX(-50%);display:flex;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1) calc(var(--u)*1.6);border-radius:calc(var(--u)*3);background:rgba(255,246,228,.85);box-shadow:0 4px 14px rgba(60,40,10,.2)}
#found .slot{width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:calc(var(--u)*2);border:calc(var(--u)*.35) dashed #d1a36d;display:grid;place-items:center;transition:transform .3s}
#found .slot.got{border-style:solid;border-color:#ffb43c;background:#fff6dd;animation:popin .45s}
#found .slot canvas,#found .slot img{max-width:86%;max-height:86%}
@keyframes popin{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.fly{position:fixed;z-index:90;pointer-events:none;transition:all .8s cubic-bezier(.5,-0.3,.4,1.2)}
/* Puzzle */
#puz .bg{filter:blur(4px) brightness(.8)}
#board{position:absolute;z-index:5}
#ghost{position:absolute;inset:0;width:100%;height:100%;filter:brightness(0) opacity(.18);object-fit:fill}
.piece{position:absolute;z-index:10;touch-action:none;cursor:grab;transition:transform .2s,filter .2s;filter:drop-shadow(0 6px 6px rgba(40,20,0,.35))}
.piece.dragging{z-index:50;transform:scale(1.08)!important;transition:none;filter:drop-shadow(0 14px 12px rgba(40,20,0,.35))}
.piece.done{cursor:default;filter:none;transition:left .25s,top .25s,transform .25s}
.piece canvas{width:100%;height:100%;display:block}
#magic{position:absolute;z-index:60;pointer-events:none}
#alive{position:absolute;z-index:61;pointer-events:none;opacity:0}
#flash{position:absolute;inset:0;z-index:70;background:#fff;opacity:0;pointer-events:none}
#confetti{position:absolute;inset:0;z-index:75;pointer-events:none;width:100%;height:100%}
#nextBtn{left:50%;bottom:calc(var(--sb) + var(--u)*4);--bs:calc(var(--u)*15);margin-left:calc(var(--bs)/-2);display:none;background:radial-gradient(circle at 50% 35%,#a8ff7a,#3fbf3a);box-shadow:0 calc(var(--bs)*.07) 0 #23852a,0 calc(var(--bs)*.14) calc(var(--bs)*.22) rgba(20,60,10,.35);animation:pulse 1.4s infinite;z-index:80}
/* Overlays */
.ov{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(60,30,10,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.ov.on{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{position:relative;background:linear-gradient(180deg,#fff8ea,#ffe9c4);border-radius:calc(var(--u)*4);padding:calc(var(--u)*4);box-shadow:0 calc(var(--u)*1) 0 #e0a65c,0 20px 50px rgba(60,30,0,.35);max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow:auto;animation:popin .35s}
.panel .x{position:absolute;right:calc(var(--u)*1);top:calc(var(--u)*1);--bs:calc(var(--u)*8)}
.grid{display:grid;grid-template-columns:repeat(4,calc(var(--u)*13));gap:calc(var(--u)*1.8)}
@media (orientation:portrait){.grid{grid-template-columns:repeat(3,calc(var(--u)*13))}}
.cell{width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:calc(var(--u)*3);background:#fff;box-shadow:0 4px 0 #ecd2ad;display:grid;place-items:center;border:0;cursor:pointer;padding:0}
.cell img{width:80%;height:80%;object-fit:contain}
.cell.no img{filter:brightness(0) opacity(.2)}
.cell.sel{outline:calc(var(--u)*.7) solid #ffb43c}
.ptitle{display:flex;justify-content:center;margin:0 0 calc(var(--u)*2.4)}
.ptitle img{width:calc(var(--u)*10)}
#wardrobe .panel{padding:calc(var(--u)*2.4) calc(var(--u)*3)}
#wardrobe .stage{width:calc(var(--u)*34);height:calc(var(--u)*19);position:relative;margin:calc(var(--u)*5) auto calc(var(--u)*1)}
#wardrobe .row{display:flex;gap:calc(var(--u)*1.4);justify-content:center;flex-wrap:wrap;margin-top:calc(var(--u)*1.6)}
#wardrobe .row{gap:calc(var(--u)*1)}
#wardrobe .row .cell{width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:calc(var(--u)*2)}
#wDinos{max-width:calc(var(--u)*56);margin-inline:auto}
#eggOv .egg{width:calc(var(--u)*30);height:calc(var(--u)*30);position:relative;cursor:pointer;display:grid;place-items:center}
#eggOv .egg img{width:70%}
#eggOv .egg .prize{position:absolute;width:55%;opacity:0;transform:scale(.2)}
.crack{animation:crack .5s}
@keyframes crack{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.05)}75%{transform:rotate(12deg) scale(1.05)}}
#loading{position:fixed;inset:0;z-index:200;background:#8fd3f4;display:grid;place-items:center;color:#fff;font-size:calc(var(--u)*5);text-shadow:0 3px 0 #3c8fb8}
#loading .bar{width:calc(var(--u)*40);height:calc(var(--u)*2.4);border-radius:99px;background:rgba(255,255,255,.4);overflow:hidden;margin-top:calc(var(--u)*2)}
#loading .bar i{display:block;height:100%;width:0;background:#fff;transition:width .2s}

/* Buddel oben rechts beim Graben und Puzzeln */
body.bud-top #buddel{left:auto;bottom:auto;right:calc(var(--sr) + var(--u)*1.5);top:calc(var(--st) + var(--u)*1);width:calc(var(--u)*12)}
body.bud-top #bubble{left:auto;bottom:auto;right:calc(var(--sr) + var(--u)*13);top:calc(var(--st) + var(--u)*3);transform-origin:100% 0}
@media (orientation:portrait){
  #bar{gap:calc(var(--u)*1.2);bottom:calc(var(--sb) + var(--u)*1.6)}
  #bar .b{--bs:calc(var(--u)*7.6)}
  #bar .b.big{--bs:calc(var(--u)*10.5)}
  body:not(.bud-top) #buddel{width:calc(var(--u)*11);bottom:calc(var(--sb) + var(--u)*13)}
  body:not(.bud-top) #bubble{bottom:calc(var(--sb) + var(--u)*22);left:calc(var(--sl) + var(--u)*9)}
  #tray{bottom:calc(var(--sb) + var(--u)*14)}
  #tray .food{width:calc(var(--u)*8.5);height:calc(var(--u)*8.5)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="loading"><div style="text-align:center"><div>🦖</div><div class="bar"><i id="lbar"></i></div></div></div>

<!-- TITEL -->
<section class="scr" id="title">
  <div class="bg" style="background-image:url(assets/title.webp)"></div>
  <h1 aria-label="Dino-Buddler"><span>Dino</span>-<span style="animation-delay:.25s">Buddler</span></h1>
  <button class="b" id="play" aria-label="Spielen"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="#fff" stroke="#23852a" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
  <button class="b tl" id="exit1" aria-label="Zurück zu Lewolux Kids"><img src="assets/ic_home.webp" alt=""></button>
</section>

<!-- PARK -->
<section class="scr" id="park">
  <div class="bg" style="background-image:url(assets/bg_park.webp)"></div>
  <div id="stars"></div>
  <div id="night"></div>
  <div id="nest"><img src="assets/ic_egg.webp" alt=""></div>
  <div id="dinos"></div>
  <div id="strip" aria-label="Gefundene Dinos"></div>
  <button class="b tl" id="exit2" aria-label="Zurück zu Lewolux Kids"><img src="assets/ic_home.webp" alt=""></button>
  <button class="b tr" id="snd" aria-label="Ton an oder aus"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#e0893c"/><path id="sndw" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#e0893c" stroke-width="2" stroke-linecap="round"/></svg></button>
  <div id="tray"></div>
  <div id="bar">
    <button class="b" id="bFood" aria-label="Füttern"><img src="assets/food_berry.webp" alt=""></button>
    <button class="b" id="bWard" aria-label="Verkleiden"><img src="assets/acc_crown.webp" alt=""></button>
    <button class="b big pulse" id="bDig" aria-label="Ausgraben"><img src="assets/ic_shovel.webp" alt=""></button>
    <button class="b" id="bChest" aria-label="Schatzkiste"><img src="assets/ic_chest.webp" alt=""></button>
    <button class="b" id="bNight" aria-label="Tag und Nacht"><img src="assets/ic_moon.webp" alt="" id="nightIc"></button>
  </div>
</section>

<!-- GRABEN -->
<section class="scr" id="dig">
  <div class="bg" style="background-image:url(assets/bg_dig.webp)"></div>
  <div id="pit"><div id="layer"></div><div id="items"></div><canvas id="sand"></canvas><canvas id="fx"></canvas></div>
  <img id="brush" src="assets/ic_brush.webp" alt="">
  <div id="found"></div>
  <button class="b tl" id="back1" aria-label="Zurück zum Park"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#e0893c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</section>

<!-- PUZZLE -->
<section class="scr" id="puz">
  <div class="bg" style="background-image:url(assets/bg_dig.webp)"></div>
  <div id="board"><img id="ghost" alt=""></div>
  <div id="magic"></div>
  <img id="alive" alt="">
  <div id="flash"></div>
  <canvas id="confetti"></canvas>
  <button class="b" id="nextBtn" aria-label="Ab in den Park"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="#fff" stroke="#23852a" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
  <button class="b tl" id="back2" aria-label="Zurück zum Park"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#e0893c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</section>

<!-- Buddel (immer da) -->
<div id="buddel" role="button" aria-label="Buddel – nochmal sagen"><img src="assets/buddel_1.webp" alt="" id="budImg"></div>
<div id="bubble"><i></i><i></i><i></i></div>

<!-- Schatzkiste -->
<div class="ov" id="chestOv"><div class="panel"><button class="b x" data-close aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#e0893c" stroke-width="3.2" stroke-linecap="round"/></svg></button><div class="ptitle"><img src="assets/ic_chest.webp" alt=""></div><div class="grid" id="chestGrid"></div></div></div>
<!-- Verkleiden -->
<div class="ov" id="wardrobe"><div class="panel"><button class="b x" data-close aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#e0893c" stroke-width="3.2" stroke-linecap="round"/></svg></button><div class="stage" id="wStage"></div><div class="row" id="wAcc"></div><div class="row" id="wDinos"></div></div></div>
<!-- Tages-Ei -->
<div class="ov" id="eggOv"><div class="panel"><div class="egg" id="eggBig"><img src="assets/ic_egg.webp" alt="" id="eggImg"><img class="prize" id="eggPrize" alt=""></div></div></div>

<script>

function tone(f, d, type="sine", v=.18, slide=0, delay=0){
  const c = ac(); if (!c || !S.sound) return;
  const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f*slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .05);
}
function noise(d, v=.12, hp=800, delay=0){
  const c = ac(); if (!c || !S.sound) return;
  const len = c.sampleRate*d|0, b = c.createBuffer(1, len, c.sampleRate), x = b.getChannelData(0);
  for (let i = 0; i < len; i++) x[i] = (Math.random()*2-1) * (1 - i/len);
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  f.type = "highpass"; f.frequency.value = hp; s.buffer = b; g.gain.value = v;
  s.connect(f).connect(g).connect(c.destination); s.start(c.currentTime + delay);
}

const MUS = {};

function music(name){
  if (musNow === name) return; musNow = name;
  Object.entries(MUS).forEach(([k,a]) => { if (k !== name) fadeTo(a, 0, () => a.pause()); });
  if (!S.sound || !name) return;
  let a = MUS[name];
  if (!a) { a = MUS[name] = new Audio(`sfx/music_${name}.mp3`); a.loop = true; a.volume = 0; }
  a.play().then(() => fadeTo(a, name === "night" ? .32 : .26)).catch(()=>{});
}
function fadeTo(a, v, done){ const s = a.volume, t0 = performance.now(); const f = t => { const k = Math.min(1, (t - t0)/700); a.volume = Math.max(0, Math.min(1, s + (v - s)*k)); if (k < 1) requestAnimationFrame(f); else if (done) done(); }; requestAnimationFrame(f); }

let vxCur = null, vxTok = 0, lastSay = "";
const bud = $("#buddel"), bubble = $("#bubble");
function talking(on){ bud.classList.toggle("talk", on); bubble.classList.toggle("on", on); duck(on); }
function say(t, opt={}){
  if (!t) return; lastSay = t;
  vxTok++; const tok = vxTok;
  if (vxCur) { try { vxCur.pause(); } catch(e) {} vxCur = null; }
  try { speechSynthesis.cancel(); } catch(e) {}
  if (!S.sound) return;
  const id = VOX[t];
  if (id) {
    const a = new Audio(`voice/${id}.mp3`); vxCur = a; talking(true);
    a.onended = a.onerror = () => { if (tok === vxTok) { talking(false); vxCur = null; if (opt.done) opt.done(); } };
    a.play().catch(() => { talking(false); });
    return;
  }
  try {
    const u = new SpeechSynthesisUtterance(t); u.lang = "de-DE"; u.rate = .92; u.pitch = 1.25;
    const v = speechSynthesis.getVoices().find(v => /^de/i.test(v.lang)); if (v) u.voice = v;
    u.onend = () => { if (tok === vxTok) { talking(false); if (opt.done) opt.done(); } };
    talking(true); speechSynthesis.speak(u);
    setTimeout(() => { if (tok === vxTok && !speechSynthesis.speaking) talking(false); }, 6000);
  } catch(e) {}
}

const dinosEl = $("#dinos"), strip = $("#strip");

function dinoSize(d){ const base = Math.min(H*.25, W*(W > H ? .2 : .36)); return base * d.h; }
function makeActor(d, enter){
  const el = document.createElement("div"); el.className = "dino" + (d.fly ? " fly" : "");
  el.innerHTML = `<div class="shadow"></div><div class="in"><img class="body" src="assets/dino_${d.id}.webp" alt="${d.name}"></div>`;
  dinosEl.appendChild(el);
  const img = el.querySelector("img"), a = {d, el, inner: el.querySelector(".in"), img, x: rnd(.15,.85)*W, y: 0, dir: Math.random() < .5 ? -1 : 1, v: rnd(.4,.9), wait: rnd(0,3), t: rnd(0,10), jump: 0, ar: 1, eat: 0, nope: 0, dance: 0};
  img.onload = () => { a.ar = img.naturalWidth / img.naturalHeight; layoutActor(a); };
  if (enter) { a.x = -dinoSize(d); a.dir = 1; a.wait = 0; a.enter = W*.4; }
  a.lane = Math.random();
  layoutActor(a); wearAcc(a);
  el.addEventListener("pointerdown", e => { e.stopPropagation(); tapDino(a); });
  actors.push(a);
  return a;
}
function layoutActor(a){
  const h = dinoSize(a.d), w = h * a.ar;
  a.w = w; a.h = h; a.el.style.width = w + "px"; a.el.style.height = h + "px";
  a.inner.style.width = w + "px"; a.inner.style.height = h + "px";
  a.y = a.d.fly ? H*(.16 + a.lane*.16) + h : H*(.6 + a.lane*.28);
  a.y = Math.min(a.y, H - (W > H ? U*15 : U*20));
  placeAcc(a);
}
function wearAcc(a){

  acc.src = `assets/acc_${id}.webp`; acc.dataset.k = id; placeAcc(a);
}
const ACC_FIT = {crown:[1,0.04],tophat:[.95,0.04],bow:[.9,.12],glasses:[1,0],party:[.7,0.04],hat:[1.2,.06]}; // Breite relativ zum Kopf, Verschiebung nach unten
function placeAcc(a, box){
  const acc = (box || a.el).querySelector(".acc"); if (!acc) return;
  const w = box ? box.clientWidth : a.w, h = box ? box.clientHeight : a.h;
  const [hx, hy, hw] = a.d.head, k = acc.dataset.k, f = ACC_FIT[k] || [1,0];
  if (k === "glasses") { const [ex, ey] = a.d.eye, aw = Math.max(hw*w*.85, w*.16); acc.style.width = aw + "px"; acc.style.left = (ex*w - aw*.45) + "px"; acc.style.top = (ey*h - aw*.2) + "px"; return; }
  const aw = hw * w * f[0];
  acc.style.width = aw + "px"; acc.style.left = (hx*w - aw/2) + "px";
  const ar = acc.naturalWidth ? acc.naturalHeight/acc.naturalWidth : .6;
  acc.style.top = (hy*h - aw*ar*.8 + f[1]*aw) + "px";
  if (!acc.naturalWidth && !acc.dataset.w8) { acc.dataset.w8 = 1; acc.addEventListener("load", () => placeAcc(a, box), {once: true}); }
}

/* ---------- Controller-Modus an/aus ---------- */

}

var probe = setInterval(function(){ var l = pads(); for (var i = 0; i < (l ? l.length : 0); i++) if (l[i]) { if (!seen) { seen = true; start(); } return; } }, 1000);

/* ---------- Haupt-Schleife ---------- */

  if (took) { hideRing(); rep.dir = ''; return; }

/* ---------- Menü-Navigation (DOM) ---------- */
var SEL = 'button,a[href],input:not([type=hidden]),select,textarea,summary,[role=button],[role=tab],[role=menuitem],[role=option],[role=switch],[role=checkbox],[role=radio],[role=link],[tabindex]:not([tabindex="-1"]),[data-pad]';

  for (var i = 0; i < pts.length; i++){
    var h = D.elementFromPoint(pts[i][0], pts[i][1]);
    if (h && (h === el || el.contains(h) || (h.contains(el) && h !== D.body && h !== html) || h === ring)) return true;
  }
  return false;
}
function modalRoot(){
  if (typeof P.root === 'function') { var rr = P.root(); if (rr) return rr; }
  var ms = D.querySelectorAll('dialog[open],[aria-modal="true"],[role="dialog"],[role="alertdialog"]'), best = null;
  for (var i = 0; i < ms.length; i++){ var m = ms[i]; if (vis(m) && !m.closest('[hidden]')) best = m; }
  return best;
}
function candidates(){
  var root = modalRoot(), scope = root || D, out = [], els = scope.querySelectorAll(SEL);
  for (var i = 0; i < els.length; i++){

    if (!el.hasAttribute('data-pad')) {

      if (el.matches(BTN) && el.parentElement && el.parentElement.closest(BTN)) continue;
      if (!el.matches(BTN + ',input,select,textarea,summary') && el.querySelector(SEL)) continue;
    }

    out.push({ el:el, r:r });
  }

}
function inScroller(el){
  for (var p = el.parentElement; p && p !== D.body; p = p.parentElement){
    var cs = getComputedStyle(p);
    if (/(auto|scroll)/.test(cs.overflowY + cs.overflowX) && (p.scrollHeight > p.clientHeight + 2 || p.scrollWidth > p.clientWidth + 2)) return true;

}
function pickStart(list){

  var act = D.activeElement; if (act && act !== D.body) for (var i = 0; i < list.length; i++) if (list[i].el === act) return act;
  // größtes sichtbares Bedienelement (meist „Spielen“/„Los geht’s“)
  var best = null, ba = 0;
  list.forEach(function(c){ var r = c.r; if (r.bottom < 0 || r.top > innerHeight) return; var a = Math.min(r.width, innerWidth) * Math.min(r.height, innerHeight); if (c.el.matches('input,textarea,select')) a *= 0.3; if (a > ba) { ba = a; best = c.el; } });
  return best || (list[0] && list[0].el);
}
function move(dx, dy){
  var list = candidates(); if (!list.length) return;
  var f = P.focused, fr = f && list.filter(function(c){ return c.el === f; })[0];
  if (!fr) { focus(pickStart(list)); return; }
  var a = fr.r, ax = (a.left + a.right) / 2, ay = (a.top + a.bottom) / 2, best = null, bs = Infinity;

    } else {
      main = dy > 0 ? b.top - a.bottom : a.top - b.bottom; if ((dy > 0 ? by <= ay + 1 : by >= ay - 1)) return;

P.activate = activate;
var BACK_RE = /^(zur(ü|ue)ck|back|schlie(ß|ss)en|close|abbrechen|cancel|beenden|menü|menu|hauptmenü|home|×|✕|✖|x|←|‹|⟵|◀|<|‹ zurück|← zurück)$/i;

function key(k, code, kc){
  var t = D.activeElement && D.activeElement !== D.body ? D.activeElement : D;

function back(){
