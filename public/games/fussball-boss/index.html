<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f2a44">
<meta name="description" content="Fußball-Boss – der Fußballmanager für Kinder ab 7. Lewolux Kids: ohne Werbung, ohne Käufe, alles vorgelesen.">
<title>Fußball-Boss | Lewolux Kids</title>
<style>
@font-face{font-family:F;src:url(fonts/fredoka-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--navy:#0f2a44;--navy2:#163b5e;--grass:#2fa84f;--gold:#ffc83d;--red:#e8484a;--ink:#1d2a3a;--mut:#5b6b7f;--card:#fff;--line:#e3e9f1;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
img{-webkit-user-drag:none;user-drag:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,.f{font-family:F,"Trebuchet MS",system-ui,sans-serif;font-weight:700;letter-spacing:.01em}
.scr{position:fixed;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-1}
.bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,42,68,.35),rgba(15,42,68,.8))}
/* Kopfzeile */
.top{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 8px) calc(var(--sr) + 12px) 8px calc(var(--sl) + 12px);background:rgba(15,42,68,.92);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:5;min-height:58px}
.top .back{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.top .back svg{width:22px;height:22px}
.top h2{margin:0;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px 6px 6px;font-weight:800;white-space:nowrap;font-size:15px}
.money img{width:26px;height:26px}
.tl{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;vertical-align:middle}.tl img{width:1.35em;height:1.35em;object-fit:contain;margin-left:-1px}
.money.neg{color:#ff9b9b}
.help{width:44px;height:44px;border-radius:14px;background:var(--gold);color:#4a3200;font-family:F;font-size:24px;display:grid;place-items:center;flex:none}
body.tipon .body{padding-bottom:calc(var(--sb) + 200px)}
.body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px calc(var(--sr) + 12px) calc(var(--sb) + 90px) calc(var(--sl) + 12px)}
.wrap{max-width:1100px;margin:0 auto}
/* Karten & Knöpfe */
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 0 #cfd9e6,0 8px 20px rgba(0,0,0,.12);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;background:var(--grass);color:#fff;font-family:F;font-size:19px;box-shadow:0 4px 0 #1e7a37;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1e7a37}
.btn.gold{background:var(--gold);color:#4a3200;box-shadow:0 4px 0 #c98f00}
.btn.red{background:var(--red);box-shadow:0 4px 0 #a92a2c}
.btn.grey{background:#e9eef5;color:var(--ink);box-shadow:0 4px 0 #c5d0de}
.btn.blue{background:#2f7de1;box-shadow:0 4px 0 #1d58a8}
.btn:disabled{opacity:.45;pointer-events:none}
.btn img{width:28px;height:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;background:#e9eef5;font-weight:800;color:var(--ink);font-size:15px}
.chip.on{background:var(--navy);color:#fff}
/* Hub */
#hub .body{padding-top:12px}
.club{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:12px}
.club img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.club h1{margin:0;font-size:26px;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.club p{margin:2px 0 0;font-weight:700;opacity:.9;font-size:15px}
.next{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.next .tm img{width:72px;height:72px;object-fit:contain}
.next .tm b{display:block;font-size:15px;margin-top:4px;line-height:1.15}
.next .tm small{display:block;color:var(--mut);font-weight:700}
.next .vs{font-family:F;font-size:26px;color:var(--mut)}
.nexthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;background:#eef3f9;border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;color:var(--navy2)}
.tag.cup{background:#fff3cf;color:#8a5a00}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.tile{background:#fff;border-radius:18px;box-shadow:0 4px 0 #cfd9e6,0 8px 18px rgba(0,0,0,.12);padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px;position:relative;transition:transform .12s}
.tile:active{transform:translateY(3px)}
.tile img{width:58px;height:58px;object-fit:contain}
.tile b{font-family:F;font-size:17px}
.tile small{color:var(--mut);font-weight:800;font-size:17px;text-align:center}
.tile .dot{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;font-size:14px;display:grid;place-items:center;animation:pul 1s infinite}
@keyframes pul{50%{transform:scale(1.15)}}
/* Kalle */
#kalle{position:fixed;z-index:90;left:calc(var(--sl) + 6px);bottom:calc(var(--sb) + 4px);width:92px;pointer-events:auto;cursor:pointer;transform-origin:50% 100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
#kalle img{width:100%;display:block}
#kalle.talk{animation:tk .3s infinite}
@keyframes tk{50%{transform:scale(1.04,.97) rotate(-1.5deg)}}
#tip{position:fixed;z-index:91;left:calc(var(--sl) + 96px);right:calc(var(--sr) + 10px);bottom:calc(var(--sb) + 18px);max-width:520px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:700;font-size:16px;line-height:1.35;display:none}
#tip.on{display:block;animation:pop .25s}
body.ovon #tip{top:calc(var(--st) + 8px);bottom:auto;left:calc(var(--sl) + 10px);margin:0 auto}body.ovon #tip::before{display:none}body.ovon.tipon .ov{padding-top:calc(var(--st) + 120px)}body.ovon #kalle{display:none!important}
#tip::before{content:"";position:absolute;left:-10px;bottom:22px;border:10px solid transparent;border-right-color:#fff;border-left:0}
#tip .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#tip .row .btn{min-height:42px;font-size:16px;padding:0 16px}
@keyframes pop{from{transform:scale(.8);opacity:0}}
/* Listen */
.list{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 3px 0 #d5dee9;cursor:pointer;min-height:66px}
.prow.sel{outline:3px solid var(--gold)}
.prow.dim{opacity:.55}
.face{position:relative;width:52px;height:52px;border-radius:50%;flex:none;overflow:hidden;background:var(--c,#2f7de1)}
.face img{position:absolute;left:50%;bottom:-4%;width:100%;transform:translateX(-50%)}
.face .num{position:absolute;right:-2px;bottom:-2px;background:#fff;border-radius:999px;font-size:11px;font-weight:900;padding:0 4px;line-height:16px;color:var(--ink)}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo small{color:var(--mut);font-weight:700;font-size:13px}
.bat{display:inline-block;position:relative;width:34px;height:15px;border:2px solid #33475b;border-radius:4px;vertical-align:middle;padding:1px}.bat::after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:5px;background:#33475b;border-radius:0 2px 2px 0}.bat i{display:block;height:100%;border-radius:2px}
.pos{display:inline-grid;place-items:center;min-width:36px;height:24px;padding:0 6px;border-radius:8px;font-weight:900;font-size:12px;color:#fff}
.pos.TW{background:#f0a500}.pos.AB{background:#2f7de1}.pos.MF{background:#2fa84f}.pos.ST{background:#e8484a}
.str{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.str .n{font-family:F;font-size:22px;line-height:1}
.stars{color:#f5b400;font-size:13px;letter-spacing:1px;white-space:nowrap}
.fitbar{width:56px;height:7px;border-radius:7px;background:#e3e9f1;overflow:hidden}
.fitbar i{display:block;height:100%;border-radius:7px}
.ic{font-size:16px}
.price{font-family:F;font-size:16px;white-space:nowrap}
/* Tabelle */
table.tab{width:100%;border-collapse:separate;border-spacing:0 6px;font-weight:700}
.tab th{font-size:13px;color:var(--mut);text-align:center;padding:0 4px}
.tab td{background:#fff;padding:8px 4px;text-align:center;font-size:15px}
.tab td:first-child{border-radius:12px 0 0 12px;width:34px}
.tab td:last-child{border-radius:0 12px 12px 0}
.tab td.tm{text-align:left;max-width:0;width:100%}
.tab td.tm .tmw{display:flex;align-items:center;gap:8px;min-width:0}
.tab td.tm img{width:30px;height:30px;object-fit:contain;flex:none}
.tab td.tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab tr.me td{background:#fff6d6}
.tab tr.up td:first-child{box-shadow:inset 6px 0 0 var(--grass)}
.tab tr.dn td:first-child{box-shadow:inset 6px 0 0 var(--red)}
.tab td.pts{font-family:F;font-size:18px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:#fff;font-weight:700;font-size:14px;margin:8px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
/* Aufstellung */
.lu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.lu{grid-template-columns:1fr}}
.pitch{position:relative;width:100%;aspect-ratio:68/98;max-height:78vh;margin:0 auto;border-radius:18px;background:repeating-linear-gradient(0deg,#35a853 0 10%,#2f9c4c 10% 20%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),0 6px 18px rgba(0,0,0,.25);overflow:hidden}
.pitch .ln{position:absolute;border:2px solid rgba(255,255,255,.7)}
.slot{position:absolute;width:23%!important;transform:translate(-50%,calc(min(46px,12vw) / -2));width:19%;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;z-index:2}
.slot .face{width:min(46px,12vw);height:min(46px,12vw);box-shadow:0 0 0 3px #fff,0 3px 6px rgba(0,0,0,.3)}
.slot .nm{background:rgba(15,42,68,.85);color:#fff;font-size:12px;font-weight:800;padding:1px 6px;border-radius:8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sv{width:70%;height:4px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden}.slot .sv i{display:block;height:100%}
.slot.sel .face{box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold)}
.slot.bad .face{box-shadow:0 0 0 3px var(--red)}
.slot .spos{position:absolute;top:-4px;left:calc(50% - min(46px,12vw) / 2 - 10px);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.4)}.spos.TW{background:#f0a500}.spos.AB{background:#2f7de1}.spos.MF{background:#2fa84f}.spos.ST{background:#e8484a}
.slot .stv{position:absolute;top:calc(min(46px,12vw) - 14px);left:calc(50% + min(46px,12vw) / 2 - 12px);background:var(--gold);color:#4a3200;border-radius:999px;font-size:11px;font-weight:900;padding:0 5px;line-height:17px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.slot .face .num{display:none}
.slot .warn{position:absolute;top:-4px;right:6%;background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;font-weight:900;display:grid;place-items:center}
.slot.empty .face{background:rgba(255,255,255,.3);display:grid;place-items:center;color:#fff;font-size:26px;font-weight:900}
.power{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.power div{background:#fff;border-radius:14px;padding:6px 2px;text-align:center;font-weight:800;font-size:11px;color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis}.power .pi{display:block;font-style:normal;font-size:20px;line-height:1.2}
.power b{display:block;font-family:F;font-size:22px;color:var(--ink)}
/* Spiel */
#match{background:#0b2238}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(var(--st) + 8px) calc(var(--sr) + 10px) 8px calc(var(--sl) + 10px);background:linear-gradient(#0f2a44,#163b5e);color:#fff}
.board .t{display:flex;align-items:center;gap:8px;min-width:0}
.board .t.r{flex-direction:row-reverse;text-align:right}
.board .t img{width:48px;height:48px;object-fit:contain;flex:none}
.board .t b{font-size:15px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.board .sc{text-align:center}
.board .sc .g{font-family:F;font-size:40px;line-height:1;letter-spacing:2px}
.board .sc .m{display:inline-block;margin-top:4px;background:var(--gold);color:#4a3200;border-radius:999px;padding:1px 10px;font-weight:900;font-size:14px}
.mstat{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;background:#0f2a44;color:#cfe0f5;font-weight:800;font-size:13px;padding:0 10px 6px}
.mstat b{color:#fff}
.possbar{display:inline-flex;width:90px;height:8px;border-radius:8px;overflow:hidden;vertical-align:middle;margin:0 6px;background:#555}
.possbar i{display:block;height:100%}
.field{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;background:url(assets/bg_match.webp) center/cover}
.field canvas{width:100%;height:100%;max-width:1000px;display:block}
.feed{position:absolute;left:10px;right:10px;bottom:8px;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.feed div{background:rgba(15,42,68,.88);color:#fff;border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px;animation:pop .25s;max-width:100%}
.mctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px calc(var(--sr) + 10px) calc(var(--sb) + 10px) calc(var(--sl) + 10px);background:#0f2a44}
.mctl .btn{min-height:46px;font-size:16px;padding:0 14px}
.big{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none}
.big div{font-family:F;font-size:min(22vw,150px);color:#fff;-webkit-text-stroke:6px #c8611f;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.25);animation:gol 1.6s ease-out forwards;text-align:center;line-height:1}
.big small{display:block;font-size:.22em;-webkit-text-stroke:3px #0f2a44;margin-top:.2em}
@keyframes gol{0%{transform:scale(.2) rotate(-10deg);opacity:0}20%{transform:scale(1.15) rotate(3deg);opacity:1}35%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
/* Overlays */
.ov{position:fixed;inset:0;z-index:80;background:rgba(10,25,40,.6);display:none;align-items:center;justify-content:center;padding:calc(var(--st) + 12px) 12px calc(var(--sb) + 12px)}
.ov.on{display:flex}
.dlg{background:#f4f7fb;border-radius:22px;width:min(560px,100%);max-height:100%;overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:pop .2s}
.dlg h2{margin:0 0 12px;font-size:24px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.pbig{display:flex;gap:14px;align-items:center}
.pbig .face{width:96px;height:96px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
.kv div{background:#fff;border-radius:12px;padding:8px 10px;font-weight:700;color:var(--mut);font-size:13px}
.kv b{display:block;color:var(--ink);font-size:18px;font-family:F}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 3px 0 #d5dee9;cursor:pointer;text-align:left;width:100%}
.opt.on{outline:3px solid var(--grass);background:#effbf2}
.opt img{width:52px;height:52px;object-fit:contain;flex:none}
.opt b{display:block;font-size:17px}
.opt small{color:var(--mut);font-weight:700}
.bigopt{flex-direction:column;justify-content:center;text-align:center;min-height:150px;margin:0}.bigopt span{font-size:64px;line-height:1}
.sect{color:#fff;font-family:F;font-size:20px;margin:18px 2px 8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tpick{background:#fff;border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 #d5dee9;font-weight:800;font-size:14px;text-align:center}
.tpick img{width:70px;height:70px;object-fit:contain}
.res{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px}
.res img{width:26px;height:26px;object-fit:contain}
.res .s{font-family:F;font-size:17px;min-width:48px;text-align:center}
.res .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .n.r{text-align:right}
.res.me{background:#fff6d6}
.trophies{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.trophies .tr{background:#fff;border-radius:16px;padding:10px;text-align:center;font-weight:800;width:140px}
.trophies img{width:100px;height:100px;object-fit:contain}
.title{align-items:center;justify-content:center;text-align:center;color:#fff;gap:18px;padding:20px}
.title h1{font-size:min(16vw,96px);margin:0;line-height:.95;-webkit-text-stroke:5px #0f2a44;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.3)}
.title h1 span{color:var(--gold)}
.title .btns{display:flex;flex-direction:column;gap:12px;width:min(320px,90%)}
.title .btn{min-height:60px;font-size:22px}
#loading{position:fixed;inset:0;z-index:200;background:var(--navy);display:grid;place-items:center;color:#fff;font-family:F;font-size:28px}
.note{color:#fff;font-weight:700;opacity:.9;margin:6px 2px}
.empty{color:#fff;opacity:.8;font-weight:700;text-align:center;padding:20px}
.fin td{padding:6px 8px}
.bar2{height:10px;border-radius:10px;background:#e3e9f1;overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--grass)}
body.nokalle:not(.tipon) #kalle{display:none}
@media (max-width:760px),(max-height:500px){#kalle{display:none}body.tipon #kalle{display:block}}
@media (max-width:480px){.top h2{font-size:18px}.money{font-size:14px}.tiles{grid-template-columns:repeat(2,1fr)}.tile{min-height:104px}.tile img{width:48px;height:48px}#kalle{width:74px}#tip{left:calc(var(--sl) + 76px);font-size:15px}}
@media (orientation:landscape) and (max-height:500px){#kalle{width:70px}.board .t img{width:36px;height:36px}.board .sc .g{font-size:30px}.mctl{padding-top:6px;padding-bottom:calc(var(--sb) + 6px)}.mctl .btn{min-height:40px}}
</style>
</head>
<body>
<div id="loading">⚽</div>

<section class="scr title" id="title">
  <div class="bgimg" style="background-image:url(assets/bg_stadium.webp)"></div>
  <img src="assets/trophy_3.webp" alt="" style="width:120px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))">
  <h1>Fußball-<span>Boss</span></h1>

/* ===================== Aufstellung ===================== */
let luSel = null;
function lineupPage() {
  luSel = null;
  G.lineup = G.lineup.map(id => (id && G.players[id] && G.players[id].team === G.me && FBk.available(G.players[id])) ? id : null);

}
function renderLineup(root) {
  const slots = FBk.FORMATIONS[G.formation];
  const P = FBk.teamPower(G, G.me, G.lineup, G.formation, G.tactic, 0);
  const pl = slots.map((s, i) => {
    const id = G.lineup[i], p = id && G.players[id];
    if (!p) return `<div class="slot empty ${luSel === i ? "sel" : ""}" data-s="${i}" style="left:${s[1]}%;top:${slotY(s)}%"><div class="face">+</div><span class="spos ${s[0]}">${PIC[s[0]]}</span><span class="nm">${FBk.POS_NAME[s[0]]}</span></div>`;
    const bad = p.pos !== s[0];
    return `<div class="slot ${luSel === i ? "sel" : ""} ${bad ? "bad" : ""}" data-s="${i}" style="left:${s[1]}%;top:${slotY(s)}%">${faceHtml(p)}${bad ? `<span class="warn">!</span>` : ""}<span class="stv">${p.str}</span><span class="spos ${s[0]}">${PIC[s[0]]}</span><span class="nm">${esc(p.ln)}</span><span class="sv"><i style="width:${p.fit}%;background:${fitCol(p.fit)}"></i></span></div>`;
  }).join("");
  const squad = G.teams[G.me].squad.map(i => G.players[i]).sort((a, b) => "TWABMFST".indexOf(a.pos) - "TWABMFST".indexOf(b.pos) || b.str - a.str);
  const want = luSel != null ? slots[luSel][0] : null;
  root.innerHTML = `<div class="chips" style="margin-bottom:10px">${Object.keys(FBk.FORMATIONS).map(f => `<button class="chip ${f === G.formation ? "on" : ""}" data-f="${f}" data-say="${f.split("-").map(x => ["", "eins", "zwei", "drei", "vier", "fünf"][x]).join(" ")}">${f}</button>`).join("")}</div>
  <div class="chips" style="margin-bottom:12px">${[["🛡️ Defensiv", 0], ["⚖️ Normal", 1], ["⚔️ Offensiv", 2]].map(([n, v]) => `<button class="chip ${G.tactic === v ? "on" : ""}" data-tac="${v}" data-say="${n.slice(n.indexOf(" ") + 1)}">${n}</button>`).join("")}<button class="chip" id="bBest" data-say="Beste Elf" style="background:var(--gold);color:#4a3200">⭐ Beste Elf</button></div>
  <div class="lu"><div><div class="pitch" id="pitchLU"><div class="ln" style="left:-2px;right:-2px;top:50%;height:0;border-width:2px 0 0"></div><div class="ln" style="left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%"></div><div class="ln" style="left:22%;right:22%;bottom:-2px;height:16%"></div><div class="ln" style="left:22%;right:22%;top:-2px;height:16%"></div>${pl}</div>
  <div class="power"><div data-say="Abwehr"><i class="pi">🛡️</i>Abwehr<b>${Math.round(P.def)}</b></div><div data-say="Mittelfeld"><i class="pi">🔄</i>Mittelfeld<b>${Math.round(P.mid)}</b></div><div data-say="Angriff"><i class="pi">⚽</i>Angriff<b>${Math.round(P.att)}</b></div><div data-say="Torwart"><i class="pi">🧤</i>Torwart<b>${Math.round(P.keep)}</b></div></div></div>
  <div><p class="note">${luSel == null ? "Tippe auf einen Platz im Feld." : `Wähle einen Spieler für <b>${FBk.POS_NAME[want]}</b>:`}</p><div class="list" id="luList">${squad.map(p => { const inXI = G.lineup.includes(p.id); const off = !FBk.available(p); return prow(p, undefined, (inXI ? "sel" : "") + (off ? " dim" : "") + (want && p.pos === want && !inXI && !off ? "" : "")); }).join("")}</div></div></div>`;
  root.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { sfx("tap"); changeFormation(b.dataset.f); });
  root.querySelectorAll("[data-tac]").forEach(b => b.onclick = () => { sfx("tap"); G.tactic = +b.dataset.tac; save(); rerender(); });
  $("#bBest").onclick = () => { sfx("cheer"); G.lineup = FBk.bestXI(G, G.me, G.formation); save(); luSel = null; rerender(); };
  root.querySelectorAll(".slot").forEach(s => s.onclick = () => {
    sfx("tap"); const i = +s.dataset.s;
    if (luSel != null && luSel !== i) { const a = G.lineup[luSel]; G.lineup[luSel] = G.lineup[i]; G.lineup[i] = a; luSel = null; save(); rerender(); return; }
    luSel = luSel === i ? null : i; rerender();
  });
  root.querySelectorAll("#luList .prow").forEach(r => r.onclick = () => {
    const p = G.players[+r.dataset.p]; sfx("tap");
    if (luSel == null) { const i = G.lineup.indexOf(p.id); if (i >= 0) { luSel = i; rerender(); } else playerDlg(p); return; }
    if (!FBk.available(p)) { kalleSay(p.inj ? "isInj" : "isSus", { auto: 2500 }); return; }
    const old = G.lineup.indexOf(p.id); if (old >= 0) G.lineup[old] = G.lineup[luSel];
    G.lineup[luSel] = p.id; if (p.pos !== slots[luSel][0]) kalleSay("wrongpos", { auto: 3000 }); luSel = null; save(); rerender();
  });
}
const slotY = s => s[0] === "TW" ? 88 : 3 + s[2] * .82;
function changeFormation(f) {
  const old = G.lineup.filter(Boolean).map(id => G.players[id]); G.formation = f; const slots = FBk.FORMATIONS[f];
  const xi = new Array(slots.length).fill(null); const left = old.slice();
  slots.forEach((s, i) => { const k = left.findIndex(p => p.pos === s[0]); if (k >= 0) { xi[i] = left[k].id; left.splice(k, 1); } });
  slots.forEach((s, i) => { if (!xi[i] && left.length) { left.sort((a, b) => FBk.eff(b, s[0]) - FBk.eff(a, s[0])); xi[i] = left.shift().id; } });
  G.lineup = xi; luSel = null; save(); rerender();
}

/* ===================== Spieltag ===================== */
function preMatch(f) {
  G.lineup = G.lineup.map(id => (id && G.players[id] && G.players[id].team === G.me && FBk.available(G.players[id])) ? id : null);
  if (G.lineup.filter(Boolean).length < 11) { kalleSay("incomplete", { buttons: [["✋ Selbst", lineupPage, "grey"], ["⭐ Beste Elf", () => { G.lineup = FBk.bestXI(G, G.me, G.formation); save(); preMatch(f); }]] }); return; }
  if (!G.sponsor) { kalleSay("sponsor", { buttons: [["🤝 Sponsor", () => sponsorDlg(() => preMatch(f))]] }); return; }
  kalleSay("howWatch", { pose: 3, buttons: [] });
  dlg(`<h2>📺 oder ⏭ ?</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><button class="opt bigopt" data-live data-say="Live ansehen"><span>📺</span><b>Live ansehen</b></button><button class="opt bigopt" data-fast data-say="Nur das Ergebnis"><span>⏭️</span><b>Nur Ergebnis</b></button></div><div class="acts"><button class="btn grey" data-x data-say="Zurück">⬅️</button></div>`, d => {
    d.querySelector("[data-live]").onclick = () => { closeDlg(); sfx("whistle"); startMatch(f); };
    d.querySelector("[data-fast]").onclick = () => { closeDlg(); startMatch(f, true); };
    d.querySelector("[data-x]").onclick = () => { sfx("tap"); closeDlg(); };
  });
}
let M = null, mSpeed = 1, mTimer = 0, mPaused = false, mSide = 0, feedQ = [];
const cv = $("#pitch"), cx = cv.getContext("2d");
function startMatch(f, quick) {
  const nf = FBk.nextFixture(G); if (!nf || nf.none || nf.h !== f.h || nf.a !== f.a || nf.comp !== f.comp) { hub(); return; }
  G.lineup = G.lineup.map(id => (id && G.players[id] && G.players[id].team === G.me && FBk.available(G.players[id])) ? id : null);
  if (G.lineup.filter(Boolean).length < 11) G.lineup = FBk.bestXI(G, G.me, G.formation);
  M = FBk.newMatch(G, f.h, f.a, f.comp, { ko: f.comp === "C" }); M.st = { poss: [0, 0], sh: [0, 0], on: [0, 0], ch: [0, 0], y: [0, 0] }; mSide = f.h === G.me ? 0 : 1; mPaused = false;
  if (quick) { while (!M.done) stepStat(); endMatch(true); return; }
  show("match"); $("#mhC").src = crest(f.h); $("#maC").src = crest(f.a); $("#mhN").textContent = tname(f.h); $("#maN").textContent = tname(f.a);
  $("#mScore").textContent = "0:0"; $("#mMin").textContent = "0'"; $("#feed").innerHTML = ""; $("#mGo").hidden = true; ["mSpeed", "mSkip", "mTac", "mSub"].forEach(i => $("#" + i).hidden = false); drawStat();
  mSpeed = 1; $("#mSpeed").textContent = "▶ x1"; initDots(); sizeCanvas();
  sfx("whistle"); feed(C.kickoff); say(C.kickoff, { now: true });
  clearTimeout(mTimer); mTimer = setTimeout(tick, 900);
  requestAnimationFrame(drawLoop);
}
function tick() {
  if (cur !== "match" || !M || M.done) return;
  if (mPaused) { mTimer = setTimeout(tick, 200); return; }
  const ev = stepStat();
  $("#mMin").textContent = M.min + "'"; drawStat();
  ev.forEach(handleEvent);
  if (M.done) { endMatch(); return; }
  if (M.min === 45) { mPaused = true; kalleSay("half", { pose: 4, buttons: [["🧠 Taktik", tacDlg, "blue"], ["🔁 Wechseln", subDlg, "gold"], ["▶️ Weiter", () => { mPaused = false; }]] }); }
  mTimer = setTimeout(tick, 700 / mSpeed);
}
function stepStat() {
  const ev = FBk.step(G, M); M.st.poss[M.poss]++;
  ev.forEach(e => { if (e.t === "goal" || e.t === "save") { M.st.sh[e.s]++; M.st.on[e.s]++; } else if (e.t === "miss") M.st.sh[e.s]++; else if (e.t === "chance") M.st.ch[e.s]++; else if (e.t === "yellow") M.st.y[e.s]++; });
  return ev;
}
function possPct() { const t = M.st.poss[0] + M.st.poss[1] || 1; return Math.round(M.st.poss[0] / t * 100); }
function drawStat() {
  const p = possPct(), c0 = kit(M.h), c1 = kitClash(M.h, M.a) ? (c0 === "#f4f4f4" ? "#1d2a3a" : "#f4f4f4") : kit(M.a);
  $("#mStat").innerHTML = `<span>Ballbesitz <b>${p}%</b><span class="possbar"><i style="width:${p}%;background:${c0}"></i><i style="width:${100 - p}%;background:${c1}"></i></span><b>${100 - p}%</b></span><span>Schüsse <b>${M.st.sh[0]}:${M.st.sh[1]}</b></span><span>aufs Tor <b>${M.st.on[0]}:${M.st.on[1]}</b></span>`;
}
function skipMatch() {
  if (!M || M.done) return; clearTimeout(mTimer); stopVoice(); hideTip(); closeDlg(); mPaused = false;
