<script>
'use strict';
/* =========================================================
   Pandi – Blubber, Plopp & Boing!   (Lewolux Kids)
   Ein Kinderspiel: Pandi pustet Seifenblasen & wirft Wasserballons.
   Alles in einer Datei: Canvas-Grafik, WebAudio-Klänge, keine externen Ressourcen.
   ========================================================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const backOut=t=>{t=clamp(t,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const $=s=>document.querySelector(s);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------------- Speicherstand ---------------- */
const SAVE_KEY='lewolux-pandi-v1';
const S={stars:{},bamboo:{},stickers:{},outfit:{hat:null,glasses:null,scarf:null},set:{voice:true,music:true,sfx:true,easy:false},all:false,news:{}};
function loadSave(){
  try{const j=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(j&&typeof j==='object'){
      for(const k of ['stars','bamboo','stickers','news'])if(j[k]&&typeof j[k]==='object')S[k]=j[k];
      if(j.outfit)Object.assign(S.outfit,j.outfit);
      if(j.set)Object.assign(S.set,j.set);
      S.all=!!j.all;
    }}catch(e){}
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function totalStars(){let n=0;for(const k in S.stars)n+=S.stars[k]|0;return n}
function totalBamboo(){return Object.keys(S.bamboo).length}

/* ---------------- Audio (WebAudio-Synth) ---------------- */
const AU={ctx:null};
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{
    const ctx=new C();AU.ctx=ctx;
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(ctx.destination);
    AU.master=ctx.createGain();AU.master.gain.value=.9;AU.master.connect(comp);
    AU.sfx=ctx.createGain();AU.sfx.gain.value=.6;AU.sfx.connect(AU.master);
    AU.duck=ctx.createGain();AU.duck.gain.value=1;AU.duck.connect(AU.master);
    AU.mus=ctx.createGain();AU.mus.gain.value=S.set.music?.12:0;AU.mus.connect(AU.duck);
    const len=ctx.sampleRate,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;
    musicStart();
  }catch(e){AU.ctx=null}
}
function tone(f,dur,o){
  o=o||{};const ctx=AU.ctx;if(!ctx)return;if(!o.bus&&!S.set.sfx)return;
  try{
    const t0=ctx.currentTime+(o.d||0);
    const osc=ctx.createOscillator();osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t0);
    if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t0+(o.slide||dur));
    const g=ctx.createGain(),v=o.v||.3,a=Math.min(o.a||.01,dur*.5);
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    if(o.vib){const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=o.vib;lg.gain.value=o.vd||f*.03;l.connect(lg);lg.connect(osc.frequency);l.start(t0);l.stop(t0+dur+.05)}
    let node=osc;
    if(o.lp){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;osc.connect(fl);node=fl}
    node.connect(g);g.connect(o.bus||AU.sfx);osc.start(t0);osc.stop(t0+dur+.05);
  }catch(e){}
}
function noise(dur,o){
  o=o||{};const ctx=AU.ctx;if(!ctx||!AU.noise)return;if(!o.bus&&!S.set.sfx)return;
  try{
    const t0=ctx.currentTime+(o.d||0);
    const src=ctx.createBufferSource();src.buffer=AU.noise;src.loop=true;
    const f=ctx.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1000,t0);
    if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t0+dur);f.Q.value=o.q||1;
    const g=ctx.createGain(),a=Math.min(o.a||.01,dur*.5);
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(o.v||.2,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    src.connect(f);f.connect(g);g.connect(o.bus||AU.sfx);src.start(t0,Math.random()*.5);src.stop(t0+dur+.05);
  }catch(e){}
}
const SFX={
  tap(){tone(620,.07,{to:900,v:.12,type:'triangle'})},
  plopp(){tone(760,.13,{to:150,v:.34});noise(.05,{f:3200,v:.1,ft:'highpass'})},
  blow(){noise(.38,{f:700,to:1700,q:1.4,v:.1,a:.05});tone(300,.32,{to:560,v:.05,type:'triangle',a:.05})},
  whoosh(){noise(.3,{f:450,to:2400,q:2,v:.14,a:.03})},
  boing(){tone(150,.42,{to:540,slide:.12,v:.26,type:'triangle',vib:16,vd:35})},
  bonk(){tone(320,.14,{to:190,v:.22,type:'triangle'});noise(.04,{f:800,v:.08})},
  splash(){noise(.5,{f:1700,ft:'lowpass',v:.32});for(let i=0;i<4;i++)tone(rnd(1300,2300),.09,{d:i*.05+rnd(0,.04),to:rnd(600,900),v:.07})},
  giggle(){const b=rnd(820,980),m=[0,.13,.06,.2,.1];m.forEach((x,i)=>tone(b*(1+x),.1,{d:i*.085,v:.13,type:'triangle',vib:28,vd:45,to:b*(1+x)*.82}))},
  sneeze(){tone(400,.34,{to:800,v:.12,type:'triangle',a:.16});noise(.22,{d:.36,f:4200,ft:'highpass',v:.3});tone(950,.14,{d:.36,to:480,v:.09})},
  quak(){tone(300,.15,{type:'sawtooth',to:210,lp:1200,v:.2});tone(310,.17,{d:.19,type:'sawtooth',to:200,lp:1200,v:.2})},
  quack(){tone(520,.13,{type:'sawtooth',to:380,lp:1800,v:.16});tone(540,.15,{d:.16,type:'sawtooth',to:370,lp:1800,v:.16})},
  clank(){for(let i=0;i<3;i++){const d=i*.09;tone(530*(1+i*.07),.22,{d,type:'square',v:.045,lp:3200});tone(1150,.16,{d,v:.05});noise(.04,{d,f:5200,v:.08,ft:'highpass'})}},
  yawn(){tone(330,1.15,{type:'sawtooth',to:150,lp:700,v:.13,a:.25,vib:5,vd:7})},
  twinkle(){[1320,1660,1980,2640].forEach((f,i)=>tone(f,.28,{d:i*.06,v:.07}))},
  star(n){const b=[523,659,784][n%3];tone(b,.5,{v:.12,type:'triangle'});tone(b*1.5,.5,{d:.05,v:.08});tone(b*2,.6,{d:.1,v:.06})},
  hoot(){tone(430,.26,{to:370,v:.17,a:.05});tone(410,.36,{d:.32,to:340,v:.17,a:.05})},
  clap(){noise(.05,{f:2600,v:.28});noise(.05,{d:.13,f:2600,v:.28});noise(.05,{d:.26,f:2800,v:.25})},
  chime(){tone(1046,1.3,{v:.12});tone(1568,1.1,{v:.07,d:.03});tone(2093,.9,{v:.04,d:.06})},
  squeak(){tone(1300,.12,{to:1900,v:.12,type:'triangle'});tone(1500,.1,{d:.13,to:2200,v:.1,type:'triangle'})},
  squawk(){tone(950,.2,{type:'sawtooth',to:720,lp:2600,v:.1});tone(1000,.22,{d:.22,type:'sawtooth',to:700,lp:2600,v:.1})},

  const ctx=AU.ctx,o=ctx.createOscillator(),pre=ctx.createGain(),out=ctx.createGain();

function lin(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g}
function star5(c,x,y,r,ri,rot){c.beginPath();for(let i=0;i<10;i++){const a=(rot||0)-Math.PI/2+i*Math.PI/5,rr=i%2?ri:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath()}
function heart(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x-s*1.1,y-s*.35,x-s*.45,y-s*1.05,x,y-s*.45);c.bezierCurveTo(x+s*.45,y-s*1.05,x+s*1.1,y-s*.35,x,y+s*.35);c.closePath()}
const OUT='rgba(74,54,98,.6)';
const furW=(c,x,y,r)=>radial(c,x,y,r*1.15,[[0,'#ffffff'],[.55,'#f7f4fb'],[1,'#d7cfe4']],-.35,-.45);
const furB=(c,x,y,r)=>radial(c,x,y,r*1.1,[[0,'#625d70'],[.5,'#37323f'],[1,'#1f1c27']],-.3,-.4);
function bead(c,x,y,r){c.fillStyle='#1d1826';circ(c,x,y,r);c.fill();c.fillStyle='#fff';circ(c,x-r*.33,y-r*.35,r*.42);c.fill();circ(c,x+r*.32,y+r*.33,r*.17);c.fill()}
function bigEye(c,x,y,r,lx,ly){c.fillStyle='#fff';circ(c,x,y,r);c.fill();c.strokeStyle='rgba(60,40,80,.35)';c.lineWidth=r*.12;c.stroke();bead(c,x+(lx||0)*r*.25,y+(ly||0)*r*.2,r*.62)}
function blush(c,x,y,r,a){c.fillStyle=`rgba(255,120,155,${a==null?.45:a})`;ell(c,x,y,r,r*.62);c.fill()}
function smileL(c,x,y,w,lw,col){c.strokeStyle=col||'#3a2a3a';c.lineWidth=lw||1.8;c.lineCap='round';c.beginPath();c.arc(x,y-w*.35,w,.2*Math.PI,.8*Math.PI);c.stroke()}
function closedEye(c,x,y,w,lw,col,up){c.strokeStyle=col||'#2a2230';c.lineWidth=lw||2;c.lineCap='round';c.beginPath();if(up)c.arc(x,y+w*.4,w,1.15*Math.PI,1.85*Math.PI);else c.arc(x,y-w*.4,w,.15*Math.PI,.85*Math.PI);c.stroke()}

/* =================== Pandi =================== */
const PANDI_H=180;
function armTo(dx,dy){return Math.atan2(-dx,dy)}
function drawArm(c,sx,sy,ang,len){
  c.save();c.translate(sx,sy);c.rotate(ang);
  c.fillStyle=furB(c,0,len*.5,len*.75);rrect(c,-11.5,-8,23,len+15,11.5);c.fill();
  c.strokeStyle=OUT;c.lineWidth=2;c.stroke();
  c.fillStyle='rgba(255,255,255,.08)';ell(c,-4,len*.35,3,len*.3);c.fill();
  c.fillStyle='#f4a3bb';ell(c,0,len+1,6.2,4.6);c.fill();
  c.fillStyle='#f8bfd0';[-5,0,5].forEach(x=>{circ(c,x,len+7.5,1.9);c.fill()});
  c.restore();
}
function pawPos(P,side){const sx=side*33,sy=-84,a=side<0?P.armL:P.armR,len=P.armLen||40;return{x:sx-Math.sin(a)*len,y:sy+Math.cos(a)*len}}
function drawPandi(c,x,y,sc,P,O){
  O=O||S.outfit;const t=P.t||0;
  c.save();c.translate(x,y);
  c.fillStyle='rgba(40,25,60,.16)';ell(c,0,1,50*sc*(1-(P.jump||0)*.006),9*sc);c.fill();
  c.scale(sc,sc);c.translate(0,-(P.jump||0));c.rotate(P.sway||0);
  const sq=P.sq||1;c.scale(2-sq,sq);
  // Umhang hinten
  if(O.scarf==='umhang'){c.save();c.fillStyle=lin(c,0,-95,0,0,[[0,'#ff5d7a'],[1,'#c5305a']]);c.beginPath();c.moveTo(-30,-95);c.quadraticCurveTo(-58+Math.sin(t*3)*4,-30,-50,-6);c.quadraticCurveTo(0,6+Math.sin(t*4)*3,50,-6);c.quadraticCurveTo(58+Math.sin(t*3+1)*4,-30,30,-95);c.closePath();c.fill();c.strokeStyle='rgba(120,20,50,.5)';c.lineWidth=2;c.stroke();c.restore()}
  // Beine
  for(const s of [-1,1]){
    const lift=s<0?(P.legL||0):(P.legR||0);
    c.save();c.translate(0,-lift);
    c.fillStyle=furB(c,s*21,-24,24);ell(c,s*21,-22,17,20,s*-.12);c.fill();c.strokeStyle=OUT;c.lineWidth=2;c.stroke();
    ell(c,s*24,-7,17,10);c.fill();c.stroke();
    c.fillStyle='#f4a3bb';ell(c,s*24,-6,7.5,4.2);c.fill();
    c.restore();
  }
  // Körper
  c.save();scallop(c,0,-60,41,44,24,.035);c.fillStyle=furW(c,0,-62,46);c.fill();c.lineWidth=2.2;c.strokeStyle=OUT;c.stroke();
  c.clip();c.fillStyle=furB(c,0,-96,52);ell(c,0,-98,54,21);c.fill();
  c.fillStyle='rgba(255,247,236,.75)';ell(c,0,-46,26,24);c.fill();
  c.fillStyle='rgba(200,185,215,.35)';ell(c,0,-26,30,8);c.fill();
  c.restore();
  // Schal/Kette
  drawScarf(c,O.scarf,t);
  const front=P.front;
  if(!front){drawArm(c,-33,-84,P.armL,P.armLen||40);drawHeldBehind(c,P,t);drawArm(c,33,-84,P.armR,P.armLen||40)}
  else if(P.frontL===false)drawArm(c,-33,-84,P.armL,P.armLen||40);
  // Kopf
  c.save();c.translate(0,-130+(P.headY||0));c.rotate(P.tilt||0);
  for(const s of [-1,1]){
    const w=s<0?(P.earL||0):(P.earR||0);
    c.save();c.translate(s*30,-28);c.rotate(w*s);
    c.fillStyle=furB(c,s*9,-9,19);circ(c,s*9,-9,17.5);c.fill();c.strokeStyle=OUT;c.lineWidth=2;c.stroke();
    c.fillStyle='#4d4759';circ(c,s*9,-8,8.5);c.fill();c.fillStyle='rgba(255,170,195,.35)';circ(c,s*9,-7,5);c.fill();
    c.restore();
  }
  scallop(c,0,0,56,47,30,.026,.3);c.fillStyle=furW(c,0,-2,56);c.fill();c.lineWidth=2.2;c.strokeStyle=OUT;c.stroke();
  // Haarbüschel
  c.fillStyle='#fff';c.strokeStyle=OUT;c.lineWidth=2;c.beginPath();c.moveTo(-9,-45);c.quadraticCurveTo(-6,-58,2,-55);c.quadraticCurveTo(-3,-52,0,-47);c.quadraticCurveTo(6,-56,12,-50);c.quadraticCurveTo(7,-49,7,-45);c.fill();c.stroke();
  // Augenflecken + Augen
  for(const s of [-1,1]){
    c.fillStyle=furB(c,s*22,0,20);ell(c,s*22,1,15.5,19.5,-s*.5);c.fill();
    drawPEye(c,s*21,-1,10,P,s);
  }
  const pf=P.puff||0;
  blush(c,-36,13,9+pf*5,.42+pf*.25);blush(c,36,13,9+pf*5,.42+pf*.25);
  if(pf>.05){c.fillStyle='rgba(255,255,255,.9)';for(const s of[-1,1]){ell(c,s*30,18,7+pf*6,6+pf*4);c.fill()}}
  if(P.brows){c.strokeStyle='#2a2532';c.lineWidth=3;c.lineCap='round';for(const s of[-1,1]){c.beginPath();c.moveTo(s*12,-26);c.lineTo(s*29,-20);c.stroke()}}
  // Nase
  c.fillStyle='#2a2532';c.beginPath();c.moveTo(-7.5,11);c.quadraticCurveTo(0,7.5,7.5,11);c.quadraticCurveTo(6,17.5,0,19);c.quadraticCurveTo(-6,17.5,-7.5,11);c.fill();
  c.fillStyle='rgba(255,255,255,.65)';ell(c,-2.2,11.3,2.4,1.2);c.fill();
  drawMouth(c,P);
  drawGlasses(c,O.glasses,t);
  drawHat(c,O.hat,t);
  c.restore();
  if(front){
    drawHeldFront(c,P,t);
    if(P.frontL!==false)drawArm(c,-33,-84,P.armL,P.armLen||40);
    drawArm(c,33,-84,P.armR,P.armLen||40);
    drawHeldTop(c,P,t);
  }
  c.restore();
}
function drawPEye(c,x,y,r,P,s){
  const m=P.eyes||'open',lc='#f4effb';
  if(m==='happy'){c.strokeStyle=lc;c.lineWidth=3.4;c.lineCap='round';c.beginPath();c.arc(x,y+4,r*.72,1.15*Math.PI,1.85*Math.PI);c.stroke();return}
  if(m==='closed'){c.strokeStyle=lc;c.lineWidth=3;c.lineCap='round';c.beginPath();c.arc(x,y-2,r*.72,.15*Math.PI,.85*Math.PI);c.stroke();return}
  if(m==='squint'){c.strokeStyle=lc;c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(x-s*6,y-5);c.lineTo(x+s*5,y);c.lineTo(x-s*6,y+5);c.stroke();return}
  const lx=(P.lookX||0)*r*.28,ly=(P.lookY||0)*r*.22,rr=m==='wide'?r*1.08:r;
  c.fillStyle='#f6f2fc';circ(c,x,y,r*1.16);c.fill();
  c.fillStyle=radial(c,x+lx,y+ly,rr,[[0,'#6b5a90'],[.45,'#2b2339'],[1,'#120e18']],0,.45);circ(c,x+lx,y+ly,rr);c.fill();
  c.fillStyle='rgba(140,200,255,.35)';ell(c,x+lx+r*.1,y+ly+r*.55,r*.5,r*.22);c.fill();
  c.fillStyle='#fff';circ(c,x+lx-r*.33,y+ly-r*.36,r*.38);c.fill();circ(c,x+lx+r*.36,y+ly+r*.28,r*.16);c.fill();
  const b=P.blink||0;
  if(b>0){c.save();circ(c,x,y,r*1.18);c.clip();c.fillStyle='#2c2835';c.fillRect(x-r*1.4,y-r*1.4,r*2.8,r*2.8*b);c.restore();
    if(b>.8){c.strokeStyle=lc;c.lineWidth=2.6;c.lineCap='round';c.beginPath();c.arc(x,y-2,r*.72,.15*Math.PI,.85*Math.PI);c.stroke()}}
  if(m==='sad'){c.save();circ(c,x,y,r*1.18);c.clip();c.fillStyle='#2c2835';c.beginPath();
    const ri=-r*(s>0?.15:.62),le=-r*(s>0?.62:.15);c.moveTo(x-r*1.4,y-r*1.4);c.lineTo(x+r*1.4,y-r*1.4);c.lineTo(x+r*1.4,y+ri);c.lineTo(x-r*1.4,y+le);c.fill();c.restore()}
}
function drawMouth(c,P){
  const m=P.mouth||'smile',ink='#2a2532';c.strokeStyle=ink;c.lineWidth=2.3;c.lineCap='round';c.lineJoin='round';
  const w=()=>{c.beginPath();c.moveTo(0,19);c.lineTo(0,21.5);c.stroke();c.beginPath();c.arc(-4.4,21.2,4.4,.1*Math.PI,.95*Math.PI);c.stroke();c.beginPath();c.arc(4.4,21.2,4.4,.05*Math.PI,.9*Math.PI);c.stroke()};
  switch(m){
    case 'open':{c.fillStyle='#b8365a';c.beginPath();c.moveTo(-9,21);c.quadraticCurveTo(0,38,9,21);c.quadraticCurveTo(0,24,-9,21);c.fill();c.fillStyle='#ff8fab';ell(c,0,29.5,5,3.2);c.fill();c.beginPath();c.moveTo(0,19);c.lineTo(0,21.5);c.stroke();break}
    case 'o':c.fillStyle='#7a2a48';ell(c,0,26,4.5,5.5);c.fill();c.beginPath();c.moveTo(0,19);c.lineTo(0,20.5);c.stroke();break;
    case 'pout':c.beginPath();c.arc(0,31,5.5,1.15*Math.PI,1.85*Math.PI);c.stroke();c.beginPath();c.moveTo(0,19);c.lineTo(0,23);c.stroke();break;
    case 'chew':{const k=P.chew||0;c.save();c.translate(0,21);c.scale(1+k*.15,1-k*.35);c.translate(0,-21);w();c.restore();break}
    case 'yawn':{const o=P.mo==null?1:P.mo;c.fillStyle='#8a2848';ell(c,0,27,8+o*3,3+o*9);c.fill();c.fillStyle='#ff8fab';ell(c,0,30+o*6,5+o*2,2+o*2.5);c.fill();break}
    case 'tongue':w();c.fillStyle='#ff7f9f';c.beginPath();c.ellipse(5,26,3.5,4.6,.3,0,TAU);c.fill();c.strokeStyle='rgba(150,40,70,.6)';c.lineWidth=1;c.stroke();break;
    case 'blow':c.fillStyle='#7a2a48';ell(c,0,25,3,3.4);c.fill();break;
    default:w();
  }
}
/* ---- Halten: Bambus / Pustestab / Wurfgegenstand ---- */
function drawBambooStick(c,x,y,len,ang,bite){
  c.save();c.translate(x,y);c.rotate(ang);
  c.fillStyle=lin(c,0,-5,0,5,[[0,'#b8ec8c'],[.5,'#6fc35b'],[1,'#3f8f3e']]);rrect(c,-len/2,-5,len-(bite||0),10,4);c.fill();
  c.strokeStyle='#3a7a3a';c.lineWidth=1.6;for(let i=-len/2+14;i<len/2-(bite||0);i+=16){c.beginPath();c.moveTo(i,-5);c.lineTo(i,5);c.stroke()}
  c.fillStyle='#8fdc76';c.beginPath();c.moveTo(-len/2+8,-4);c.quadraticCurveTo(-len/2-4,-20,-len/2-14,-18);c.quadraticCurveTo(-len/2-2,-10,-len/2+8,-4);c.fill();
  c.restore();
}
function drawHeldBehind(c,P,t){}
function drawHeldFront(c,P,t){
  if(P.hold==='bamboo'){drawBambooStick(c,0,-112,64,-.08,P.bite||0)}
}
function drawHeldTop(c,P,t){
  const h=P.hold;if(!h||h==='bamboo')return;
  const pp=pawPos(P,1);
  if(PT[h]&&PT[h].blow){
    const a=P.aim||-.6,dx=Math.cos(a),dy=Math.sin(a);
    const rx=pp.x+dx*24,ry=pp.y+dy*24-4;
    c.strokeStyle='#ff7fae';c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(pp.x,pp.y);c.lineTo(rx-dx*9,ry-dy*9);c.stroke();
    c.strokeStyle='#ff9cc3';c.lineWidth=3.5;circ(c,rx,ry,9);c.stroke();
    const g=P.grow||0;
    if(g>.02){const br=PT[h].r*(.35+g*.75);drawProj(c,h,rx+dx*br*.8,ry+dy*br*.8,br,t)}
    else{c.fillStyle='rgba(200,230,255,.35)';circ(c,rx,ry,7.5);c.fill()}
  }else{
    drawProj(c,h,pp.x,pp.y-6,PT[h].r*.95,t,P.t*2)
  }
}
/* ---- Projektile ---- */
function drawProj(c,k,x,y,r,t,rot){
  t=t||0;
  if(k==='bubble'||k==='giant'||k==='rainbow'){
    c.save();
    c.fillStyle=radial(c,x,y,r,[[0,'rgba(255,255,255,.04)'],[.65,'rgba(200,235,255,.12)'],[.88,'rgba(255,200,245,.32)'],[1,'rgba(170,215,255,.62)']],-.25,-.3);
    circ(c,x,y,r);c.fill();
    if(k==='rainbow'){const cols=['#ff6b8a','#ffb14a','#ffe45c','#7ee07a','#5cc8ff','#b58cff'];c.lineWidth=Math.max(1.5,r*.09);
      cols.forEach((col,i)=>{c.strokeStyle=col;c.globalAlpha=.75;c.beginPath();c.arc(x,y,r*(.92-i*.1),Math.PI*.95+t*2,Math.PI*1.95+t*2);c.stroke()});c.globalAlpha=1}
    c.strokeStyle=`hsla(${(t*90+x*.3)%360},95%,72%,.75)`;c.lineWidth=Math.max(1.2,r*.08);c.beginPath();c.arc(x,y,r*.94,Math.PI*.15,Math.PI*.85);c.stroke();
    c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=Math.max(1,r*.06);c.beginPath();c.arc(x,y,r,0,TAU);c.stroke();
    c.fillStyle='rgba(255,255,255,.9)';ell(c,x-r*.38,y-r*.42,r*.24,r*.14,-.7);c.fill();circ(c,x+r*.35,y+r*.38,r*.07);c.fill();
    c.restore();return;
  }
  if(k==='balloon'||k==='confetti'){
    c.save();c.translate(x,y);c.rotate(rot||0);
    const wob=Math.sin(t*14)*.06;c.scale(1+wob,1-wob);
    const body=k==='balloon'?[[0,'#d8f5ff'],[.45,'#6cc9f5'],[1,'#2a8fd6']]:[[0,'#ffe0ef'],[.45,'#ff8fc0'],[1,'#e2508f']];
    c.fillStyle=radial(c,0,0,r*1.15,body,-.35,-.4);
    c.beginPath();c.moveTo(0,-r);c.bezierCurveTo(r*1.05,-r,r*1.05,r*.75,0,r*1.02);c.bezierCurveTo(-r*1.05,r*.75,-r*1.05,-r,0,-r);c.fill();
    c.strokeStyle=k==='balloon'?'rgba(20,90,150,.45)':'rgba(160,30,90,.45)';c.lineWidth=1.4;c.stroke();
    c.fillStyle=k==='balloon'?'#2a8fd6':'#e2508f';c.beginPath();c.moveTo(-r*.22,r*1.18);c.lineTo(r*.22,r*1.18);c.lineTo(0,r*.98);c.fill();
    if(k==='confetti'){['#ffe45c','#7ee07a','#5cc8ff','#fff'].forEach((col,i)=>{c.fillStyle=col;circ(c,Math.cos(i*1.7+1)*r*.45,Math.sin(i*2.3)*r*.4,r*.12);c.fill()})}
    else{c.fillStyle='rgba(255,255,255,.35)';ell(c,r*.2,r*.35,r*.35,r*.18,.3);c.fill()}
    c.fillStyle='rgba(255,255,255,.9)';ell(c,-r*.38,-r*.42,r*.2,r*.13,-.7);c.fill();
    c.restore();return;
  }
  if(k==='ball'){
    c.save();c.translate(x,y);c.rotate(rot||0);
    const cols=['#ff5d6c','#ffffff','#ffd23f','#ffffff','#42b4ff','#ffffff'];
    for(let i=0;i<6;i++){c.fillStyle=cols[i];c.beginPath();c.moveTo(0,0);c.arc(0,0,r,i*TAU/6,(i+1)*TAU/6);c.closePath();c.fill()}
    c.fillStyle='#fff';circ(c,0,0,r*.24);c.fill();
    c.rotate(-(rot||0));
    c.fillStyle=radial(c,0,0,r,[[0,'rgba(255,255,255,.35)'],[.6,'rgba(255,255,255,0)'],[1,'rgba(40,20,60,.28)']],-.35,-.4);circ(c,0,0,r);c.fill();
    c.strokeStyle='rgba(60,40,80,.45)';c.lineWidth=1.4;circ(c,0,0,r);c.stroke();
    c.restore();
  }
}
/* =================== Outfits =================== */
function drawHat(c,id,t){
  if(!id)return;c.save();c.lineJoin='round';c.lineCap='round';
  switch(id){
    case 'zipfel':{c.fillStyle=lin(c,0,-90,0,-38,[[0,'#ff7a8a'],[1,'#d93352']]);c.beginPath();c.moveTo(-40,-36);c.quadraticCurveTo(-30,-80,6,-88);c.quadraticCurveTo(40,-92,52,-70+Math.sin(t*2)*2);c.quadraticCurveTo(32,-74,30,-36);c.closePath();c.fill();c.strokeStyle='rgba(120,20,40,.5)';c.lineWidth=2;c.stroke();
      c.fillStyle='#fff';rrect(c,-46,-44,92,16,8);c.fill();c.strokeStyle=OUT;c.stroke();scallop(c,52,-70+Math.sin(t*2)*2,9,9,9,.25);c.fill();c.stroke();break}
    case 'stroh':{c.fillStyle=lin(c,0,-70,0,-30,[[0,'#ffe9a6'],[1,'#e2b75a']]);ell(c,0,-38,66,13);c.fill();c.strokeStyle='rgba(140,100,30,.6)';c.lineWidth=2;c.stroke();
      c.beginPath();c.moveTo(-34,-40);c.quadraticCurveTo(-32,-76,0,-76);c.quadraticCurveTo(32,-76,34,-40);c.closePath();c.fill();c.stroke();
      c.fillStyle='#ff6f91';rrect(c,-34,-52,68,10,4);c.fill();c.fillStyle='#ffd23f';circ(c,24,-47,6);c.fill();c.fillStyle='#fff';circ(c,24,-47,2.5);c.fill();
      c.strokeStyle='rgba(160,115,40,.35)';c.lineWidth=1;for(let i=-55;i<60;i+=9){c.beginPath();c.moveTo(i,-44);c.lineTo(i+6,-32);c.stroke()}break}
    case 'krone':{c.fillStyle=lin(c,0,-80,0,-38,[[0,'#fff3a0'],[.5,'#ffd23f'],[1,'#e09a1a']]);c.beginPath();c.moveTo(-36,-38);c.lineTo(-40,-72);c.lineTo(-20,-56);c.lineTo(0,-82);c.lineTo(20,-56);c.lineTo(40,-72);c.lineTo(36,-38);c.closePath();c.fill();c.strokeStyle='#b07410';c.lineWidth=2;c.stroke();
      [[-40,-72,'#ff5d8f'],[0,-82,'#5cc8ff'],[40,-72,'#7ee07a']].forEach(([x,y,col])=>{c.fillStyle=col;circ(c,x,y,4.5);c.fill();c.fillStyle='#fff';circ(c,x-1.2,y-1.4,1.4);c.fill()});
      c.fillStyle='#ff5d8f';ell(c,0,-50,5,6);c.fill();c.fillStyle='rgba(255,255,255,.7)';c.fillRect(-30,-47,6,6);break}

/* ---- Physik ---- */
function spawnPoint(ang,k){const D=PT[k],ps=G.ps,dx=Math.cos(ang),dy=Math.sin(ang);
  if(D.blow){const d=24*ps+D.r*.95;return{x:G.px+14*ps+dx*d,y:G.py-112*ps+dy*d}}
  return{x:G.px+8*ps,y:G.py-210*ps}}
function projStep(p,dt){
  const D=PT[p.k];p.age+=dt;
  p.vy+=D.g*dt;if(D.wob)p.vy+=Math.cos(p.age*4.2)*D.wob*dt;
  const dr=Math.exp(-D.drag*dt);p.vx*=dr;p.vy*=dr;p.x+=p.vx*dt;p.y+=p.vy*dt;
  let ev=null;
  if(p.y+p.r>V.gy){
    if(D.bounce){p.y=V.gy-p.r;if(p.vy>70){p.vy*=-D.bounce;p.vx*=.92;ev='bounce'}else{p.vy=0;p.vx*=Math.exp(-1.6*dt);ev=ev||'roll'}}
    else return 'ground';
  }
  for(const o of G.obs){const cx=clamp(p.x,o.x,o.x+o.w),cy=clamp(p.y,o.y,o.y+o.h),dx=p.x-cx,dy=p.y-cy,d2=dx*dx+dy*dy;

      let d=Math.sqrt(d2),nx,ny;if(d<1e-3){nx=0;ny=-1;d=0}else{nx=dx/d;ny=dy/d}
      p.x=cx+nx*p.r;p.y=cy+ny*p.r;const vn=p.vx*nx+p.vy*ny;
      if(vn<0){if(ny<-.7&&Math.abs(vn)<70){p.vy=0;p.vx*=Math.exp(-1.6*dt);ev='roll'}else{p.vx-=(1+D.bounce)*vn*nx;p.vy-=(1+D.bounce)*vn*ny;ev='bounce'}}}}
  if(p.age>D.life)return 'life';
  if(p.x<-200||p.x>V.vw+200||p.y>V.vh+80)return 'out';
  return ev;
}
function simulate(k,ang,pow,maxT,cb){
  const D=PT[k],sp=D.vmin+pow*(D.vmax-D.vmin),o=spawnPoint(ang,k);
  const p={k,x:o.x,y:o.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:D.r,age:0},pts=[];
  for(let n=1;n*STEP<=maxT;n++){const ev=projStep(p,STEP);if(n%3===0)pts.push(p.x,p.y);if(cb&&cb(p))break;if(ev&&ev!=='roll'){pts.push(p.x,p.y);break}}
  return pts;
}
function throwProj(ang,pow){

  G.projs.push({k,x:o.x,y:o.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:D.r,age:0,hits:0,rot:0,acc:0,still:0,hitSet:new Set(),bsfx:0});

}
function endProj(p,why){

function hitTarget(T,p){
  if(T.hit)return;T.hit=true;T.ht=0;T.ev=0;const D=TT[T.type];T.fdir=1;
  const c=tCenter(T);

  const bubbly=p&&PT[p.k].blow&&D.light;

  if(T.react==='fall'||T.react==='topple'){const s=p?(Math.sign(p.vx)||1):1;
    if(T.react==='topple'){T.vx=s*rnd(90,220);T.vy=-rnd(160,300);T.vr=s*rnd(6,11)}else{T.vx=s*rnd(20,60);T.vy=-40;T.vr=s*rnd(1,3)}}

  const funny=['ladybug','bear','snowman','frog','duck','penguin','owl','hedgehog','snail','crab','can'].includes(T.type);

function motionPos(T,tt){
  const m=T.mv;if(!m)return{x:T.bx,y:T.by,dir:T.dir};const a=m.a,s=m.s;
  switch(m.m){
    case 'h':return{x:T.bx+Math.sin(tt*s)*a,y:T.by,dir:Math.cos(tt*s)>0?1:-1};
    case 'v':return{x:T.bx,y:T.by+Math.sin(tt*s*1.3)*a,dir:T.dir};
    case 'c':return{x:T.bx+Math.cos(tt*s)*a,y:T.by+Math.sin(tt*s)*a*.7,dir:-Math.sin(tt*s)>0?1:-1};
    case '8':return{x:T.bx+Math.sin(tt*s)*a,y:T.by+Math.sin(tt*s*2)*a*.4,dir:Math.cos(tt*s)>0?1:-1};
    case 'hop':return{x:T.bx+Math.sin(tt*s)*a,y:T.by-Math.abs(Math.sin(tt*s*5))*16,dir:Math.cos(tt*s)>0?1:-1};
  }

}
function centerAt(T,tt){const D=TT[T.type],q=motionPos(T,tt);return{x:q.x,y:q.y+(D.fly?0:(D.cy!=null?D.cy:-D.r))}}
function updateTargets(dt){
  for(const T of G.T){
    if(T.gone)continue;T.t+=dt;const D=TT[T.type];
    if(!T.hit){
      if(T.mv){const q=motionPos(T,T.t);T.x=q.x;T.y=q.y;T.dir=q.dir}
      continue;
    }
    T.ht+=dt;
    if(D.ev)while(T.ev<D.ev.length&&T.ht>=D.ev[T.ev][0]){try{D.ev[T.ev][1](T)}catch(e){}T.ev++}
    switch(T.react){
      case 'bub':T.y-=62*dt*Math.min(1,T.ht*2);T.x+=Math.sin(T.ht*2.2)*30*dt;T.rot=Math.sin(T.ht*3)*.15;if(T.y<-140)T.gone=true;break;
      case 'fly':if(T.ht>(D.delay||.4)){T.vy=Math.max(T.vy-300*dt,-240);T.vx+=(T.fdir*140-T.vx)*dt*1.5;T.dir=T.vx>0?1:-1;T.x+=T.vx*dt;T.y+=T.vy*dt+Math.sin(T.ht*8)*40*dt}
        if(T.y<-150||T.x<-150||T.x>V.vw+150)T.gone=true;break;
      case 'jump':if(T.ht>.25){if(!T.j){T.j=1;T.vx=T.fdir*rnd(170,240);T.vy=-rnd(560,660);T.dir=1}T.vy+=900*dt;T.x+=T.vx*dt;T.y+=T.vy*dt}

        const top=T.react==='topple',cy=top?-18:0,ext=top?18*Math.abs(Math.cos(T.rot))+14*Math.abs(Math.sin(T.rot)):T.r;
        const bot=T.y+cy+ext,sy=surfaceBelow(T.x,bot-Math.max(0,T.vy*dt)-1);
        if(bot>sy){T.y-=bot-sy;if(T.vy>140){T.vy*=-.35;T.vx*=.7;T.vr*=.6;if(!T.landed){T.landed=1;sfx(D.land||'clank')}}else{T.vy=0;T.vx*=Math.exp(-3*dt);
          if(top){const tgt=Math.round(T.rot/(Math.PI/2))*(Math.PI/2);T.rot+=(tgt-T.rot)*Math.min(1,dt*6);T.vr*=Math.exp(-6*dt)}else T.vr*=Math.exp(-4*dt)}}

  }
}
function updateProjs(dt){

      for(const T of G.T){

/* ---- Einfach-Modus: automatisch zielen ---- */
function solveAim(k,tx,ty){
  let best=null;const D=PT[k];
  for(let ai=0;ai<=40;ai++){const ang=-1.45+ai*.042;
    for(let pi=0;pi<=22;pi++){const pow=.06+pi*(.94/22);let md=1e9,mt=0;
      simulate(k,ang,pow,D.life,p=>{const d=Math.hypot(p.x-tx,p.y-ty);if(d<md){md=d;mt=p.age}return p.x>tx+90||d<5});
      const sc=md+pow*6+Math.abs(ang+.7)*4+mt*2;if(!best||sc<best.sc)best={ang,pow,sc,md,ft:mt}}}
  return best;
}
function aimAtTarget(T,k){
  let c=tCenter(T),sol=solveAim(k,c.x,c.y);
  if(T.mv&&sol){for(let it=0;it<2;it++){c=centerAt(T,T.t+sol.ft+.05);sol=solveAim(k,c.x,c.y)||sol}}
  return sol;
}
function easyThrow(wx,wy){
  let best=null,bd=150;
  for(const T of G.T)if(!T.hit){const c=tCenter(T),d=Math.hypot(c.x-wx,c.y-wy);if(d<bd){bd=d;best=T}}
  const sol=best?aimAtTarget(best,G.sel):solveAim(G.sel,wx,wy);if(!sol)return;
  const c=best?tCenter(best):{x:wx,y:wy};G.easyRing={x:c.x,y:c.y,t:0};throwProj(sol.ang,sol.pow);
}

let SCR='title';const CUR={w:0,conf:0,pushed:false,ignorePop:false};
function go(s){
  const prev=SCR;SCR=s;
  document.querySelectorAll('.scr').forEach(el=>el.classList.toggle('on',el.id==='s-'+s));
  $('#bBack').style.display=s==='title'?'none':'flex';
  if(s!=='play'){G.aim=null;$('#res').classList.remove('on');G.projs=[]}
  if(s!=='title'&&!CUR.pushed){try{history.pushState({pandi:1},'');CUR.pushed=true}catch(e){}}
  if(s==='title'&&CUR.pushed){CUR.pushed=false;CUR.ignorePop=true;try{history.back()}catch(e){}}
  if(s==='title'){setMusic(-1);ambInit(0);pdSet('idle');pdAct('hello');syncToggles()}
  if(s==='map'){setMusic(-1);buildMap();pdSet('idle');if(prev==='title')say('Wohin geht die Reise?')}
  if(s==='world'){setMusic(CUR.w);ambInit(CUR.w);buildWorld();pdSet('idle');if(prev==='map')say(WORLDS[CUR.w].say,true)}
  if(s==='dress'){buildDress();pdSet('idle');pdAct('hello')}

  if(s!=='play')PARTS.length=0;

/* ---------- Controller-Modus an/aus ---------- */

/* ---------- Haupt-Schleife ---------- */

  if (took) { hideRing(); rep.dir = ''; return; }

/* ---------- Menü-Navigation (DOM) ---------- */
var SEL = 'button,a[href],input:not([type=hidden]),select,textarea,summary,[role=button],[role=tab],[role=menuitem],[role=option],[role=switch],[role=checkbox],[role=radio],[role=link],[tabindex]:not([tabindex="-1"]),[data-pad]';

    var h = D.elementFromPoint(pts[i][0], pts[i][1]);

  }

}
function modalRoot(){
  if (typeof P.root === 'function') { var rr = P.root(); if (rr) return rr; }
  var ms = D.querySelectorAll('dialog[open],[aria-modal="true"],[role="dialog"],[role="alertdialog"]'), best = null;
  for (var i = 0; i < ms.length; i++){ var m = ms[i]; if (vis(m) && !m.closest('[hidden]')) best = m; }

}

      if (el.matches(BTN) && el.parentElement && el.parentElement.closest(BTN)) continue;
      if (!el.matches(BTN + ',input,select,textarea,summary') && el.querySelector(SEL)) continue;
    }

}
function inScroller(el){

}

  var best = null, ba = 0;
  list.forEach(function(c){ var r = c.r; if (r.bottom < 0 || r.top > innerHeight) return; var a = Math.min(r.width, innerWidth) * Math.min(r.height, innerHeight); if (c.el.matches('input,textarea,select')) a *= 0.3; if (a > ba) { ba = a; best = c.el; } });

}
function move(dx, dy){

  if (!fr) { focus(pickStart(list)); return; }
  var a = fr.r, ax = (a.left + a.right) / 2, ay = (a.top + a.bottom) / 2, best = null, bs = Infinity;

    if (c.el === f) return; var b = c.r, bx = (b.left + b.right) / 2, by = (b.top + b.bottom) / 2, main, side, ovl;

    } else {
      main = dy > 0 ? b.top - a.bottom : a.top - b.bottom; if ((dy > 0 ? by <= ay + 1 : by >= ay - 1)) return;

P.activate = activate;
var BACK_RE = /^(zur(ü|ue)ck|back|schlie(ß|ss)en|close|abbrechen|cancel|beenden|menü|menu|hauptmenü|home|×|✕|✖|x|←|‹|⟵|◀|<|‹ zurück|← zurück)$/i;

    var f = P.focused;
