<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Monster-Küche – Lewolux Kids</title>
<meta name="theme-color" content="#3b2a5e">
<style>
@font-face{font-family:F;src:url(fonts/fredoka-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--ink:#2b1d45;--lime:#8ee03a;--or:#ff9a1f;--pk:#ff5fa8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1d45;font-family:F,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
img{-webkit-user-drag:none;user-select:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#bgb{position:fixed;inset:-40px;background:url(assets/bg.webp?v=3) center/cover;filter:blur(18px) brightness(.7)}
#stage{position:absolute;left:50%;top:50%;transform-origin:0 0;overflow:hidden}
.scr{position:absolute;inset:0}
/* ---------- Küche ---------- */
#kbg{position:absolute;inset:0;background:url(assets/bg.webp?v=3) center 70%/cover}
#hud{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:14px;padding:12px 18px;z-index:30}
.rb{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 6px 0 #c9b8e6,0 10px 18px rgba(0,0,0,.25);display:grid;place-items:center;font-size:40px;flex:none;transition:transform .12s}
.rb:active{transform:translateY(4px) scale(.95);box-shadow:0 2px 0 #c9b8e6}
.coins{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:40px;padding:6px 18px 6px 8px;font-size:34px;box-shadow:0 5px 0 rgba(0,0,0,.18);flex:none}
.coin{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23a 40%,#e89b0c);box-shadow:inset 0 -4px 0 #c87a00,0 2px 0 #9a5d00;display:inline-grid;place-items:center;color:#b06a00;font-size:26px;flex:none}
.coin::before{content:"★"}
#guests{display:flex;gap:6px;margin-left:auto;background:rgba(255,255,255,.85);border-radius:40px;padding:6px 10px}
#guests i{width:54px;height:54px;border-radius:50%;background:#e9e0f7 center/88% no-repeat;display:block;position:relative;opacity:.55}
#guests i.now{opacity:1;box-shadow:0 0 0 4px var(--or)}
#guests i.done{opacity:1}
#guests i.done::after{content:"✔";position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:#3cc24a;color:#fff;font-size:18px;display:grid;place-items:center}
#guests i.star::after{content:"★";background:#ffb400}
/* Monster */
#mon{position:absolute;z-index:8;transform-origin:50% 100%;will-change:transform}
#mon img{display:block;height:100%;width:auto;margin:0 auto;transform-origin:50% 100%}
#mon .mi{height:100%;transform-origin:50% 100%;animation:breathe 1.6s ease-in-out infinite}
#mon.walk .mi{animation:hop .36s ease-in-out infinite}
#mon.eat .mi{animation:chomp .22s ease-in-out infinite}
#mon.yuck .mi{animation:shake .12s linear infinite}
#mon.happy .mi{animation:jump .5s ease-in-out infinite}
#mon.ice img{filter:hue-rotate(160deg) saturate(.6) brightness(1.25)}
#mon.ice .mi{animation:shiver .06s linear infinite}
#mon.hot img{filter:saturate(1.6) sepia(.4) hue-rotate(-30deg) brightness(1.05)}
#dish{position:absolute;z-index:3;pointer-events:none;transform-origin:50% 50%}
#dish .ings{position:absolute;left:0;right:0;bottom:46%;height:60%;}
#dish .ings img{position:absolute;bottom:0;width:42%;transition:transform .25s,opacity .25s}
#dish svg{position:absolute;left:0;bottom:0;width:100%;height:auto;display:block}
#dish .sp{transition:transform .4s;transform-origin:50% 100%}
#mon .crown{position:absolute;left:50%;top:-34px;font-size:46px;transform:translateX(-50%);animation:bob 1.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.08,.9)}55%{transform:translateY(-34px) scale(.95,1.06)}}
@keyframes chomp{50%{transform:scale(1.1,.88)}}
@keyframes shake{25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}
@keyframes jump{50%{transform:translateY(-40px) scale(1.04,.98)}}
@keyframes shiver{50%{transform:translateX(4px)}}
@keyframes bob{50%{transform:translate(-50%,-8px)}}
/* Sprechblase */
#bub{position:absolute;z-index:12;background:#fff;border-radius:34px;padding:16px 18px;display:flex;gap:10px;box-shadow:0 8px 0 rgba(0,0,0,.15),0 14px 30px rgba(0,0,0,.25);transform-origin:0 100%;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s}
#bub.off{transform:scale(0);opacity:0}
#bub::after{content:"";position:absolute;left:18px;bottom:-26px;border:16px solid transparent;border-top:22px solid #fff;border-right-width:6px}
#bub .o{width:96px;height:96px;position:relative;display:grid;place-items:center;border-radius:22px;background:#f4eefc}
#bub .o img{width:88px;height:88px;object-fit:contain}
#bub .o.ok{background:#d7f7c9}
#bub .o.ok::after{content:"✔";position:absolute;right:-8px;top:-8px;width:36px;height:36px;border-radius:50%;background:#3cc24a;color:#fff;font-size:24px;display:grid;place-items:center;animation:pop .3s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
/* Topf */
#potw{position:absolute;z-index:10}
#pot{width:100%;display:block;animation:potIdle 2.4s ease-in-out infinite;transform-origin:50% 100%}
#pot.wob{animation:potWob .25s ease-in-out 3}
@keyframes potIdle{50%{transform:scale(1.015,.99)}}
@keyframes potWob{25%{transform:rotate(-3deg) scale(1.05,.95)}75%{transform:rotate(3deg) scale(1.05,.95)}}
#soup{position:absolute;left:16%;right:16%;top:13%;height:16%;border-radius:50%;mix-blend-mode:color;opacity:0;transition:opacity .4s,background .6s;pointer-events:none}
#potIn{position:absolute;left:20%;right:20%;top:12%;height:16%;pointer-events:none;z-index:1}
#potIn img{position:absolute;width:50px;height:50px;animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(12deg)}}
#spoon{position:absolute;z-index:14;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#fff 60%,#ffe9b8);box-shadow:0 7px 0 #e0a640,0 12px 22px rgba(0,0,0,.3);display:grid;place-items:center;transition:transform .2s,opacity .2s}
#spoon.off{transform:scale(0);opacity:0;pointer-events:none}
#spoon.go{animation:pulse 1s ease-in-out infinite}
#spoon svg{width:110px;height:110px}
@keyframes pulse{50%{transform:scale(1.12) rotate(-8deg)}}
#dump{position:absolute;z-index:14;width:78px;height:78px;border-radius:50%;background:#fff;box-shadow:0 5px 0 #c9b8e6;display:grid;place-items:center;font-size:40px;transition:transform .2s,opacity .2s}
#dump.off{transform:scale(0);opacity:0;pointer-events:none}
#stirC{position:absolute;left:18%;width:64%;top:-75%;height:102%;overflow:hidden;pointer-events:none;z-index:3}
#stirS{position:absolute;left:50%;bottom:-20%;width:26%;margin-left:-13%;opacity:0;transform-origin:50% 100%}
#stirS svg{display:block;width:100%;height:auto}
#stirS.on{opacity:1;animation:stirL 1s ease-in-out infinite}
#ripple{position:absolute;left:50%;top:22.5%;width:26%;height:9%;margin-left:-13%;border:4px solid rgba(255,255,255,.75);border-radius:50%;opacity:0;pointer-events:none;z-index:2}
#ripple.on{opacity:1;animation:stirL 1s ease-in-out infinite,rip .25s ease-in-out infinite alternate}
@keyframes stirL{0%,100%{left:28%;transform:rotate(-10deg)}50%{left:72%;transform:rotate(10deg)}}
@keyframes rip{to{transform:scale(1.25,1.15)}}
#soup.sw{opacity:.75!important;animation:swirl .5s ease-in-out infinite}
@keyframes swirl{50%{transform:scale(1.08,.85) rotate(4deg)}}
/* Koch */
#chef{position:absolute;z-index:9;transform-origin:50% 100%}
#chef .ci{position:relative;height:100%;transform-origin:50% 100%;animation:breathe 2s ease-in-out infinite}
#chef .ci>img:first-child{height:100%;display:block}
#chef .hat,#chef2 .hat{height:auto}
#chef.talk .ci{animation:talk .3s ease-in-out infinite}
#chef .hat,#chef2 .hat{position:absolute;width:50%;left:var(--hx,25%);bottom:var(--hy,83%);transform:rotate(var(--hr,-6deg));transform-origin:50% 100%;z-index:2}
@keyframes talk{50%{transform:scale(1.02,.98) translateY(-4px)}}
#chef.fx-tiny .ci{transform:scale(.45)!important}
#chef.fx-giant .ci{transform:scale(1.3)!important}
#chef .ci{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
#chef.fx-rocket{animation:rocket 3s ease-in-out}
@keyframes rocket{0%{transform:none}20%{transform:translateY(40px) scale(1.1,.85)}55%{transform:translateY(-700px) rotate(360deg)}75%{transform:translateY(-700px)}100%{transform:none}}
#chef.fx-sugar .ci{animation:sugar .08s linear infinite!important}
@keyframes sugar{25%{transform:translate(-10px,-6px) rotate(-6deg)}75%{transform:translate(10px,-6px) rotate(6deg)}}
#chef.fx-sugar img,#chef.fx-rainbow img{animation:rainbow 1s linear infinite}
@keyframes rainbow{to{filter:hue-rotate(360deg) saturate(1.6)}}
#chef.fx-stink img{filter:sepia(1) hue-rotate(50deg) saturate(2.5) brightness(.9)}
#chef.fx-ice img{filter:hue-rotate(150deg) saturate(.5) brightness(1.3)}
#chef .iceb{position:absolute;inset:-6% -10%;border-radius:30px;background:linear-gradient(135deg,rgba(220,250,255,.75),rgba(140,210,255,.45));box-shadow:inset 0 0 0 6px rgba(255,255,255,.8),0 0 30px #9fe6ff;z-index:3;animation:pop .4s}
#chef.fx-steam img{filter:brightness(1.2) saturate(1.4) hue-rotate(-20deg)}
/* Regal */
#shelf{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px;padding:12px 16px calc(12px + var(--sb));background:linear-gradient(#a0653a,#7a4626);border-top:8px solid #c9894f;box-shadow:0 -6px 18px rgba(0,0,0,.3)}
.ing{width:104px;height:104px;border-radius:24px;background:radial-gradient(circle at 50% 40%,#fff,#f1e5d6);box-shadow:0 6px 0 #5a3018,0 9px 14px rgba(0,0,0,.3);display:grid;place-items:center;position:relative;transition:transform .1s}
.ing img{width:90px;height:90px;object-fit:contain;transition:transform .15s}
.ing:active{transform:translateY(5px);box-shadow:0 1px 0 #5a3018}
.ing.new::before{content:"NEU";position:absolute;top:-10px;right:-10px;background:var(--pk);color:#fff;font-size:16px;padding:3px 8px;border-radius:12px;z-index:2;animation:bob2 1s ease-in-out infinite}
.ing.hint img{animation:wig .6s ease-in-out infinite}
@keyframes wig{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
@keyframes bob2{50%{transform:translateY(-5px)}}
/* Partikel */
.pt{position:fixed;left:0;top:0;pointer-events:none;z-index:100;font-size:44px;line-height:1;will-change:transform,opacity}
.fly{position:fixed;left:0;top:0;pointer-events:none;z-index:90;will-change:transform}
/* ---------- Titel ---------- */
#title{background:url(assets/title.webp?v=3) center/cover}
#title .logo{position:absolute;left:50%;top:calc(20px + var(--st));transform:translateX(-50%);font-size:92px;color:#fff;text-align:center;line-height:.9;letter-spacing:1px;-webkit-text-stroke:4px #3b1f6b;paint-order:stroke fill;text-shadow:0 8px 0 #3b1f6b,0 14px 24px rgba(0,0,0,.4);white-space:nowrap;animation:logo 2.6s ease-in-out infinite}
#title .logo span{color:var(--lime)}
.pbr{display:none}.port .pbr{display:inline}
.port #title .logo{top:calc(110px + var(--st));font-size:100px;line-height:.95}
.port #tmenu{gap:18px}.port .big.play{order:-1;margin:0 calc(50% - 105px)}
@keyframes logo{50%{transform:translateX(-50%) rotate(-2deg) scale(1.03)}}
#tmenu{position:absolute;left:0;right:0;bottom:calc(26px + var(--sb));display:flex;justify-content:center;align-items:flex-end;gap:22px;flex-wrap:wrap;padding:0 16px}
.big{width:150px;height:150px;border-radius:40px;background:#fff;box-shadow:0 9px 0 #b39ddb,0 14px 26px rgba(0,0,0,.35);display:grid;place-items:center;position:relative;transition:transform .12s}
.big:active{transform:translateY(6px);box-shadow:0 3px 0 #b39ddb}
.big img{width:116px;height:116px;object-fit:contain}
.big .em{font-size:84px}
.big.play{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c4ff7a,#6fcf1f);box-shadow:0 10px 0 #3f8a0c,0 16px 30px rgba(0,0,0,.4);animation:pulse2 1.4s ease-in-out infinite}
.big.play svg{width:110px;height:110px;margin-left:14px}
@keyframes pulse2{50%{transform:scale(1.06)}}
.badge{position:absolute;top:-10px;right:-10px;min-width:44px;height:44px;border-radius:22px;background:var(--pk);color:#fff;font-size:24px;display:grid;place-items:center;padding:0 8px;box-shadow:0 3px 0 #b02a6c}
#ttop{position:absolute;left:0;right:0;top:calc(14px + var(--st));display:flex;justify-content:space-between;padding:0 18px;z-index:3}
#ttop .r{display:flex;gap:12px}
#gift{position:absolute;z-index:4;width:150px;height:150px;animation:giftW 1.2s ease-in-out infinite}
#gift .em{font-size:110px;display:block;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
@keyframes giftW{0%,100%{transform:rotate(0)}10%{transform:rotate(-10deg) scale(1.08)}20%{transform:rotate(10deg) scale(1.08)}30%{transform:rotate(0)}}
#motd{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.9);border-radius:30px;padding:10px 14px 8px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
#motd img{height:120px}
#motd b{font-size:22px;display:flex;align-items:center;gap:6px}
/* ---------- Album/Laden/Buch ---------- */
.panel{position:absolute;inset:0;background:linear-gradient(#5b3d8f,#3b2a5e);display:flex;flex-direction:column}
.ptop{display:flex;align-items:center;gap:14px;padding:calc(12px + var(--st)) 18px 10px}
.ptop h2{margin:0;font-size:48px;color:#fff;display:flex;align-items:center;gap:12px;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.ptop h2 .em{font-size:52px}
.grid{flex:1;overflow:auto;display:grid;gap:16px;padding:10px 18px calc(18px + var(--sb));align-content:start;scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.card{background:#fff;border-radius:28px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 7px 0 rgba(0,0,0,.22);position:relative;transition:transform .12s}
.card:active{transform:scale(.96)}
.card .pic{height:170px;display:flex;align-items:flex-end;justify-content:center}
.card .pic img{max-height:170px;max-width:100%}
.card.lock .pic img{filter:brightness(0) opacity(.35)}
.card .fav{display:flex;align-items:center;gap:6px;background:#ffe6f1;border-radius:20px;padding:4px 10px;font-size:30px;min-height:56px}
.card .fav img{width:48px;height:48px}
.card .fav .q{font-size:36px;color:#c06;width:48px;text-align:center}
.card .cnt{display:flex;gap:3px}
.card .cnt i{width:16px;height:16px;border-radius:50%;background:#e4dcef}
.card .cnt i.on{background:var(--or)}
.card.sel{box-shadow:0 0 0 6px var(--lime),0 7px 0 rgba(0,0,0,.22)}
.price{display:flex;align-items:center;gap:6px;font-size:30px}
.price .coin{width:36px;height:36px;font-size:20px}
.card .own{font-size:40px;color:#3cc24a}
.card.poor{opacity:.6}
#album .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
#shop .grid,#book .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
#shopL{display:flex;flex:1;min-height:0}
#shopChef{width:34%;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:30px}
#shopChef #chef2{position:relative;height:420px}
.port #shopL{flex-direction:column-reverse}.port #shopChef{width:100%;flex:1;padding-bottom:30px}.port #shopChef #chef2{height:500px}.port #shop .grid{flex:none!important}
.rcp{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;min-height:70px}
.rcp img{width:56px;height:56px}
.rcp .pl{font-size:28px;color:#8a7aa8}
.rcp .q{width:56px;height:56px;border-radius:16px;background:#ece5f6;display:grid;place-items:center;font-size:30px;color:#a493c4}
.card .rfx{font-size:70px;height:90px;display:grid;place-items:center}
.card.lock .rfx{filter:grayscale(1) opacity(.3)}
/* ---------- Overlay ---------- */
#ov{position:absolute;inset:0;z-index:60;background:rgba(30,15,60,.6);display:grid;place-items:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.box{background:#fff;border-radius:44px;padding:28px 34px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 12px 0 #b39ddb,0 20px 50px rgba(0,0,0,.4);animation:boxIn .45s cubic-bezier(.3,1.6,.5,1);max-width:92%}
@keyframes boxIn{from{transform:scale(.3)}}
.stars{display:flex;gap:12px}
.stars i{font-style:normal;font-size:110px;color:#e4dcef;line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.12)}
.stars i.on{color:#ffc21a;animation:starIn .5s cubic-bezier(.3,1.8,.5,1) both;text-shadow:0 6px 0 #d48a00}
@keyframes starIn{from{transform:scale(0) rotate(-180deg)}}
.row{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.got{display:flex;align-items:center;gap:10px;font-size:52px}
.newi{display:flex;flex-direction:column;align-items:center;background:#fff4d6;border-radius:26px;padding:10px 16px;position:relative}
.newi img{height:110px;animation:wig 1s ease-in-out infinite}
.newi.mon img{height:150px;filter:brightness(0) opacity(.5);animation:bob2 1s ease-in-out infinite}
.newi::before{content:"NEU";position:absolute;top:-12px;background:var(--pk);color:#fff;font-size:20px;padding:3px 10px;border-radius:12px}
.go{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c4ff7a,#6fcf1f);box-shadow:0 8px 0 #3f8a0c;display:grid;place-items:center}
.go svg{width:62px;height:62px;margin-left:8px}
.go:active{transform:translateY(5px);box-shadow:0 3px 0 #3f8a0c}
#flash{position:absolute;inset:0;z-index:55;pointer-events:none;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);opacity:0}
#flash.on{animation:flash .7s}
@keyframes flash{30%{opacity:.9}}
#rtitle{position:absolute;left:50%;top:22%;z-index:56;transform:translateX(-50%);font-size:72px;color:#fff;-webkit-text-stroke:4px #5b2a8f;paint-order:stroke fill;text-shadow:0 6px 0 #5b2a8f;white-space:nowrap;pointer-events:none;animation:rt 2.6s ease both}
@keyframes rt{0%{transform:translateX(-50%) scale(0)}15%{transform:translateX(-50%) scale(1.15)}25%,80%{transform:translateX(-50%) scale(1)}100%{transform:translateX(-50%) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="bgb"></div>
<div id="stage">
  <!-- Titel -->
  <section id="title" class="scr">
    <div class="logo">Monster-<br class="pbr"><span>Küche</span></div>
    <div id="ttop"><span class="coins"><span class="coin"></span><b class="cv">0</b></span><span class="r"><button class="rb snd" data-say="Ton" aria-label="Ton">🔊</button></span></div>
    <button id="gift" hidden data-say="Geschenk" aria-label="Geschenk"><span class="em">🎁</span></button>
    <div id="motd" hidden><b><span>👑</span><span class="coin" style="width:30px;height:30px;font-size:16px"></span><span>×2</span></b><img alt=""></div>
    <div id="tmenu">
      <button class="big" id="bAlbum" data-say="Monster-Album" aria-label="Monster-Album"><img src="assets/m1_1.webp?v=3" alt=""><span class="badge" hidden id="albN"></span></button>
      <button class="big" id="bShop" data-say="Mützen-Laden" aria-label="Mützen-Laden"><img src="assets/hat_1.webp?v=3" alt=""></button>

/* ---------- Controller-Modus an/aus ---------- */

}

var probe = setInterval(function(){ var l = pads(); for (var i = 0; i < (l ? l.length : 0); i++) if (l[i]) { if (!seen) { seen = true; start(); } return; } }, 1000);

/* ---------- Haupt-Schleife ---------- */

  if (took) { hideRing(); rep.dir = ''; return; }

/* ---------- Menü-Navigation (DOM) ---------- */
var SEL = 'button,a[href],input:not([type=hidden]),select,textarea,summary,[role=button],[role=tab],[role=menuitem],[role=option],[role=switch],[role=checkbox],[role=radio],[role=link],[tabindex]:not([tabindex="-1"]),[data-pad]';

  for (var i = 0; i < pts.length; i++){
    var h = D.elementFromPoint(pts[i][0], pts[i][1]);
    if (h && (h === el || el.contains(h) || (h.contains(el) && h !== D.body && h !== html) || h === ring)) return true;
  }
  return false;
}
function modalRoot(){
  if (typeof P.root === 'function') { var rr = P.root(); if (rr) return rr; }
  var ms = D.querySelectorAll('dialog[open],[aria-modal="true"],[role="dialog"],[role="alertdialog"]'), best = null;
  for (var i = 0; i < ms.length; i++){ var m = ms[i]; if (vis(m) && !m.closest('[hidden]')) best = m; }
  return best;
}
function candidates(){
  var root = modalRoot(), scope = root || D, out = [], els = scope.querySelectorAll(SEL);
  for (var i = 0; i < els.length; i++){

    if (!el.hasAttribute('data-pad')) {

      if (el.matches(BTN) && el.parentElement && el.parentElement.closest(BTN)) continue;
      if (!el.matches(BTN + ',input,select,textarea,summary') && el.querySelector(SEL)) continue;
    }

    out.push({ el:el, r:r });
  }

}
function inScroller(el){
  for (var p = el.parentElement; p && p !== D.body; p = p.parentElement){
    var cs = getComputedStyle(p);
    if (/(auto|scroll)/.test(cs.overflowY + cs.overflowX) && (p.scrollHeight > p.clientHeight + 2 || p.scrollWidth > p.clientWidth + 2)) return true;

}
function pickStart(list){

  var act = D.activeElement; if (act && act !== D.body) for (var i = 0; i < list.length; i++) if (list[i].el === act) return act;
  // größtes sichtbares Bedienelement (meist „Spielen“/„Los geht’s“)
  var best = null, ba = 0;
  list.forEach(function(c){ var r = c.r; if (r.bottom < 0 || r.top > innerHeight) return; var a = Math.min(r.width, innerWidth) * Math.min(r.height, innerHeight); if (c.el.matches('input,textarea,select')) a *= 0.3; if (a > ba) { ba = a; best = c.el; } });
  return best || (list[0] && list[0].el);
}
function move(dx, dy){
  var list = candidates(); if (!list.length) return;
  var f = P.focused, fr = f && list.filter(function(c){ return c.el === f; })[0];
  if (!fr) { focus(pickStart(list)); return; }
  var a = fr.r, ax = (a.left + a.right) / 2, ay = (a.top + a.bottom) / 2, best = null, bs = Infinity;

    } else {
      main = dy > 0 ? b.top - a.bottom : a.top - b.bottom; if ((dy > 0 ? by <= ay + 1 : by >= ay - 1)) return;

P.activate = activate;
var BACK_RE = /^(zur(ü|ue)ck|back|schlie(ß|ss)en|close|abbrechen|cancel|beenden|menü|menu|hauptmenü|home|×|✕|✖|x|←|‹|⟵|◀|<|‹ zurück|← zurück)$/i;

function key(k, code, kc){
  var t = D.activeElement && D.activeElement !== D.body ? D.activeElement : D;

function back(){
