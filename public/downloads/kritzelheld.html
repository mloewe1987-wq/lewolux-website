const toHub = () => go({ name: 'hub' });
const replay = (id) => () => go({ name: 'game', game: id });
const setBody = (html) => { const gb = $('#gb'); if (gb) gb.innerHTML = html; return gb; };
const owlSays = (text, cheer = false) => `<div class="speech">${owl(profile(), 56, cheer)}<div class="bubble">${text}</div></div>`;

/* ---------------------- Zählen ---------------------- */
const COUNT_ITEMS = ['🍎', '🐞', '⭐', '🐟', '🌸', '🍓', '🎈', '🐤', '🍌', '🦋'];
function startCount() {
  G = { round: 0, rounds: 8, perfect: 0, miss: false, busy: false };
  gameShell('Zählen', '');
  nextCount();
}
function nextCount() {
  if (!G) return;
  if (G.round >= G.rounds) {
    const earned = award(G.perfect * 3 + (G.perfect === G.rounds ? 4 : 0));
    const stars = G.perfect >= 8 ? 3 : G.perfect >= 6 ? 2 : 1;
    return showResult({ title: 'Toll gezählt!', sub: `${G.perfect} von ${G.rounds} gleich richtig`, stars, earned, onAgain: replay('count'), onBack: toHub });
  }
  G.round++;
  G.miss = false;
  G.busy = false;
  const n = 1 + rnd(G.round > 4 ? 20 : 10);
  const icon = COUNT_ITEMS[rnd(COUNT_ITEMS.length)];
  const cells = shuffle([...Array(25).keys()]).slice(0, n);
  const opts = new Set([n]);
  while (opts.size < 3) { const d = n + (rnd(2) ? 1 : -1) * (1 + rnd(3)); if (d >= 1 && d <= 20) opts.add(d); }
  G.n = n;
  setBody(`<div class="hud"><span>Runde ${G.round}/${G.rounds}</span><span>✔ ${G.perfect}</span></div>
    ${owlSays('Wie viele siehst du?')}
    <div class="field">${[...Array(25).keys()].map((i) => `<span style="transform:rotate(${rnd(30) - 15}deg) translate(${rnd(12) - 6}px,${rnd(12) - 6}px)">${cells.includes(i) ? icon : ''}</span>`).join('')}</div>
    <div class="answers">${shuffle([...opts]).map((v, i) => `<button class="big ans" data-v="${v}" style="--c:${['var(--blue)', 'var(--lilac)', 'var(--orange)'][i]}">${v}</button>`).join('')}</div>`);
  $app.querySelectorAll('.ans').forEach((b) => (b.onclick = () => {
    if (!G || G.busy) return;
    if (+b.dataset.v === G.n) {
      G.busy = true;
      if (!G.miss) G.perfect++;
      b.style.setProperty('--c', 'var(--meadow)');
      $('.bubble').textContent = G.miss ? 'Jetzt stimmt es!' : 'Richtig!';
      buzz('tap');
      later(nextCount, 750);
    } else {
      G.miss = true;
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      $('.bubble').textContent = 'Zähl nochmal ganz genau!';
      buzz('error');
    }
  }));
}

/* ---------------------- Buchstaben-Suche ---------------------- */
const CONFUSE = ['EFLTH', 'BPRD', 'MNWV', 'OQCGD', 'ILTJ', 'KXYV', 'SZ', 'AHV', 'UVJ'];
function startFind() {
  G = { round: 0, rounds: 6, score: 0, mistakes: 0, roundMiss: 0 };
  gameShell('Buchstaben-Suche', '');
  nextFind();
}
function nextFind() {
  if (!G) return;
  if (G.round >= G.rounds) {
    const earned = award(G.score + (G.mistakes === 0 ? 2 : 0));
    const stars = G.mistakes === 0 ? 3 : G.mistakes <= 3 ? 2 : 1;
    return showResult({ title: 'Alle gefunden!', sub: G.mistakes ? `${G.mistakes}× daneben getippt` : 'Ohne einen Fehler!', stars, earned, onAgain: replay('find'), onBack: toHub });
  }
  G.round++;
  G.roundMiss = 0;
  const ABC = 'ABCDEFGHIJKLMNOPRSTUVWXYZ';
  const target = ABC[rnd(ABC.length)];
  const group = (CONFUSE.find((g) => g.includes(target)) || '').replace(target, '');
  const k = 3 + rnd(2);
  const letters = Array(k).fill(target);
  while (letters.length < 16) {
    const pool = group && Math.random() < 0.6 ? group : ABC.replace(target, '');
    letters.push(pool[rnd(pool.length)]);
  }
  shuffle(letters);
  G.left = k;
  setBody(`<div class="hud"><span>Runde ${G.round}/${G.rounds}</span><span>Noch ${k}</span></div>
    <div class="target">Finde alle <b>${target}</b></div>
    <div class="bubbles">${letters.map((l) => `<button class="bub" data-l="${l}">${l}</button>`).join('')}</div>`);
  $app.querySelectorAll('.bub').forEach((b) => (b.onclick = () => {
    if (!G || b.classList.contains('found')) return;
    if (b.dataset.l === target) {
      b.classList.add('found');
      G.left--;
      buzz('tap');
      $('.hud span:last-child').textContent = G.left ? `Noch ${G.left}` : 'Super!';
      if (!G.left) { G.score += G.roundMiss ? 1 : 3; later(nextFind, 700); }
    } else {
      G.mistakes++; G.roundMiss++;
      b.classList.add('wrong', 'shake');
      buzz('error');
      later(() => b.classList.remove('wrong', 'shake'), 450);
    }
  }));
}

/* ---------------------- Memory ---------------------- */
const DICE = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const diceHtml = (n) => `<span class="dice">${[...Array(9).keys()].map((i) => (DICE[n].includes(i) ? '<i></i>' : '<span></span>')).join('')}</span>`;
const ANIMALS = ['🦊', '🐻', '🐸', '🐧', '🦁', '🐙', '🐢', '🦋', '🐰', '🐯', '🐼', '🦄'];
function startMemory(kind) {
  const cards = [];
  if (kind === 'numbers') {
    shuffle([1, 2, 3, 4, 5, 6]).forEach((v) => { cards.push({ pair: v, face: String(v) }); cards.push({ pair: v, face: diceHtml(v) }); });
  } else {
    shuffle(ANIMALS.slice()).slice(0, 6).forEach((a) => { cards.push({ pair: a, face: a }); cards.push({ pair: a, face: a }); });
  }
  shuffle(cards);
  G = { kind, cards, open: [], done: 0, moves: 0, lock: false };
  const title = kind === 'numbers' ? 'Zahlen-Memory' : 'Tier-Memory';
  gameShell(title, `<div class="hud"><span id="moves">Züge: 0</span><span>Paare: <span id="pairs">0</span>/6</span></div>
    ${owlSays(kind === 'numbers' ? 'Finde die Zahl und die passenden Punkte!' : 'Finde die gleichen Tiere!')}
    <div class="mem">${cards.map((c, i) => `<button class="mcard" data-i="${i}" aria-label="Karte ${i + 1}"><span class="f back">?</span><span class="f front">${c.face}</span></button>`).join('')}</div>`);
  $app.querySelectorAll('.mcard').forEach((b) => (b.onclick = () => flipMemory(b)));
}
function flipMemory(b) {
  if (!G || G.lock || b.classList.contains('open') || b.classList.contains('done')) return;
  b.classList.add('open');
  G.open.push(b);
  if (G.open.length < 2) return;
  G.moves++;
  $('#moves').textContent = `Züge: ${G.moves}`;
  const [a, c] = G.open;
  if (G.cards[a.dataset.i].pair === G.cards[c.dataset.i].pair) {
    a.classList.add('done'); c.classList.add('done');
    G.open = [];
    G.done++;
    $('#pairs').textContent = G.done;
    buzz('tap');
    if (G.done === 6) {
      const learn = G.kind === 'numbers';
      if (G.moves <= 8) bumpStat('memFast');
      const earned = award((learn ? 15 : 8) + (G.moves <= 9 ? (learn ? 5 : 4) : 0));
      const stars = G.moves <= 8 ? 3 : G.moves <= 12 ? 2 : 1;
      const id = learn ? 'numMemory' : 'animalMemory';
      later(() => showResult({ title: 'Alle Paare!', sub: `Geschafft in ${G.moves} Zügen`, stars, earned, onAgain: replay(id), onBack: toHub }), 500);
    }
  } else {
    G.lock = true;
    later(() => { a.classList.remove('open'); c.classList.remove('open'); G.open = []; G.lock = false; }, 850);
  }
}

/* ---------------------- Schnick Schnack Schnuck ---------------------- */
const HANDS = { stein: { e: '✊', n: 'Stein' }, papier: { e: '✋', n: 'Papier' }, schere: { e: '✌️', n: 'Schere' } };
const BEATS = { stein: 'schere', schere: 'papier', papier: 'stein' }; // Schlüssel schlägt Wert
const winnerOver = (x) => Object.keys(BEATS).find((k) => BEATS[k] === x);
const randomHand = () => Object.keys(HANDS)[rnd(3)];
const picksHtml = () => `<div class="picks">${Object.keys(HANDS).map((k) => `<button class="pick" data-h="${k}"><b>${HANDS[k].e}</b>${HANDS[k].n}</button>`).join('')}</div>`;

function startRps() {
  G = { mode: 'menu' };
  gameShell('Schnick Schnack Schnuck', `<div class="intro">
    ${owl(profile(), 110)}
    <div class="rules">✊ Stein schlägt ✌️ Schere<br>✌️ Schere schlägt ✋ Papier<br>✋ Papier schlägt ✊ Stein</div>
    <div class="modes">
      <button class="big" id="m1" style="--c:var(--lilac)">Gegen die Eule</button>
      <button class="big" id="m2" style="--c:var(--orange)">Gegenteil-Blitz</button>
    </div>
  </div>`);
  $('#m1').onclick = rpsClassic;
  $('#m2').onclick = rpsBlitzIntro;
}

function rpsClassic() {
  G = { mode: 'classic', you: 0, owl: 0, busy: false };
  setBody(`<div class="score"><span>Du ${G.you}</span>:<span>${G.owl} Eule</span></div>
    <div class="rps-owl">${owl(profile(), 90)}<div class="hand" id="oh">❔</div></div>
    <div class="msg" id="msg">Wer zuerst 3 Runden gewinnt!</div>
    <div class="hand" id="yh" style="background:transparent">🙂</div>
    ${picksHtml()}`);
  $app.querySelectorAll('.pick').forEach((b) => (b.onclick = () => rpsPlay(b.dataset.h)));
}
function rpsPlay(me) {
  if (!G || G.busy) return;
  G.busy = true;
  const oh = $('#oh'), msg = $('#msg');
  $('#yh').textContent = HANDS[me].e;
  const words = ['Schnick…', 'Schnack…', 'Schnuck!'];
  words.forEach((w, i) => later(() => {
    oh.textContent = '✊';
    oh.classList.remove('shake'); void oh.offsetWidth; oh.classList.add('shake');
    msg.textContent = w;
  }, i * 420));
  later(() => {
    const o = randomHand();
    oh.textContent = HANDS[o].e;
    if (o === me) msg.textContent = 'Unentschieden!';
    else if (BEATS[me] === o) { G.you++; msg.textContent = `${HANDS[me].n} schlägt ${HANDS[o].n} – Punkt für dich!`; buzz('tap'); }
    else { G.owl++; msg.textContent = `${HANDS[o].n} schlägt ${HANDS[me].n} – Punkt für die Eule!`; }
    $('.score').innerHTML = `<span>Du ${G.you}</span>:<span>${G.owl} Eule</span>`;
    if (G.you === 3 || G.owl === 3) {
      const won = G.you === 3;
      if (won) bumpStat('rpsWin');
    const earned = award(won ? 10 : 3);
      later(() => showResult({
        title: won ? 'Du hast gewonnen!' : 'Die Eule gewinnt!',
        sub: won ? `${G.you} : ${G.owl} gegen Kritzel` : 'Knapp! Hier sind Trostfedern.',
        stars: won ? (G.owl === 0 ? 3 : G.owl === 1 ? 2 : 1) : 0, earned, onAgain: rpsClassic, onBack: toHub,
      }), 900);
    } else later(() => { G.busy = false; }, 700);
  }, 3 * 420 + 150);
}

function rpsBlitzIntro() {
  G = { mode: 'intro' };
  setBody(`<div class="intro">
    ${owl(profile(), 100)}
    <p><b>So geht's:</b> Die Eule zeigt ein Zeichen. Steht da <b style="color:var(--meadow)">GEWINNE!</b>, tippst du ganz schnell auf das, was die Eule schlägt.</p>
    <p>Ab Runde 6 wird es knifflig: Bei <b style="color:var(--tomato)">VERLIERE!</b> musst du das Gegenteil machen und absichtlich verlieren.</p>
    <button class="big" id="go" style="--c:var(--orange)">Los!</button>
  </div>`);
  $('#go').onclick = () => { G = { mode: 'blitz', round: 0, points: 0, busy: false }; rpsBlitzRound(); };
}
function rpsBlitzRound() {
  if (!G) return;
  if (G.round >= 10) {
    if (G.points === 10) bumpStat('blitzPerfect');
    const earned = award(G.points + (G.points === 10 ? 5 : 0));
    const stars = G.points >= 9 ? 3 : G.points >= 6 ? 2 : G.points >= 3 ? 1 : 0;
    return showResult({ title: G.points >= 6 ? 'Blitzschnell!' : 'Gut gespielt!', sub: `${G.points} von 10 richtig`, stars, earned, onAgain: rpsBlitzIntro, onBack: toHub });
  }
  G.round++;
  G.busy = false;
  const o = randomHand();
  const task = G.round <= 5 ? 'win' : Math.random() < 0.5 ? 'win' : 'lose';
  const answer = task === 'win' ? winnerOver(o) : BEATS[o];
  const limit = Math.max(2200, 4000 - G.round * 170);
  setBody(`<div class="hud"><span>Runde ${G.round}/10</span><span>✔ ${G.points}</span></div>
    <div class="timer"><i id="tb"></i></div>
    <div class="rps-owl" style="margin-top:10px">${owl(profile(), 84)}<div class="hand">${HANDS[o].e}</div></div>
    <div class="order ${task}">${task === 'win' ? 'GEWINNE!' : 'VERLIERE!'}</div>
    <div class="msg" id="msg"></div>
    ${picksHtml()}`);
  const tb = $('#tb');
  requestAnimationFrame(() => { tb.style.transition = `width ${limit}ms linear`; tb.style.width = '0%'; });
  const done = (ok, text) => {
    if (!G || G.busy) return;
    G.busy = true;
    if (ok) { G.points++; buzz('tap'); } else buzz('error');
    $('#msg').textContent = text;
    $app.querySelectorAll('.pick').forEach((b) => b.dataset.h === answer && b.classList.add('good'));
    later(rpsBlitzRound, 900);
  };
  G.timeout = later(() => done(false, 'Zu langsam!'), limit);
  $app.querySelectorAll('.pick').forEach((b) => (b.onclick = () => {
    if (!G || G.busy) return;
    clearTimeout(G.timeout);
    const ok = b.dataset.h === answer;
    if (!ok) b.classList.add('bad');
    done(ok, ok ? 'Richtig!' : task === 'win' ? `Nein – ${HANDS[answer].n} hätte gewonnen.` : `Nein – mit ${HANDS[answer].n} verlierst du.`);
  }));
}

/* ---------------------- Federn fangen ---------------------- */
const FEATHER_PATH = 'M19 3C11 3 5 9 5 17v4h4c8 0 12-7 10-18z';
function startCatch() {
  G = { mode: 'intro' };
  gameShell('Federn fangen', `<div class="intro">
    ${owl(profile(), 110)}
    <p>Schieb Kritzel mit dem Finger hin und her. Fang die <b>goldenen Federn</b>, Regenbogen-Federn zählen dreifach.</p>
    <p>Aber Vorsicht vor den <b>Gewitterwolken</b> – drei Treffer und das Spiel ist vorbei!</p>
    <button class="big" id="go" style="--c:#2EC4B6">Los!</button>
  </div>`);
  $('#go').onclick = runCatch;
}
function runCatch() {
  setBody(`<div class="hud"><span id="cs" style="display:flex;align-items:center;gap:4px">${FEATHER(22)} 0</span><span id="cl">❤️❤️❤️</span></div>
    <div class="timer" style="margin:6px 0 10px"><i id="ct"></i></div>
    <div class="catchwrap" id="cw"><canvas id="cc"></canvas></div>`);
  const cw = $('#cw'), cv = $('#cc'), ctx = cv.getContext('2d');
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(owlSvg(lookFor(profile()), { size: 100, still: true, xmlns: true }));
  const fp = window.Path2D ? new Path2D(FEATHER_PATH) : null;
  const DUR = 45000;
  G = { mode: 'catch', items: [], score: 0, lives: 3, t0: null, last: null, spawn: 0, x: 0.5, tx: 0.5, flash: 0, over: false, W: 0, H: 0 };
  const fit = () => {
    const r = cw.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    G.W = r.width; G.H = r.height;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  fit();
  const ro = window.ResizeObserver ? new ResizeObserver(fit) : null;
  if (ro) ro.observe(cw);
  G.stop = () => ro && ro.disconnect();
  const move = (e) => { const r = cv.getBoundingClientRect(); G.tx = Math.max(0.08, Math.min(0.92, (e.clientX - r.left) / (r.width || 1))); };
  cv.addEventListener('pointerdown', (e) => { move(e); try { cv.setPointerCapture(e.pointerId); } catch (err) {} });
  cv.addEventListener('pointermove', move);

  const drawFeather = (x, y, s, rot, rainbow) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s / 24, s / 24); ctx.translate(-12, -12);
    if (rainbow) { const g = ctx.createLinearGradient(0, 0, 24, 24); ['#FF5E5B', '#FFC83D', '#3CCB7F', '#2FA8FF', '#8A6BFF'].forEach((c, i) => g.addColorStop(i / 4, c)); ctx.fillStyle = g; }
    else ctx.fillStyle = '#FFC83D';
    if (fp) ctx.fill(fp); else { ctx.beginPath(); ctx.arc(12, 12, 8, 0, 7); ctx.fill(); }
    ctx.strokeStyle = rainbow ? '#8A6BFF' : '#C98A00'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(5, 21); ctx.lineTo(15, 9); ctx.stroke();
    ctx.restore();
  };
  const drawCloud = (x, y, s) => {
    ctx.fillStyle = '#7C8698';
    [[-0.3, 0.05, 0.28], [0, -0.12, 0.34], [0.3, 0.05, 0.28], [0, 0.1, 0.3]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); ctx.fill(); });
    ctx.fillStyle = '#FFC83D';
    ctx.beginPath(); ctx.moveTo(x - 0.02 * s, y + 0.25 * s); ctx.lineTo(x - 0.16 * s, y + 0.6 * s); ctx.lineTo(x, y + 0.52 * s); ctx.lineTo(x - 0.08 * s, y + 0.85 * s); ctx.lineTo(x + 0.14 * s, y + 0.42 * s); ctx.lineTo(x, y + 0.48 * s); ctx.lineTo(x + 0.1 * s, y + 0.25 * s); ctx.closePath(); ctx.fill();
  };
  const end = () => {
    if (G.over) return;
    G.over = true;
    bumpStat('catchBest', G.score, 'max');
    const earned = award(Math.min(15, Math.floor(G.score / 2)));
    const stars = G.score >= 30 ? 3 : G.score >= 18 ? 2 : G.score >= 8 ? 1 : 0;
    showResult({ title: G.lives > 0 ? 'Zeit um!' : 'Gewitter!', sub: `${G.score} Federn gefangen`, stars, earned, onAgain: replay('catch'), onBack: toHub });
  };
  const loop = (now) => {
    if (!G || G.mode !== 'catch' || G.over) return;
    if (G.t0 == null) { G.t0 = now; G.last = now; }
    const dt = Math.min(0.05, (now - G.last) / 1000);
    G.last = now;
    const el = now - G.t0;
    const { W, H } = G;
    const size = Math.min(W * 0.22, 110);
    const owlY = H - size * 1.2 - 6;
    G.x += (G.tx - G.x) * Math.min(1, dt * 12);
    const ox = G.x * W;
    const prog = el / DUR;
    G.spawn -= dt * 1000;
    if (G.spawn <= 0) {
      G.spawn = 720 - prog * 380;
      const r = Math.random();
      const type = r < 0.2 + prog * 0.12 ? 'cloud' : r < 0.28 + prog * 0.12 ? 'rainbow' : 'feather';
      G.items.push({ x: 20 + Math.random() * (W - 40), y: -30, vy: H * (0.28 + prog * 0.35 + Math.random() * 0.12), rot: Math.random() * 6, vr: (Math.random() - 0.5) * 3, type });
    }
    for (const it of G.items) {
      it.y += it.vy * dt; it.rot += it.vr * dt;
      if (!it.hit && it.y > owlY + size * 0.25 && it.y < owlY + size * 0.9 && Math.abs(it.x - ox) < size * 0.5) {
        it.hit = true;
        if (it.type === 'cloud') { G.lives--; G.flash = 1; buzz('error'); }
        else { G.score += it.type === 'rainbow' ? 3 : 1; buzz('tap'); }
      }
    }
    G.items = G.items.filter((it) => !it.hit && it.y < H + 40);
    G.flash = Math.max(0, G.flash - dt * 2.5);

    ctx.clearRect(0, 0, W, H);
    for (const it of G.items) {
      if (it.type === 'cloud') drawCloud(it.x, it.y, 58);
      else drawFeather(it.x, it.y, it.type === 'rainbow' ? 54 : 46, it.rot, it.type === 'rainbow');
    }
    if (img.complete && img.naturalWidth) ctx.drawImage(img, ox - size / 2, owlY, size, size * 1.2);
    else { ctx.fillStyle = profile().color; ctx.beginPath(); ctx.arc(ox, owlY + size * 0.6, size * 0.4, 0, 7); ctx.fill(); }
    if (G.flash > 0) { ctx.fillStyle = `rgba(255,94,91,${G.flash * 0.35})`; ctx.fillRect(0, 0, W, H); }

    if (G.shown !== G.score) { G.shown = G.score; $('#cs').innerHTML = `${FEATHER(22)} ${G.score}`; }
    $('#cl').textContent = '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(3 - Math.max(0, G.lives));
    $('#ct').style.width = `${Math.max(0, 100 - prog * 100)}%`;
    if (G.lives <= 0 || el >= DUR) return end();
    G.raf = requestAnimationFrame(loop);
  };
  G.raf = requestAnimationFrame(loop);
}

/* =====================================================================
 * MALEN NACH ZAHLEN (Flächen-Malvorlagen aus pictures.js, auf Canvas)
 * ===================================================================== */
const PAINT_S = 4;                 // Hochauflösung für weiche Kanten
const PAINT_INK = [38, 49, 90];    // Umrisse (#26315A)
const PAINT_BLANK = [247, 248, 252];
const inkOn = (hex) => {
  const n = parseInt(hex.slice(1), 16);
  const lum = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return lum > 0.62 ? '#26315A' : '#FFFFFF';
};
const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgba32 = ([r, g, b], a = 255) => ((a << 24) | (b << 16) | (g << 8) | r) >>> 0;

/** RLE entpacken (einmal pro Bild), Bildausschnitt und Ziffern-Größe bestimmen. */
function picData(pic) {
  if (pic._ids) return pic;
  const W = PIX_W, H = PIX_H, N = W * H;
  const ids = new Uint8Array(N);
  let o = 0;
  for (const row of pic.rle.split('|')) for (let i = 0; i < row.length; i += 4) {
    const n = parseInt(row.substr(i, 2), 16);
    ids.fill(parseInt(row.substr(i + 2, 2), 16), o, o + n);
    o += n;
  }
  // Ausschnitt um die Eule
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let i = 0; i < N; i++) if (ids[i]) { const x = i % W, y = (i / W) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const pad = 5;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
  pic._box = { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  pic._ids = ids;
  pic._reg = {};
  pic.regions.forEach((r) => {
    pic._reg[r.k] = r;
    // Abstand von der Ziffernposition bis zum Flächenrand → Schriftgröße
    let d = 1;
    outer: for (; d < 26; d++) for (let a = 0; a < 16; a++) {
      const x = Math.round(r.x + Math.cos(a * Math.PI / 8) * d), y = Math.round(r.y + Math.sin(a * Math.PI / 8) * d);
      if (x < 0 || y < 0 || x >= W || y >= H || ids[y * W + x] !== r.k) break outer;
    }
    r.fs = Math.max(9, Math.min(22, d * 1.45));
  });
  return pic;
}

/** Zeichnet den Bildausschnitt mit Faktor S. Liefert Canvas, Flächen-ID-Karte und Pixel pro Fläche. */
function renderPicture(pic, S, colorOf) {
  picData(pic);
  const lo = pic._ids, B = pic._box, W = B.w * S, H = B.h * S;
  const hi = new Uint8Array(W * H);
  const at = (x, y) => lo[Math.min(PIX_H - 1, Math.max(0, y)) * PIX_W + Math.min(PIX_W - 1, Math.max(0, x))];
  if (S === 1) {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) hi[y * W + x] = lo[(y + B.y) * PIX_W + x + B.x];
  } else {
    // weich gefilterte Mehrheitsentscheidung → glatte Flächengrenzen statt Treppen
    const R = 1.7, ks = new Uint8Array(25), ws = new Float32Array(25);
    for (let Y = 0; Y < H; Y++) {
      const v = (Y + 0.5) / S - 0.5 + B.y, vy = Math.floor(v);
      for (let X = 0; X < W; X++) {
        const u = (X + 0.5) / S - 0.5 + B.x, ux = Math.floor(u);
        const c = at(ux, vy);
        if (at(ux - 1, vy - 1) === c && at(ux + 2, vy - 1) === c && at(ux - 1, vy + 2) === c && at(ux + 2, vy + 2) === c &&
            at(ux + 2, vy) === c && at(ux, vy + 2) === c && at(ux - 1, vy) === c && at(ux, vy - 1) === c &&
            at(ux + 1, vy + 1) === c && at(ux + 1, vy) === c && at(ux, vy + 1) === c && at(ux + 1, vy - 1) === c &&
            at(ux - 1, vy + 1) === c && at(ux + 2, vy + 1) === c && at(ux + 1, vy + 2) === c) { hi[Y * W + X] = c; continue; }
        let m = 0;
        for (let dy = -1; dy <= 2; dy++) {
          const wy = R - Math.abs(vy + dy - v);
          if (wy <= 0) continue;
          for (let dx = -1; dx <= 2; dx++) {
            const wx = R - Math.abs(ux + dx - u);
            if (wx <= 0) continue;
            const k = at(ux + dx, vy + dy);
            let j = 0;
            while (j < m && ks[j] !== k) j++;
            if (j === m) { ks[m] = k; ws[m] = 0; m++; }
            ws[j] += wx * wy;
          }
        }
        let best = 0;
        for (let j = 1; j < m; j++) if (ws[j] > ws[best]) best = j;
        hi[Y * W + X] = ks[best];
      }
    }
  }
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const px = new Uint32Array(img.data.buffer);
  const R = S >= 3 ? 2 : 1, ink = rgba32(PAINT_INK);
  const counts = {};
  const edge = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, id = hi[i];
    let e = 0;
    for (let r = 1; r <= R && !e; r++) {
      if ((x >= r && hi[i - r] !== id) || (x + r < W && hi[i + r] !== id) || (y >= r && hi[i - r * W] !== id) || (y + r < H && hi[i + r * W] !== id)) e = 1;
    }
    if (e && id === 0) {   // außen nur eine halbe Linie, damit die Kontur nicht zu dick wird
      e = 0;
      for (let r = 1; r <= Math.ceil(R / 2) && !e; r++) if ((x >= r && hi[i - r]) || (x + r < W && hi[i + r]) || (y >= r && hi[i - r * W]) || (y + r < H && hi[i + r * W])) e = 1;
    }
    edge[i] = e;
    if (e) px[i] = ink;
    else if (id) counts[id] = (counts[id] || 0) + 1;
  }
  const cells = {};
  Object.keys(counts).forEach((id) => (cells[id] = new Int32Array(counts[id])));
  const pos = {};
  for (let i = 0; i < W * H; i++) {
    const id = hi[i];
    if (!id || edge[i]) continue;
    const n = pos[id] || 0;
    cells[id][n] = i;
    pos[id] = n + 1;
  }
  const out = { cv, ctx, img, px, hi, cells, W, H, S, B };
  Object.keys(cells).forEach((id) => paintCells(out, +id, colorOf(+id)));
  ctx.putImageData(img, 0, 0);
  return out;
}
function paintCells(r, id, rgb) {
  const c = r.cells[id];
  if (!c) return;
  const v = rgba32(rgb);
  for (let j = 0; j < c.length; j++) r.px[c[j]] = v;
}

/* ---------- Galerie ---------- */
function startPaintGallery() {
  G = { mode: 'gallery' };
  const p = profile();
  const done = p.pictures || [];
  gameShell('Malen nach Zahlen', `<div class="hud"><span>${done.length} von ${PICTURES.length} fertig</span></div>
    <div class="gallery" id="gal">${PICTURES.map((pic, i) => `<button class="galcard ${done.includes(pic.id) ? 'done' : ''}" data-p="${i}">
      <span class="galpic" data-t="${i}"></span><span>${pic.name}</span>
      ${done.includes(pic.id) ? '<em>✓ fertig</em>' : '<em>zum Ausmalen</em>'}</button>`).join('')}</div>`);
  $app.querySelectorAll('.galcard').forEach((b) => (b.onclick = () => startPaint(+b.dataset.p)));
  // Vorschaubilder nach und nach zeichnen, damit die Galerie sofort da ist
  let i = 0;
  const next = () => {
    if (!G || G.mode !== 'gallery' || i >= PICTURES.length) return;
    const pic = PICTURES[i], slot = $app.querySelector(`[data-t="${i}"]`);
    const finished = done.includes(pic.id);
    const r = renderPicture(pic, 1, (id) => (finished ? hexRgb(PIX_PALETTE[pic._reg[id].p][0]) : [255, 255, 255]));
    if (slot) slot.appendChild(r.cv);
    i++;
    later(next, 0);
  };
  later(next, 20);
}

/* ---------- Ausmalen ---------- */
function startPaint(index) {
  const pic = picData(PICTURES[index]);
  gameShell(pic.name, `<div class="hud"><span id="pleft">Noch ${pic.regions.length} Flächen</span><span>Bild ${index + 1}/${PICTURES.length}</span></div>
    <div class="pixwrap" id="pw"><canvas id="pcv" class="paintcv" aria-label="Ausmalbild ${esc(pic.name)}"></canvas></div>
    <div class="palette" id="pal"></div>`);
  $('#pleft').textContent = 'Wird vorbereitet …';
  G = { mode: 'paint-prep' };
  later(() => G && G.mode === 'paint-prep' && setupPaint(index, pic), 40);
}

function setupPaint(index, pic) {
  // Nummern → Farben
  const nums = {};
  pic.regions.forEach((r) => { (nums[r.n] = nums[r.n] || { num: r.n, p: r.p, hex: PIX_PALETTE[r.p][0], name: PIX_PALETTE[r.p][1], left: 0 }).left++; });
  const colors = Object.values(nums).sort((a, b) => a.num - b.num);
  G = { mode: 'paint', pic, index, cur: colors[0].num, colors, nums, filled: {}, flash: {}, done: 0, total: pic.regions.length };
  const base = renderPicture(pic, PAINT_S, () => PAINT_BLANK);
  G.base = base;
  const cv = $('#pcv'), ctx = cv.getContext('2d');
  cv.width = base.W; cv.height = base.H;
  G.cv = cv; G.ctx = ctx;
  $('#pleft').textContent = `Noch ${G.total} Flächen`;

  $('#pal').innerHTML = colors.map((c) => `<button class="pcol" data-n="${c.num}" style="--c:${c.hex};--ci:${inkOn(c.hex)}" aria-label="Farbe ${c.num}: ${c.name}">
    <b>${c.num}</b><small data-l="${c.num}">${c.left}</small></button>`).join('');
  $app.querySelectorAll('.pcol').forEach((b) => (b.onclick = () => pickPaint(+b.dataset.n)));

  // Canvas passend in den freien Platz setzen
  const wrap = $('#pw');
  const fit = () => {
    const r = wrap.getBoundingClientRect();
    const s = Math.min((r.width - 16) / pic._box.w, (r.height - 16) / pic._box.h);
    if (s <= 0) return;
    cv.style.width = Math.floor(pic._box.w * s) + 'px';
    cv.style.height = Math.floor(pic._box.h * s) + 'px';
  };
  fit();
  const ro = window.ResizeObserver ? new ResizeObserver(fit) : null;
  if (ro) ro.observe(wrap);
  G.stop = () => ro && ro.disconnect();

  let painting = false, lastWrong = null;
  const hit = (e, tap) => {
    const r = cv.getBoundingClientRect();
    const X = Math.floor(((e.clientX - r.left) / r.width) * base.W), Y = Math.floor(((e.clientY - r.top) / r.height) * base.H);
    if (X < 0 || Y < 0 || X >= base.W || Y >= base.H) return;
    const id = base.hi[Y * base.W + X];
    if (!id || G.filled[id]) return;
    const reg = pic._reg[id];
    if (reg.n === G.cur) { lastWrong = null; fillRegion(id); }
    else if (tap || lastWrong !== id) { lastWrong = id; wrongRegion(id, tap); }
  };
  cv.addEventListener('pointerdown', (e) => { painting = true; lastWrong = null; hit(e, true); e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (err) {} });
  cv.addEventListener('pointermove', (e) => painting && hit(e, false));
  ['pointerup', 'pointercancel'].forEach((ev) => cv.addEventListener(ev, () => (painting = false)));

  pickPaint(colors[0].num);
  if (document.fonts && document.fonts.load) document.fonts.load('800 20px "Baloo 2"').then(() => G && G.mode === 'paint' && drawPaint()).catch(() => {});
}

/** Bild neu zusammensetzen: Flächen + Ziffern. */
function drawPaint() {
  const { ctx, base, pic, cur } = G;
  base.ctx.putImageData(base.img, 0, 0);
  ctx.clearRect(0, 0, base.W, base.H);
  ctx.drawImage(base.cv, 0, 0);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  pic.regions.forEach((r) => {
    if (G.filled[r.k]) return;
    const active = r.n === cur;
    ctx.font = `800 ${Math.round(r.fs * base.S)}px 'Baloo 2', 'Trebuchet MS', sans-serif`;
    ctx.fillStyle = G.flash[r.k] ? '#FFFFFF' : active ? '#26315A' : '#9AA4C4';
    ctx.fillText(String(r.n), (r.x - base.B.x) * base.S, (r.y - base.B.y + r.fs * 0.06) * base.S);
  });
}

/** Fläche einfärben, wie sie gerade aussehen soll (leer, Hinweis, falsch, fertig). */
function shadeRegion(id) {
  const reg = G.pic._reg[id];
  let rgb = PAINT_BLANK;
  if (G.filled[id]) rgb = hexRgb(PIX_PALETTE[reg.p][0]);
  else if (G.flash[id]) rgb = [255, 94, 91];
  else if (reg.n === G.cur) rgb = [236, 232, 255];     // zarter Hinweis: hier passt die gewählte Farbe
  paintCells(G.base, id, rgb);
}

function pickPaint(num) {
  const prev = G.cur;
  G.cur = num;
  $app.querySelectorAll('.pcol').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.n === num)));
  G.pic.regions.forEach((r) => { if (r.n === prev || r.n === num) shadeRegion(r.k); });
  drawPaint();
}

function wrongRegion(id, tap) {
  G.flash[id] = true;
  shadeRegion(id);
  drawPaint();
  if (tap) {
    buzz('error');
    const el = $('#pleft');
    if (el) el.textContent = `Das ist die ${G.pic._reg[id].n}!`;
  }
  later(() => {
    if (!G || G.mode !== 'paint') return;
    delete G.flash[id];
    shadeRegion(id);
    drawPaint();
    const el = $('#pleft');
    if (el) el.textContent = `Noch ${G.total - G.done} Flächen`;
  }, 450);
}

function fillRegion(id) {
  const reg = G.pic._reg[id];
  G.filled[id] = true;
  delete G.flash[id];
  shadeRegion(id);
  G.done++;
  const c = G.nums[reg.n];
  c.left--;
  const badge = $app.querySelector(`[data-l="${reg.n}"]`);
  if (badge) badge.textContent = c.left || '✓';
  $('#pleft').textContent = `Noch ${G.total - G.done} Flächen`;
  buzz('tap');
  if (c.left === 0) {
    const next = G.colors.find((x) => x.left > 0);
    if (next) return pickPaint(next.num);
  }
  drawPaint();
  if (G.done >= G.total) finishPaint(G.index);
}

function finishPaint(index) {
  const pic = PICTURES[index];
  const p = profile();
  p.pictures = p.pictures || [];
  const first = !p.pictures.includes(pic.id);
  if (first) p.pictures.push(pic.id);
  const earned = award(first ? 20 : 6);
  save();
  later(() => showResult({
    title: `„${pic.name}" ist fertig!`, sub: first ? 'Neues Bild für deine Galerie' : 'Nochmal ausgemalt', stars: 3, earned,
    againLabel: index + 1 < PICTURES.length ? 'Nächstes Bild' : 'Zur Galerie',
    onAgain: () => (index + 1 < PICTURES.length ? startPaint(index + 1) : startPaintGallery()),
    backLabel: 'Zur Galerie', onBack: startPaintGallery,
  }), 700);
}

 * TIC TAC TOE gegen die Eule
 * ===================================================================== */
const TTT_LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const tttWinner = (b) => { for (const l of TTT_LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return { who: b[l[0]], line: l }; return null; };
function startTTT() {
  G = { mode: 'ttt', b: Array(9).fill(''), busy: false };
  gameShell('Tic Tac Toe', `${owlSays('Du bist ✖. Drei in einer Reihe gewinnen!')}
    <div class="ttt" id="ttt">${[...Array(9).keys()].map((i) => `<button class="tcell" data-i="${i}" aria-label="Feld ${i + 1}"></button>`).join('')}</div>
    <div class="msg" id="msg">Du fängst an!</div>`);
  $app.querySelectorAll('.tcell').forEach((b) => (b.onclick = () => tttPlay(+b.dataset.i)));
}
function tttDraw() {
  $app.querySelectorAll('.tcell').forEach((el, i) => {
    el.textContent = G.b[i] === 'x' ? '✖' : G.b[i] === 'o' ? '◯' : '';
    el.className = 'tcell' + (G.b[i] ? ' ' + G.b[i] : '');
  });
}
function tttBest(b, me, other) {
  const tryWin = (who) => { for (let i = 0; i < 9; i++) if (!b[i]) { b[i] = who; const w = tttWinner(b); b[i] = ''; if (w) return i; } return -1; };
  let i = tryWin(me); if (i >= 0) return i;
  i = tryWin(other); if (i >= 0) return i;
  if (!b[4]) return 4;
  const free = [...Array(9).keys()].filter((k) => !b[k]);
  const corners = free.filter((k) => [0, 2, 6, 8].includes(k));
  return (corners.length ? corners : free)[rnd((corners.length ? corners : free).length)];
}
function tttPlay(i) {
  if (!G || G.busy || G.b[i]) return;
  G.b[i] = 'x';
  tttDraw();
  buzz('tap');
  if (tttEnd()) return;
  G.busy = true;
  $('#msg').textContent = 'Die Eule überlegt …';
  later(() => {
    if (!G) return;
    const free = [...Array(9).keys()].filter((k) => !G.b[k]);
    const move = Math.random() < 0.25 ? free[rnd(free.length)] : tttBest(G.b.slice(), 'o', 'x');
    G.b[move] = 'o';
    tttDraw();
    if (!tttEnd()) { G.busy = false; $('#msg').textContent = 'Du bist dran!'; }
  }, 650);
}
function tttEnd() {
  const w = tttWinner(G.b);
  const full = G.b.every(Boolean);
  if (!w && !full) return false;
  if (w) w.line.forEach((i) => $app.querySelectorAll('.tcell')[i].classList.add('win'));
  const won = w && w.who === 'x';
  if (won) bumpStat('tttWin');
  bumpStat('tttPlay');
  const earned = award(won ? 10 : w ? 2 : 5);
  later(() => showResult({
    title: won ? 'Du hast gewonnen!' : w ? 'Die Eule gewinnt!' : 'Unentschieden!',
    sub: won ? 'Drei in einer Reihe!' : w ? 'Nächstes Mal klappt es.' : 'Keiner konnte gewinnen.',
    stars: won ? 3 : w ? 0 : 1, earned, onAgain: startTTT, onBack: toHub,
  }), 800);
  return true;
}

/* =====================================================================
 * VIER GEWINNT gegen die Eule
 * ===================================================================== */
const C4W = 7, C4H = 6;
const c4Drop = (b, col, who) => { for (let y = C4H - 1; y >= 0; y--) if (!b[y * C4W + col]) { b[y * C4W + col] = who; return y; } return -1; };
function c4Winner(b) {
  const at = (x, y) => (x < 0 || y < 0 || x >= C4W || y >= C4H ? '' : b[y * C4W + x]);
  for (let y = 0; y < C4H; y++) for (let x = 0; x < C4W; x++) {
    const v = at(x, y);
    if (!v) continue;
    for (const [dx, dy] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
      const line = [0, 1, 2, 3].map((k) => [x + dx * k, y + dy * k]);
      if (line.every(([a, c]) => at(a, c) === v)) return { who: v, line };
    }
  }
  return null;
}
function startC4() {
  G = { mode: 'c4', b: Array(C4W * C4H).fill(''), busy: false };
  gameShell('Vier gewinnt', `${owlSays('Du bist Rot. Wer zuerst vier in einer Reihe hat, gewinnt!')}
    <div class="c4" id="c4">${[...Array(C4W * C4H).keys()].map((i) => `<button class="c4cell" data-c="${i % C4W}" aria-label="Spalte ${(i % C4W) + 1}"><i></i></button>`).join('')}</div>
    <div class="msg" id="msg">Tippe auf eine Spalte!</div>`);
  $app.querySelectorAll('.c4cell').forEach((b) => (b.onclick = () => c4Play(+b.dataset.c)));
}
function c4Draw() {
  const cells = $app.querySelectorAll('.c4cell');
  G.b.forEach((v, i) => { cells[i].className = 'c4cell' + (v ? ' ' + v : ''); });
}
function c4Pick() {
  const free = [...Array(C4W).keys()].filter((c) => !G.b[c]);
  const tryWin = (who) => { for (const c of free) { const b = G.b.slice(); c4Drop(b, c, who); if (c4Winner(b)) return c; } return -1; };
  let c = tryWin('o'); if (c >= 0) return c;
  c = tryWin('r'); if (c >= 0) return c;
  const safe = free.filter((col) => {
    const b = G.b.slice();
    c4Drop(b, col, 'o');
    return ![...Array(C4W).keys()].some((c2) => { const b2 = b.slice(); if (c4Drop(b2, c2, 'r') < 0) return false; return !!c4Winner(b2); });
  });
  const pool = safe.length ? safe : free;
  if (Math.random() < 0.2) return pool[rnd(pool.length)];
  return pool.sort((a, b) => Math.abs(3 - a) - Math.abs(3 - b))[0];
}
function c4Play(col) {
  if (!G || G.busy || G.b[col]) return;
  if (c4Drop(G.b, col, 'r') < 0) return;
  c4Draw();
  buzz('tap');
  if (c4End()) return;
  G.busy = true;
  $('#msg').textContent = 'Die Eule überlegt …';
  later(() => {
    if (!G) return;
    c4Drop(G.b, c4Pick(), 'o');
    c4Draw();
    if (!c4End()) { G.busy = false; $('#msg').textContent = 'Du bist dran!'; }
  }, 700);
}
function c4End() {
  const w = c4Winner(G.b);
  const full = G.b.every(Boolean);
  if (!w && !full) return false;
  const cells = $app.querySelectorAll('.c4cell');
  if (w) w.line.forEach(([x, y]) => cells[y * C4W + x].classList.add('win'));
  const won = w && w.who === 'r';
  if (won) bumpStat('c4Win');
  bumpStat('c4Play');
  const earned = award(won ? 12 : w ? 3 : 6);
  later(() => showResult({
    title: won ? 'Vier in einer Reihe!' : w ? 'Die Eule war schneller!' : 'Brett voll!',
    sub: won ? 'Du hast die Eule geschlagen.' : w ? 'Probier es nochmal.' : 'Unentschieden.',
    stars: won ? 3 : w ? 0 : 1, earned, onAgain: startC4, onBack: toHub,
  }), 900);
  return true;
}

/* =====================================================================
 * TORSCHUSS: Elfmeter gegen Torwart-Kritzel (mit Handschuhen)
 * Ob gehalten wird, steht beim Schuss fest – die Eule fliegt dann genau
 * zum Ball oder deutlich daneben, damit Bild und Ergebnis immer passen.
 * ===================================================================== */
const GOAL_LEVELS = [
  { name: 'Leicht', size: 0.5, save: 0.28, per: 2, color: 'var(--meadow)' },
  { name: 'Mittel', size: 0.62, save: 0.45, per: 3, color: 'var(--orange)' },
  { name: 'Schwer', size: 0.76, save: 0.62, per: 4, color: 'var(--tomato)' },
];
function startGoal() {
  G = { mode: 'intro' };
  gameShell('Torschuss', `<div class="intro">
    ${owl(profile(), 110)}
    <p>Kritzel steht im Tor! <b>Erster Tipp</b> stoppt die Richtung, <b>zweiter Tipp</b> die Höhe. Die Ecken sind am schwersten zu halten.</p>
    <p>5 Schüsse. Je schwerer, desto größer die Eule – und desto mehr Federn.</p>
    ${GOAL_LEVELS.map((l, i) => `<button class="big" data-l="${i}" style="--c:${l.color}">${l.name} · ${l.per} Federn pro Tor</button>`).join('')}
  </div>`);
  $app.querySelectorAll('[data-l]').forEach((b) => (b.onclick = () => runGoal(+b.dataset.l)));
}

function drawGlove(ctx, x, y, r, ang) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = '#FF5E5B'; ctx.strokeStyle = '#26315A'; ctx.lineWidth = Math.max(1.5, r * 0.14);
  ctx.beginPath(); ctx.ellipse(0, -r * 0.15, r * 0.8, r, 0, 0, 7); ctx.fill(); ctx.stroke();      // Handfläche
  ctx.beginPath(); ctx.ellipse(r * 0.75, r * 0.05, r * 0.3, r * 0.45, -0.5, 0, 7); ctx.fill(); ctx.stroke();  // Daumen
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-r * 0.8, r * 0.55, r * 1.6, r * 0.5, r * 0.2) : ctx.rect(-r * 0.8, r * 0.55, r * 1.6, r * 0.5);
  ctx.fill(); ctx.stroke();                                                                          // Bündchen
  ctx.restore();
}

function runGoal(level = 1) {
  const L = GOAL_LEVELS[level];
  setBody(`<div class="hud"><span id="gs">Schuss 1/5</span><span>${L.name}</span><span id="gg">⚽ 0 Tore</span></div>
    <div class="catchwrap" id="gw" style="background:linear-gradient(#BFE8FF 60%,#8FD7A0 60%)"><canvas id="gc"></canvas></div>
    <div class="msg" id="msg">Tipp für die Richtung!</div>`);
  const wrap = $('#gw'), cv = $('#gc'), ctx = cv.getContext('2d');
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(owlSvg(lookFor(profile()), { size: 100, still: true, xmlns: true }));
  G = { mode: 'goal', level, shot: 1, goals: 0, phase: 'aim', ax: 0.5, ay: 0.5, dir: 1, vdir: 1, ball: null, kp: null, t: 0, over: false, W: 0, H: 0 };
  const fit = () => {
    const r = wrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    G.W = r.width; G.H = r.height;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  fit();
  const ro = window.ResizeObserver ? new ResizeObserver(fit) : null;
  if (ro) ro.observe(wrap);
  G.stop = () => ro && ro.disconnect();

  const goal = () => ({ x0: G.W * 0.08, x1: G.W * 0.92, y0: G.H * 0.16, y1: G.H * 0.58 });
  const kSize = () => { const g = goal(); return (g.y1 - g.y0) * L.size; };
  const ballR = () => G.W * 0.035;
  const stand = () => { const g = goal(), ks = kSize(); return { x: (g.x0 + g.x1) / 2, y: g.y1 - ks * 0.55 }; };
  const aimPoint = () => { const g = goal(); return { x: g.x0 + (g.x1 - g.x0) * G.ax, y: g.y0 + (g.y1 - g.y0) * G.ay }; };

  /** Körperhaltung, wenn die Handschuhe bei P sein sollen. */
  const pose = (P) => {
    const g = goal(), ks = kSize(), S = stand();
    let dx = P.x - S.x, dy = P.y - S.y;
    const len = Math.hypot(dx, dy);
    if (len < ks * 0.2) { dx = 0; dy = -1; } else { dx /= len; dy /= len; }
    // nie kopfüber: tiefe Bälle seitlich hechtend, mittig tief aufrecht
    if (dy > 0.3) {
      if (Math.abs(dx) < 0.3) { dx = 0; dy = -1; }
      else { dy = 0.3; const n = Math.hypot(dx, dy); dx /= n; dy /= n; }
    }
    const C = { x: P.x - dx * ks * 0.42, y: Math.min(P.y - dy * ks * 0.42, g.y1 - ks * 0.3) };
    const hand = { x: C.x + dx * ks * 0.42, y: C.y + dy * ks * 0.42 };
    return { C, hand, dx, dy, ang: Math.atan2(dy, dx) + Math.PI / 2 };
  };
  /** Abstand eines Punkts zur Eule (Körper + Handschuhe). */
  const clearance = (p, T) => {
    const ks = kSize();
    const seg = (ax, ay, bx, by) => { const vx = bx - ax, vy = by - ay, l = vx * vx + vy * vy || 1;
      const t = Math.max(0, Math.min(1, ((T.x - ax) * vx + (T.y - ay) * vy) / l)); return Math.hypot(T.x - ax - vx * t, T.y - ay - vy * t); };
    return seg(p.C.x - p.dx * ks * 0.45, p.C.y - p.dy * ks * 0.45, p.hand.x, p.hand.y) - ks * 0.45;
  };

  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!G || G.over) return;
    if (G.phase === 'aim') { G.phase = 'height'; $('#msg').textContent = 'Und jetzt die Höhe!'; buzz('tap'); }
    else if (G.phase === 'height') shoot();
  });

  const shoot = () => {
    const g = goal(), T = aimPoint();
    // Ecken und hohe Bälle sind schwerer zu halten
    const center = 1 - Math.abs(G.ax - 0.5) * 2;
    const low = G.ay;
    const chance = L.save * (0.45 + 0.55 * center) * (0.7 + 0.3 * low);
    const saved = Math.random() < chance;
    let target;
    if (saved) target = pose(T);
    else {
      // daneben springen – sichtbar weit genug weg vom Ball
      let best = null;
      for (let i = 0; i < 40; i++) {
        const P = { x: g.x0 + (g.x1 - g.x0) * (0.1 + Math.random() * 0.8), y: g.y0 + (g.y1 - g.y0) * (0.25 + Math.random() * 0.7) };
        const p = pose(P), c = clearance(p, T);
        if (!best || c > best.c) best = { p, c };
        if (c > ballR() * 4) break;
      }
      target = best.p;
    }
    G.phase = 'fly';
    G.saved = saved;
    G.kp = { from: pose(stand()), to: target, t: 0 };
    G.ball = { t: 0, x0: G.W * 0.5, y0: G.H * 0.88, x1: saved ? target.hand.x : T.x, y1: saved ? target.hand.y : T.y, after: 0 };
    $('#msg').textContent = 'Schuss!';
    buzz('tap');
  };

  const nextShot = (scored) => {
    if (scored) G.goals++;
    $('#gg').textContent = `⚽ ${G.goals} Tore`;
    $('#msg').textContent = scored ? 'TOOOR! ⚽' : 'Gehalten! 🧤';
    buzz(scored ? 'success' : 'error');
    if (G.shot >= 5) {
      G.over = true;
      bumpStat('goals', G.goals);
      if (G.goals === 5) bumpStat('goalPerfect');
      const earned = award(G.goals * L.per + (G.goals === 5 ? 5 : 0));
      return later(() => showResult({
        title: G.goals >= 4 ? 'Torjäger!' : G.goals >= 2 ? 'Gut geschossen!' : 'Weiter üben!',
        sub: `${G.goals} von 5 Schüssen im Tor (${L.name})`, stars: G.goals >= 5 ? 3 : G.goals >= 3 ? 2 : G.goals >= 1 ? 1 : 0,
        earned, againLabel: 'Nochmal', onAgain: () => runGoal(level), onBack: toHub,
      }), 1400);
    }
    later(() => {
      if (!G || G.over) return;
      G.shot++;
      G.phase = 'aim';
      G.ball = null;
      G.kp = null;
      $('#gs').textContent = `Schuss ${G.shot}/5`;
      $('#msg').textContent = 'Tipp für die Richtung!';
    }, 1500);
  };

  const drawBall = (x, y, r, spin = 0) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(spin);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#9AA4B5'; ctx.lineWidth = Math.max(1, r * 0.09); ctx.stroke();
    ctx.fillStyle = '#26315A';
    ctx.beginPath();
    for (let i = 0; i < 5; i++) { const a = (-90 + i * 72) * Math.PI / 180; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42); }
    ctx.closePath(); ctx.fill();
    for (let i = 0; i < 5; i++) {
      const a = (-90 + i * 72) * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42);
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); ctx.strokeStyle = '#9AA4B5'; ctx.lineWidth = Math.max(1, r * 0.08); ctx.stroke();
    }
    ctx.restore();
  };

  const drawKeeper = (p, arms) => {
    const ks = kSize();
    ctx.save(); ctx.translate(p.C.x, p.C.y); ctx.rotate(p.ang);
    if (img.complete && img.naturalWidth) ctx.drawImage(img, -ks / 2, -ks * 0.6, ks, ks * 1.2);
    // Handschuhe: beim Warten seitlich, beim Hechten nach vorn gestreckt
    const gr = ks * 0.13, spread = ks * (0.46 - 0.3 * arms), up = -ks * (0.02 + 0.42 * arms);
    drawGlove(ctx, -spread, up, gr, -0.3 + 0.3 * arms);
    drawGlove(ctx, spread, up, gr, 0.3 - 0.3 * arms);
    ctx.restore();
  };
  const lerpPose = (a, b, t) => {
    const ang = a.ang + (b.ang - a.ang) * t;
    return { C: { x: a.C.x + (b.C.x - a.C.x) * t, y: a.C.y + (b.C.y - a.C.y) * t }, ang };
  };

  let last = null, clock = 0;
  const loop = (now) => {
    if (!G || G.mode !== 'goal') return;
    const dt = Math.min(0.05, (now - (last ?? now)) / 1000);
    last = now; clock += dt;
    const { W, H } = G;
    const g = goal();
    const speed = 0.55 + G.shot * 0.08;
    if (G.phase === 'aim') { G.ax += G.dir * dt * speed; if (G.ax > 1) { G.ax = 1; G.dir = -1; } if (G.ax < 0) { G.ax = 0; G.dir = 1; } }
    if (G.phase === 'height') { G.ay += G.vdir * dt * speed; if (G.ay > 1) { G.ay = 1; G.vdir = -1; } if (G.ay < 0) { G.ay = 0; G.vdir = 1; } }

    ctx.clearRect(0, 0, W, H);
    // Netz
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1;
    for (let x = g.x0; x <= g.x1 + 1; x += (g.x1 - g.x0) / 12) { ctx.beginPath(); ctx.moveTo(x, g.y0); ctx.lineTo(x, g.y1); ctx.stroke(); }
    for (let y = g.y0; y <= g.y1 + 1; y += (g.y1 - g.y0) / 6) { ctx.beginPath(); ctx.moveTo(g.x0, y); ctx.lineTo(g.x1, y); ctx.stroke(); }
    // Ball im Netz liegt hinter der Eule
    const b = G.ball;
    const ballPos = () => {
      const t = Math.min(1, b.t), e = 1 - (1 - t) * (1 - t) * 0.35;
      let x = b.x0 + (b.x1 - b.x0) * t, y = b.y0 + (b.y1 - b.y0) * t - Math.sin(Math.PI * t) * H * 0.05 * (1 - G.ay);
      let r = W * (0.055 - 0.02 * t);
      if (b.after > 0) {

    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(6, W * 0.022); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(g.x0, g.y1); ctx.lineTo(g.x0, g.y0); ctx.lineTo(g.x1, g.y0); ctx.lineTo(g.x1, g.y1); ctx.stroke();
    // Torwart
    const S = pose(stand());
    if (G.kp) {

      const t = 1 - (1 - G.kp.t) ** 3;
      drawKeeper(lerpPose(G.kp.from, G.kp.to, t), t);
    } else {
      const sway = Math.sin(clock * 3) * kSize() * 0.12;
      drawKeeper({ C: { x: S.C.x + sway, y: S.C.y }, ang: 0 }, 0);
    }
    // Zielkreuz
    if (G.phase === 'aim' || G.phase === 'height') {
      const tx = g.x0 + (g.x1 - g.x0) * G.ax;
      const ty = G.phase === 'height' ? g.y0 + (g.y1 - g.y0) * G.ay : g.y1 - (g.y1 - g.y0) * 0.1;

      ctx.beginPath(); ctx.moveTo(tx - W * 0.07, ty); ctx.lineTo(tx + W * 0.07, ty);
      ctx.moveTo(tx, ty - W * 0.07); ctx.lineTo(tx, ty + W * 0.07); ctx.stroke();
    }
    // Ball
    if (b) {
      if (b.t < 1) b.t = Math.min(1, b.t + dt * 1.45);
      else b.after = Math.min(1, b.after + dt * 1.6);
      if (!(b.after > 0 && !G.saved)) { const p = ballPos(); drawBall(p.x, p.y, p.r, b.t * 12 + b.after * 8); }
      if (b.t >= 1 && G.phase === 'fly') { G.phase = 'done'; nextShot(!G.saved); }
    } else if (!G.over) drawBall(W * 0.5, H * 0.88, W * 0.055);
    G.raf = requestAnimationFrame(loop);
  };
  G.raf = requestAnimationFrame(loop);
}

/* ---------------------- Buchstaben-Angeln ---------------------- */
const ANLAUT = [['A', '🍎', 'Apfel'], ['B', '🍌', 'Banane'], ['D', '🦕', 'Dino'], ['E', '🦆', 'Ente'], ['F', '🐟', 'Fisch'], ['G', '🦒', 'Giraffe'],

  <ellipse cx="52" cy="35" rx="46" ry="29" fill="${c}"/><ellipse cx="54" cy="37" rx="29" ry="22" fill="#fff" opacity=".95"/>
  <circle cx="17" cy="27" r="6.5" fill="#fff"/><circle cx="15" cy="27" r="3.4" fill="#26315A"/><path d="M8 42Q14 46 20 42" stroke="#26315A" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;

function startFish() {
  G = { id: 'fish', round: 0, rounds: 8, score: 0, mistakes: 0, raf: 0, fish: [], last: '' };

}
function nextFish() {
  if (!G || G.id !== 'fish') return;

    if (G.mistakes === 0) bumpStat('fishPerfect');
    const earned = award(G.score + (G.mistakes === 0 ? 2 : 0));
    const stars = G.mistakes === 0 ? 3 : G.mistakes <= 3 ? 2 : 1;
    return showResult({ title: 'Eimer voll!', sub: G.mistakes ? `${G.mistakes}× den falschen Fisch erwischt` : 'Kein einziger falscher Fisch!', stars, earned, onAgain: replay('fish'), onBack: toHub });
  }

  const group = (CONFUSE.find((g) => g.includes(target)) || '').replace(target, '');
  const letters = [target, target];
  while (letters.length < 7) {
    const pool = group && Math.random() < 0.5 ? group : FISH_ABC.replace(target, '');

      buzz('error');

    }
  }));
}

/* ---------------------- Spuren im Schnee ---------------------- */
const TRACK_SETS = { upper: 'ABDEFHKLMNPRTUVWZ', digits: '0123456789', lower: 'abdehmnoprstu' };
const TRACK_CONFUSE = [...CONFUSE, '174', '385', '690', '25', 'bdp', 'nmhu', 'ceo', 'rt', 'aeo'];
const TRACK_ANIMALS = [{ e: '🐰', n: 'Der Hase' }, { e: '🦊', n: 'Der Fuchs' }, { e: '🐧', n: 'Der Pinguin' }, { e: '🐻', n: 'Der Bär' }, { e: '🦆', n: 'Die Ente' }];
function trackPrints(ch) {
  const out = [];
  (GLYPHS[ch]?.strokes || []).forEach((stroke, si) => {
    const pts = [];
    for (let i = 0; i < stroke.length - 1; i++) {
      const [x0, y0] = stroke[i], [x1, y1] = stroke[i + 1];
      const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.round(len / 1.5));
      for (let k = 0; k < n; k++) pts.push([x0 + ((x1 - x0) * k) / n, y0 + ((y1 - y0) * k) / n]);
    }
    pts.push(stroke[stroke.length - 1]);
    let acc = 7, foot = 0;
    for (let i = 1; i < pts.length; i++) {
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
      acc += Math.hypot(bx - ax, by - ay);
      if (acc >= 7 || i === pts.length - 1) {
        acc = 0;
        const a = Math.atan2(by - ay, bx - ax), side = foot++ % 2 ? 1 : -1;
        out.push({ x: bx + Math.cos(a + Math.PI / 2) * 2.2 * side, y: by + Math.sin(a + Math.PI / 2) * 2.2 * side, a: (a * 180) / Math.PI + 90, cx: bx, cy: by, s: si });
      }
    }
  });
  return out;
}
const printSvg = (p, i) => `<g class="tprint" style="animation-delay:0s" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.a.toFixed(0)})" data-n="${i}">
  <ellipse cx="0" cy="0.6" rx="1.7" ry="2.2" fill="#7FA6CF"/><circle cx="-1.5" cy="-2.3" r=".7" fill="#7FA6CF"/><circle cx="0" cy="-2.9" r=".7" fill="#7FA6CF"/><circle cx="1.5" cy="-2.3" r=".7" fill="#7FA6CF"/></g>`;

function startTracks() {
  G = { id: 'tracks', round: 0, rounds: 6, score: 0, mistakes: 0, used: [] };
  gameShell('Spuren im Schnee', '');
  nextTracks();
}
function nextTracks() {
  if (!G || G.id !== 'tracks') return;
  if (G.round >= G.rounds) {
    if (G.mistakes === 0) bumpStat('tracksPerfect');
    const earned = award(G.score + (G.mistakes === 0 ? 2 : 0));
    const stars = G.mistakes === 0 ? 3 : G.mistakes <= 2 ? 2 : 1;
    return showResult({ title: 'Spuren gelesen!', sub: G.mistakes ? `${G.mistakes}× falsch geraten` : 'Du bist ein echter Spurenleser!', stars, earned, onAgain: replay('tracks'), onBack: toHub });
  }
  G.round++;
  G.tries = 0;
  const kind = ['upper', 'upper', 'digits', 'upper', 'lower', 'digits'][G.round - 1];
  const pool = TRACK_SETS[kind].split('').filter((c) => GLYPHS[c] && !G.used.includes(c));
  const target = pool[rnd(pool.length)];

    ${owlSays(`${animal.n} ist durch den Schnee gelaufen. Welches Zeichen ist das?`)}

      <g opacity=".9"><path d="M-8 108L-2 88L4 108Z" fill="#6FB39A"/><path d="M-6 96L-2 80L2 96Z" fill="#8FD0B4"/><path d="M104 108L110 84L116 108Z" fill="#6FB39A"/><path d="M106 94L110 76L114 94Z" fill="#8FD0B4"/></g>
      ${Array.from({ length: 16 }, (_, i) => `<circle cx="${(i * 37) % 120 - 8}" cy="${(i * 53) % 110 - 6}" r="${0.6 + (i % 3) * 0.4}" fill="#fff" class="tflake" style="animation-delay:${(i % 5) * 0.6}s"/>`).join('')}
      <path id="tglyph" d="${(GLYPHS[target]?.strokes || []).map((s) => 'M' + s.map((p) => p.join(' ')).join('L')).join('')}" stroke="var(--meadow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0"/>
      <g id="tprints"></g><text id="tanimal" font-size="14" text-anchor="middle" x="-100" y="-100">${animal.e}</text></svg></div>
    <div class="picks tpicks">${opts.map((c) => `<button class="pick tpick" data-c="${c}" disabled><b>${c}</b></button>`).join('')}</div>`);
  const me = G;

    $('#treplay').disabled = true;

  };
  run();
  $('#treplay').onclick = run;
  $app.querySelectorAll('.tpick').forEach((b) => (b.onclick = () => {
    if (G !== me || me.solved) return;
    if (b.dataset.c === target) {

      const gl = $('#tglyph'); gl.style.transition = 'opacity .6s'; gl.setAttribute('opacity', '.55');
      later(() => { me.solved = false; nextTracks(); }, 1700);
    } else {

      buzz('error');

        const right = $app.querySelector(`.tpick[data-c="${target}"]`); right.classList.add('right');
        const gl = $('#tglyph'); gl.style.transition = 'opacity .6s'; gl.setAttribute('opacity', '.55');
        later(() => { me.solved = false; nextTracks(); }, 2200);
      }
    }
  }));

/* ---------------------- Verstecken im Baumhaus ---------------------- */
const HIDE_SLOTS = { out: ['garten', 'tier'], in: ['sofa', 'bett', 'regal', 'pflanze', 'spielzeug', 'teppich'] };
const HIDE_FIXED = {
  out: [{ id: 'krone-l', x: 36, y: 22, w: 104, h: 96, n: 'Baumkrone' }, { id: 'krone-r', x: 244, y: 22, w: 100, h: 96, n: 'Baumkrone' },

function startHide() {

}
function nextHide() {
  if (!G || G.id !== 'hide') return;

    const earned = award(G.score);
    const stars = G.score >= 13 ? 3 : G.score >= 9 ? 2 : 1;
    return showResult({ title: 'Gefunden!', sub: `Du hast Kritzel ${G.found}× gefunden.`, stars, earned, onAgain: replay('hide'), onBack: toHub });
  }
  G.round++;
  G.taps = 0;
  const p = profile(), h = houseOf(p);
  const side = G.canIn && G.round % 2 === 0 ? 'in' : 'out';
  const placed = h.has ? h.placed : {};
  setBody(`<div class="hud"><span>Runde ${G.round}/${G.rounds}</span><span id="hstat">${side === 'in' ? '🛋️ Innen' : '🌳 Außen'}</span></div>
    ${owlSays('Kritzel versteckt sich! Augen zu …')}
    <div class="hidescene" id="hsc">${houseScene(p, side, placed, { owl: false })}<div class="hidecover" id="hcov"><span id="hcnt">3</span></div></div>`);
  const me = G, sc = $('#hsc'), inner = sc.querySelector('svg svg');
  // Verstecke: gekaufte Sachen (per Umriss) + feste Stellen
  const spots = [];
  HIDE_SLOTS[side].forEach((slot) => {
    const g = inner.querySelector(`[data-slot="${slot}"]`);
    if (!g) return;
    let b; try { b = g.getBBox(); } catch (e) { return; }
    if (!b || b.width * b.height < 500 || b.width > 300) return;
    spots.push({ id: slot, x: b.x, y: b.y, w: b.width, h: b.height, g, n: HITEM[placed[slot]]?.name || '' });
  });

  const cands = spots.filter((s) => s.id !== me.last);
  const hide = cands[rnd(cands.length)];
  me.last = hide.id;
  const order = spots.map((s, i) => i).sort((a, b) => spots[b].w * spots[b].h - spots[a].w * spots[a].h);
  inner.insertAdjacentHTML('beforeend', `<g id="hsp">${order.map((i) => { const s = spots[i]; return `<rect data-i="${i}" x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="10" class="hspot"/>`; }).join('')}</g><g id="hfx" pointer-events="none"></g>`);

      const feet = s.y + s.h * (s.id === 'tuer' ? 1 : 0.7);
      fx.insertAdjacentHTML('beforeend', `<g class="hpop">${houseOwl(p, s.x + s.w / 2, feet, size, true)}</g>`);
      r.classList.add('ok');

      me.score += pts; me.found++;
      $('.speech .bubble').textContent = me.taps === 1 ? 'Gefunden! Beim ersten Versuch!' : 'Da bin ich! Gefunden!';
      buzz('success', 'owl');
      later(() => Sound.sfx('feather'), 500);
      later(nextHide, 1900);
    } else {
      buzz('tap', 'oops');
      r.classList.remove('miss'); void r.getBBox(); r.classList.add('miss');
      if (s.g) { s.g.classList.remove('hwig'); void s.g.getBBox(); s.g.classList.add('hwig'); }
      const ex = s.x + s.w / 2, ey = s.y + s.h / 2;
      fx.insertAdjacentHTML('beforeend', `<text x="${ex}" y="${ey}" class="hno" text-anchor="middle" font-size="22">💨</text>`);
      const t = fx.lastElementChild; later(() => t.remove(), 800);
      if (me.taps >= 2) {
        fx.insertAdjacentHTML('beforeend', `<text x="${hide.x + hide.w / 2}" y="${hide.y + 12}" class="hpeek" text-anchor="middle" font-size="20">👀</text>`);
        const pk = fx.lastElementChild; later(() => pk.remove(), 1600);
      }
    }
  }));
}

</script>
</body>
</html>
