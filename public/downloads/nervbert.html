<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hau den Nervbert – Lewolux Studio</title>
<meta name="description" content="Hau den Nervbert: Der nervigste Nachbar der Welt fliegt! Slapstick-Browserspiel von Lewolux Studio mit Ragdoll-Physik, 27 Levels, verrückten Handschuhen und Nervbert-Kostümen.">
<meta name="theme-color" content="#2a1b4a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 30c0-14 9-22 20-22s18 8 18 20c0 10-5 16-10 18v8H22v-9c-5-3-8-8-8-15z' fill='%23e8343a' stroke='%231d1330' stroke-width='4'/%3E%3Crect x='20' y='46' width='24' height='12' rx='3' fill='%23fff' stroke='%231d1330' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{--ol:#1d1330;--yel:#ffd23f;--org:#ff6b2c;--pink:#ff4f9a;--teal:#1fbfa9;--blue:#3a8bff;--bg:#2a1b4a;--card:#fff8ea;
--font:"Baloo 2","Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ol);
-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:5}
.scr.on{display:flex}
button{font-family:var(--font)}
.btn{font-weight:900;font-size:19px;letter-spacing:.3px;color:#fff;background:var(--org);border:3px solid var(--ol);border-radius:18px;
padding:11px 20px;box-shadow:0 5px 0 var(--ol),inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.38);
text-shadow:0 2px 0 rgba(0,0,0,.28);cursor:pointer;position:relative;transition:transform .07s,box-shadow .07s,filter .1s;
display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.05;white-space:nowrap;touch-action:manipulation}
.btn:hover{filter:brightness(1.07)}
.btn:active,.btn.press{transform:translateY(4px);box-shadow:0 1px 0 var(--ol),inset 0 -3px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.3)}
.btn.yel{background:var(--yel);color:var(--ol);text-shadow:0 2px 0 rgba(255,255,255,.5)}
.btn.teal{background:var(--teal)}.btn.pink{background:var(--pink)}.btn.blue{background:var(--blue)}
.btn.gray{background:#9a93ad}.btn.white{background:#fff;color:var(--ol);text-shadow:none}
.btn.big{font-size:30px;padding:14px 38px;border-radius:24px;border-width:4px;box-shadow:0 7px 0 var(--ol),inset 0 -7px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.4)}
.btn.big:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ol),inset 0 -4px 0 rgba(0,0,0,.18)}
.btn.sm{font-size:15px;padding:8px 13px;border-radius:14px;box-shadow:0 4px 0 var(--ol),inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.38)}
.btn.ic{width:48px;height:48px;padding:0;border-radius:15px}
.btn.ic svg{width:26px;height:26px}
.btn[disabled]{filter:grayscale(.9) brightness(.9);cursor:default}
.btn svg{width:22px;height:22px;flex:none}
/* Title */
#title{justify-content:space-between;padding:calc(14px + var(--sat)) 16px calc(18px + var(--sab))}
.logo{margin-top:2vh;text-align:center;transform:rotate(-4deg);pointer-events:none;filter:drop-shadow(0 8px 0 rgba(29,19,48,.35))}
.logo .l1{display:inline-block;font-weight:900;font-size:clamp(20px,5.4vmin,40px);color:#fff;background:var(--pink);border:4px solid var(--ol);
border-radius:14px;padding:2px 16px 4px;transform:rotate(-3deg) translateY(10px);box-shadow:0 5px 0 var(--ol);letter-spacing:2px;position:relative;z-index:2}
.logo .l2{display:block;font-weight:900;font-size:clamp(46px,14.5vmin,118px);line-height:.95;color:var(--yel);letter-spacing:-1px;
-webkit-text-stroke:clamp(5px,1.3vmin,9px) var(--ol);paint-order:stroke fill;text-shadow:0 clamp(5px,1.4vmin,10px) 0 var(--org),0 clamp(9px,2.2vmin,16px) 0 var(--ol)}
.logo .l3{display:inline-block;margin-top:clamp(8px,2vmin,16px);font-weight:900;font-size:clamp(12px,3vmin,18px);color:var(--ol);background:#fff;border:3px solid var(--ol);
border-radius:999px;padding:4px 14px;transform:rotate(2deg)}
.tmenu{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:420px}
.trow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.credit{font-weight:800;font-size:12px;color:#fff;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.6);letter-spacing:.5px;text-align:center}
.coinbadge{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ol);border-radius:999px;padding:4px 12px 4px 6px;
font-weight:900;font-size:17px;box-shadow:0 3px 0 var(--ol)}
.coinbadge svg{width:24px;height:24px}
.topcorner{position:absolute;top:calc(12px + var(--sat));right:calc(12px + var(--sar));display:flex;gap:8px;align-items:center}
@media (min-aspect-ratio:21/20){
 #title{align-items:flex-start;padding-left:calc(4vw + var(--sal));justify-content:space-around}
 .logo{margin-top:0;width:min(46vw,560px)}
 .tmenu{width:min(46vw,560px);max-width:none}
}

/* panels */
.hdr{width:100%;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) calc(12px + var(--sar)) 10px calc(12px + var(--sal));
background:linear-gradient(#2a1b4a,#2a1b4af0);border-bottom:4px solid var(--ol);z-index:2;flex:none}
.hdr h2{flex:1;margin:0;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 var(--ol);letter-spacing:.5px}
#map,#shop{background:rgba(42,27,74,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.scroll{flex:1;width:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;position:relative}
/* map */
#mapIn{position:relative;margin:0 auto;max-width:560px;width:100%}
.mband{position:absolute;left:0;right:0;border-top:4px solid var(--ol)}
.tlabel{position:absolute;left:50%;z-index:3;transform:translateX(-50%) rotate(-2deg);background:#fff;border:3px solid var(--ol);border-radius:14px;
padding:3px 14px;font-weight:900;font-size:16px;white-space:nowrap;box-shadow:0 4px 0 var(--ol)}
.node{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;border:4px solid var(--ol);background:var(--yel);
font-weight:900;font-size:26px;color:var(--ol);display:flex;align-items:center;justify-content:center;cursor:pointer;
box-shadow:0 6px 0 var(--ol),inset 0 -6px 0 rgba(0,0,0,.15),inset 0 4px 0 rgba(255,255,255,.5);touch-action:manipulation}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ol)}
.node.done{background:#7ee36b}.node.lock{background:#a49cb8;color:#5d5574;cursor:default}
.node.cur{animation:pulse 1s infinite ease-in-out;background:var(--org);color:#fff}
@keyframes pulse{50%{transform:scale(1.12)}}
.node .st{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.node .st svg{width:19px;height:19px}
.node svg.lk{width:26px;height:26px}
#mapSvg{position:absolute;left:0;top:0;pointer-events:none;z-index:1}.node{z-index:2}.mband canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.unlockbar{width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff8ea;border-bottom:4px solid var(--ol);font-weight:800;font-size:14px;flex:none}
.unlockbar canvas{width:44px;height:44px;flex:none}
/* shop */
.tabs{display:flex;gap:8px;padding:10px 12px 4px;flex:none;width:100%;max-width:860px;justify-content:center}
.tab{flex:1;max-width:200px}
.tab.on{background:var(--yel);color:var(--ol);text-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px calc(12px + var(--sar)) calc(24px + var(--sab)) calc(12px + var(--sal));max-width:860px;margin:0 auto}
.card{background:var(--card);border:3px solid var(--ol);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;
box-shadow:0 5px 0 var(--ol);position:relative;text-align:center}
.card.eq{background:#e3ffd9}
.card canvas{width:96px;height:96px}
.card h4{margin:0;font-weight:900;font-size:16px;line-height:1.1}
.card p{margin:0;font-size:12.5px;font-weight:700;opacity:.8;line-height:1.25;min-height:31px}
.card .btn{width:100%;font-size:15px;padding:8px 6px}
.pips{display:flex;gap:4px}.pip{width:16px;height:9px;border-radius:5px;border:2px solid var(--ol);background:#ddd3c2}.pip.on{background:var(--org)}
.bars{width:100%;display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:800}
.bar{display:flex;align-items:center;gap:5px}.bar span{width:44px;text-align:left}.bar i{flex:1;height:8px;border:2px solid var(--ol);border-radius:5px;background:#e7dcc8;overflow:hidden;position:relative}
.bar i b{position:absolute;left:0;top:0;bottom:0;background:var(--teal)}
.tag{position:absolute;top:-10px;right:-6px;background:var(--pink);color:#fff;border:3px solid var(--ol);border-radius:10px;font-size:11px;font-weight:900;padding:1px 7px;transform:rotate(6deg)}
/* HUD */
#hud{pointer-events:none;justify-content:flex-start;align-items:stretch}
#hud .row{display:flex;align-items:flex-start;gap:8px;padding:calc(10px + var(--sat)) calc(10px + var(--sar)) 0 calc(10px + var(--sal))}
#hud .pe{pointer-events:auto}
.pill{background:#fff;border:3px solid var(--ol);border-radius:16px;box-shadow:0 4px 0 var(--ol);font-weight:900;padding:5px 11px;font-size:15px;line-height:1.15}
#hLvl{font-size:13px;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hLvl small{display:block;font-size:11px;opacity:.65}
#hGoal{flex:1;max-width:340px;margin:0 auto;text-align:center;font-size:clamp(11px,3.1vw,14px);white-space:nowrap;text-overflow:ellipsis;position:relative;overflow:hidden;padding:5px 10px 9px}
#hGoal .gb{position:absolute;left:0;bottom:0;height:5px;background:var(--teal);transition:width .3s}
#hGoal.ok{background:#e3ffd9}
#hScore{text-align:right;min-width:74px}
#hScore small{display:block;font-size:11px;opacity:.65}
#hRow2{display:flex;justify-content:space-between;align-items:center;padding:8px calc(10px + var(--sar)) 0 calc(10px + var(--sal))}
#hPunch{display:flex;gap:3px;align-items:center;background:rgba(29,19,48,.55);border-radius:12px;padding:4px 7px}
#hPunch svg{width:20px;height:20px}
#hPunch svg.used{opacity:.25}
#hCombo{background:rgba(29,19,48,.55);border-radius:12px;padding:4px 9px;color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;gap:6px}
#hCombo i{display:block;width:60px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
#hCombo i b{display:block;height:100%;background:linear-gradient(90deg,var(--yel),var(--org),var(--pink));width:0;transition:width .25s}
#bSlow{position:fixed;left:calc(14px + var(--sal));bottom:calc(16px + var(--sab));width:62px;height:62px;border-radius:50%;background:var(--blue)}
#bSlow svg{width:32px;height:32px}
#bSlow b{position:absolute;top:-8px;right:-8px;background:var(--yel);color:var(--ol);border:3px solid var(--ol);border-radius:50%;width:26px;height:26px;font-size:14px;display:flex;align-items:center;justify-content:center;text-shadow:none}
#bSlow.act{background:#7a5cff;animation:pulse .6s infinite}
/* modal */
.modal{justify-content:flex-start;background:rgba(20,12,36,.62);z-index:20;padding:30px 16px 16px;overflow-y:auto;touch-action:pan-y}
.mbox{background:var(--card);border:4px solid var(--ol);border-radius:26px;box-shadow:0 8px 0 var(--ol);padding:18px 18px 20px;width:100%;max-width:400px;
display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;position:relative;margin:auto;flex:none}
.mbox h3{margin:0;font-size:28px;font-weight:900;line-height:1}
.mbox .sub{font-weight:800;font-size:14px;opacity:.75;margin-top:-6px}
.mbox .col{display:flex;flex-direction:column;gap:12px;width:100%}
.mbox .row{display:flex;gap:10px;width:100%;justify-content:center}
.mbox .row .btn{flex:1}
.ribbon{position:absolute;top:-22px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--org);color:#fff;border:4px solid var(--ol);border-radius:14px;
padding:3px 18px;font-weight:900;font-size:20px;box-shadow:0 4px 0 var(--ol);white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.bigstars{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
.bigstars svg{width:62px;height:62px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.bigstars svg:nth-child(2){width:78px;height:78px}
.bigstars svg.show{transform:scale(1)}
.stats{width:100%;display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:15px}
.stats div{display:flex;justify-content:space-between;border-bottom:2px dashed #e1d4bb;padding:3px 2px}
.stats div b{font-weight:900}
.gain{font-size:22px;font-weight:900;display:flex;align-items:center;gap:6px}.gain svg{width:28px;height:28px}
.unl{display:flex;gap:10px;align-items:center;background:#fff;border:3px dashed var(--pink);border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px;text-align:left;width:100%}
.unl canvas{width:52px;height:52px;flex:none}
.setrow{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:900;font-size:17px;gap:10px}
.tog{width:64px;height:34px;border-radius:999px;border:3px solid var(--ol);background:#cfc6dd;position:relative;cursor:pointer;flex:none}
.tog:after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--ol);transition:left .15s}
.tog.on{background:var(--teal)}.tog.on:after{left:30px}
input[type=range]{width:150px;accent-color:var(--org)}
#intro .mbox{max-width:360px}
.goalbig{font-size:20px;font-weight:900;background:#fff;border:3px solid var(--ol);border-radius:16px;padding:10px 12px;width:100%;line-height:1.2}
.goalbig small{display:block;font-size:13px;opacity:.7;margin-top:4px}
.tip{font-size:13px;font-weight:800;opacity:.75}
#toast{position:fixed;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%) translateY(-30px);opacity:0;z-index:40;pointer-events:none;
background:var(--yel);border:3px solid var(--ol);border-radius:16px;padding:8px 16px;font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--ol);transition:all .3s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#rot{display:none}
.mbox .row .btn.ic{flex:none}
@media (min-aspect-ratio:21/20) and (max-height:520px){
 #title{padding-top:calc(8px + var(--sat));padding-bottom:calc(8px + var(--sab));justify-content:space-between}
 .logo .l2{font-size:clamp(40px,15vmin,80px)}.logo .l1{font-size:18px}.logo .l3{font-size:12px;margin-top:6px}
 .tmenu{gap:10px}.btn.big{font-size:24px;padding:10px 30px}.trow .btn{font-size:16px;padding:9px 14px}.trow .btn.ic{width:44px;height:44px;padding:0}
 .bigstars svg{width:46px;height:46px}.bigstars svg:nth-child(2){width:58px;height:58px}
 .stats{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}.mbox{gap:8px;padding:14px 16px}.mbox h3{font-size:22px}#end .mbox{max-width:640px;display:grid;grid-template-columns:1fr 1.2fr;grid-template-areas:"st stats" "h stats" "sub stats" "gain row" "unl shop";column-gap:18px;row-gap:6px;align-items:center}
 #endStars{grid-area:st;justify-self:center;margin-top:4px}#endH{grid-area:h}#endSub{grid-area:sub;margin-top:0}#endStats{grid-area:stats;display:flex}#endGain{grid-area:gain;justify-self:center}#endUnl{grid-area:unl}#end .mbox>.row{grid-area:row}#bEndShop{grid-area:shop;justify-self:center}#endUnl .unl{padding:4px 8px}.credit{margin-top:2px}.modal{padding-top:26px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title" class="scr">
 <div class="topcorner"><span class="coinbadge" data-coins></span></div>
 <div class="logo"><span class="l1">HAU DEN</span><span class="l2">NERVBERT</span><span class="l3">Der Nachbar, der nervt. Bis jetzt.</span></div>
 <div class="tmenu">
  <button class="btn big" id="bPlay" data-ic="play">SPIELEN</button>
  <div class="trow">
   <button class="btn teal" id="bShop" data-ic="shop">Werkstatt</button>
   <button class="btn pink" id="bWard" data-ic="shirt">Garderobe</button>
   <button class="btn white ic" id="bSet" data-ic="gear" aria-label="Einstellungen"></button>
  </div>
  <div class="credit">Ein Spiel von Lewolux Studio · lewolux.de</div>
 </div>
</div>

<div id="map" class="scr">
 <div class="hdr"><button class="btn white ic" data-back data-ic="back" aria-label="Zurück"></button><h2>Level-Karte</h2><span class="coinbadge" data-coins></span></div>
 <div class="unlockbar" id="unlockBar"></div>
 <div class="scroll" id="mapScroll"><div id="mapIn"></div></div>
</div>

<div id="shop" class="scr">
 <div class="hdr"><button class="btn white ic" data-back data-ic="back" aria-label="Zurück"></button><h2 id="shopTitle">Werkstatt</h2><span class="coinbadge" data-coins></span></div>
 <div class="tabs"><button class="btn sm tab" data-tab="gloves">Handschuhe</button><button class="btn sm tab" data-tab="up">Upgrades</button><button class="btn sm tab" data-tab="skins">Garderobe</button></div>
 <div class="scroll"><div class="grid" id="shopGrid"></div></div>
</div>

<div id="hud" class="scr">
 <div class="row">
  <button class="btn white ic pe" id="bPause" data-ic="pause" aria-label="Pause"></button>
  <div class="pill" id="hLvl"></div>
  <div class="pill" id="hGoal"><span id="hGoalT"></span><div class="gb" id="hGoalB"></div></div>
  <div class="pill" id="hScore"></div>
 </div>
 <div id="hRow2"><div id="hPunch"></div><div id="hCombo"><span id="hComboT">Combo x1</span><i><b id="hComboB"></b></i></div></div>
 <button class="btn pe" id="bSlow" data-ic="slow" aria-label="Zeitlupe"><b id="bSlowN">1</b></button>
</div>

<div id="intro" class="scr modal"><div class="mbox"><div class="ribbon" id="inLvl">Level 1</div><h3 id="inName" style="margin-top:12px"></h3><div class="sub" id="inTheme"></div>
 <div class="goalbig" id="inGoal"></div><div class="tip" id="inTip"></div><button class="btn big" id="bGo">LOS!</button></div></div>

<div id="pause" class="scr modal"><div class="mbox"><div class="ribbon">Pause</div><h3 style="margin-top:14px">Kurz durchatmen</h3>
 <div class="col" id="pauseSet"></div>
 <div class="col"><button class="btn teal" id="bResume" data-ic="play">Weiter</button><div class="row"><button class="btn yel" id="bRetry" data-ic="retry">Neustart</button><button class="btn pink" id="bToMap" data-ic="map">Karte</button></div></div></div></div>

<div id="settings" class="scr modal"><div class="mbox"><div class="ribbon">Einstellungen</div><div class="col" id="setBox" style="margin-top:14px"></div>
 <button class="btn gray sm" id="bReset">Spielstand löschen</button><button class="btn teal" id="bSetOk">Fertig</button></div></div>

<div id="end" class="scr modal"><div class="mbox"><div class="ribbon" id="endRib">Geschafft!</div>
 <div class="bigstars" id="endStars"></div><h3 id="endH"></h3><div class="sub" id="endSub"></div>
 <div class="stats" id="endStats"></div><div class="gain" id="endGain"></div><div id="endUnl" class="col"></div>
 <div class="row"><button class="btn white ic" id="bEndMap" data-ic="map" aria-label="Karte"></button><button class="btn yel" id="bEndRetry" data-ic="retry">Nochmal</button><button class="btn" id="bEndNext" data-ic="play">Weiter</button></div>
 <button class="btn teal sm" id="bEndShop" data-ic="shop">Werkstatt</button></div></div>

<div id="confirm" class="scr modal"><div class="mbox"><h3 id="cfH">Sicher?</h3><div class="sub" id="cfT"></div><div class="row"><button class="btn gray" id="cfNo">Abbrechen</button><button class="btn pink" id="cfYes">Ja</button></div></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ===================== Hau den Nervbert – Lewolux Studio ===================== */

function auInit(){

 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 let c;try{c=AU.ctx=new AC()}catch(e){return}
 AU.master=c.createGain();AU.comp=c.createDynamicsCompressor();AU.comp.threshold.value=-14;AU.comp.ratio.value=6;
 AU.master.connect(AU.comp);AU.comp.connect(c.destination);
 AU.sfx=c.createGain();AU.sfx.connect(AU.master);AU.mus=c.createGain();AU.mus.connect(AU.master);
 const len=c.sampleRate*1.5,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nbuf=b;

function tone(type,f0,f1,dur,vol,o={}){
 if(!aOK()||!S.set.sfx)return null;const c=AU.ctx,t=c.currentTime+(o.delay||0);
 const os=c.createOscillator(),g=c.createGain();os.type=type;os.frequency.setValueAtTime(f0,t);
 if(o.mid){os.frequency.exponentialRampToValueAtTime(o.mid,t+dur*(o.midT||.4));os.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur)}
 else if(f1!==f0)os.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 const a=o.attack||.004;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 let last=os;if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=o.vibAmt||20;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+.05)}
 let node=os;if(o.filter){const f=c.createBiquadFilter();f.type=o.filter;f.frequency.value=o.ff||1000;f.Q.value=o.q||1;os.connect(f);node=f}
 node.connect(g);g.connect(o.dest||AU.sfx);os.start(t);os.stop(t+dur+.05);return os;

function noise(dur,vol,ft,f0,f1,o={}){

 const s=c.createBufferSource();s.buffer=AU.nbuf;const f=c.createBiquadFilter();f.type=ft;f.Q.value=o.q||1;
 f.frequency.setValueAtTime(f0,t);if(f1!==f0)f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 const g=c.createGain();const a=o.attack||.003;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);

function formantVoice(t,dur,p0,p1,v0,v1,vol){
 const c=AU.ctx;const os=c.createOscillator();os.type='sawtooth';os.frequency.setValueAtTime(p0,t);os.frequency.exponentialRampToValueAtTime(p1,t+dur);
 const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.setValueAtTime(vol,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 const out=c.createGain();out.gain.value=1;
 for(let k=0;k<2;k++){const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=k?9:6;f.frequency.setValueAtTime(v0[k],t);f.frequency.linearRampToValueAtTime(v1[k],t+dur);
  const fg=c.createGain();fg.gain.value=k?.6:1.2;os.connect(f);f.connect(fg);fg.connect(out)}
 out.connect(g);g.connect(AU.sfx);os.start(t);os.stop(t+dur+.05);
}

const MUS={step:0,next:0,timer:null};
function mtof(m){return 440*Math.pow(2,(m-69)/12)}
const CH=[[60,64,67],[57,60,64],[57,60,65],[59,62,67]],BS=[36,33,41,43];
const MEL=[72,-1,74,76,-1,76,74,-1,72,-1,67,-1,69,-1,-1,-1, 69,-1,72,-1,74,72,-1,69,67,-1,64,-1,-1,-1,-1,-1, 65,-1,69,72,-1,72,74,-1,72,-1,69,-1,65,-1,-1,-1, 67,-1,71,74,-1,74,76,74,71,-1,67,-1,-1,-1,62,-1];
function musicStart(){if(MUS.timer||!AU.ctx)return;MUS.next=AU.ctx.currentTime+.1;MUS.timer=setInterval(musicTick,60)}
function musicTick(){const c=AU.ctx;if(!c||c.state!=='running'||!S.set.music)return;const sp=60/112/4;
 if(MUS.next<c.currentTime-.2)MUS.next=c.currentTime+.05;
 while(MUS.next<c.currentTime+.15){mStep(MUS.step,MUS.next);MUS.next+=sp*(MUS.step%2?0.86:1.14);MUS.step=(MUS.step+1)%64}}
function mN(type,f,t,dur,vol,ff){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 if(ff){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=ff;o.connect(fl);fl.connect(g)}else o.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+dur+.02)}
function mNz(t,dur,vol,ft,f){const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.nbuf;const fl=c.createBiquadFilter();fl.type=ft;fl.frequency.value=f;const g=c.createGain();
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(AU.mus);s.start(t,Math.random());s.stop(t+dur+.02)}
function mStep(s,t){const bar=Math.floor(s/16),b=s%16,ch=CH[bar],bs=BS[bar];
 if(b===0||b===8){mN('sine',110,t,.18,.5);mN('sine',55,t,.2,.35)}
 if(b===4||b===12)mNz(t,.12,.25,'bandpass',1800);
 if(b%2===0)mNz(t,.04,.08,'highpass',7000);
 if(b===0||b===6||b===8||b===11||b===14)mN('triangle',mtof(bs),t,.22,.42,900);
 if(b===2||b===6||b===10||b===14)ch.forEach((n,i)=>mN('triangle',mtof(n),t+i*.012,.16,.09,2600));
 const m=MEL[s];if(m>0)mN('square',mtof(m),t,.17,.055,1800);
}

/* ---------- Camera & projection ---------- */
const CAM={x:0,y:1.5,z:0,F0:600,hz:300,zoom:1};
let PORTRAIT=false;
function layout(){PORTRAIT=H>W*1.05;CAM.hz=H*(PORTRAIT?.41:.4);CAM.F0=Math.min(H*(PORTRAIT?1.05:1.15),W*(PORTRAIT?1.75:1.55))}
function proj(x,y,z){const dz=z-CAM.z;if(dz<.3)return null;const f=CAM.F0*CAM.zoom/dz;return{x:W/2+(x-CAM.x)*f,y:CAM.hz+(CAM.y-y)*f,s:f,dz}}
function unprojGround(sx,sy,y){/* screen -> world at height y plane */const f=CAM.F0*CAM.zoom;const k=(sy-CAM.hz);if(Math.abs(k)<1e-3)return null;const dz=(CAM.y-y)*f/k;return{x:CAM.x+(sx-W/2)*dz/f,z:CAM.z+dz,dz}}
const olw=s=>clamp(s*.021,.7,4)/s;
function bb(x,z,y=0,margin=8){const p=proj(x,y,z);if(!p)return null;if(p.x<-p.s*margin||p.x>W+p.s*margin||p.y-p.s*margin*1.6>H+50||p.y<-p.s*30)return null;
 ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s,p.s);ctx.lineWidth=olw(p.s);ctx.strokeStyle=OL;ctx.lineJoin='round';ctx.lineCap='round';return p}
/* path helpers (work on any ctx) */
function poly(c,a){c.beginPath();c.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)c.lineTo(a[i],a[i+1]);c.closePath()}
function rr(c,x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(r,.0001),0,TAU)}
function ell(c,x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,Math.max(rx,.0001),Math.max(ry,.0001),rot,0,TAU)}
function fs(c,col){c.fillStyle=col;c.fill();c.stroke()}
function fl(c,col){c.fillStyle=col;c.fill()}
function shade(c,col,a=.18){c.save();c.clip();c.fillStyle=col;c.globalAlpha=a;c.fillRect(0,-50,50,100);c.restore()}

function fillIcons(root=document){root.querySelectorAll('[data-ic]').forEach(b=>{if(b.dataset.icd)return;b.dataset.icd=1;b.insertAdjacentHTML('afterbegin',IC[b.dataset.ic]||'')})}
function coinsUI(){$$('[data-coins]').forEach(e=>e.innerHTML=IC.coin+fmt(S.coins))}

function buildSettings(box){box.innerHTML='';const row=(label,key)=>{const r=document.createElement('div');r.className='setrow';r.innerHTML='<span>'+label+'</span>';const tg=document.createElement('div');tg.className='tog'+(S.set[key]?' on':'');
  tg.onclick=()=>{auInit();S.set[key]=S.set[key]?0:1;tg.classList.toggle('on',!!S.set[key]);applyVol();save();SFX.click();if(key==='vib'&&S.set.vib)vib(40)};r.appendChild(tg);box.appendChild(r)};
 row('Musik','music');row('Soundeffekte','sfx');const r=document.createElement('div');r.className='setrow';r.innerHTML='<span>Lautstärke</span>';const sl=document.createElement('input');sl.type='range';sl.min=0;sl.max=1;sl.step=.05;sl.value=S.set.vol;
 sl.oninput=()=>{S.set.vol=+sl.value;applyVol();save()};sl.onchange=()=>SFX.coin();r.appendChild(sl);box.appendChild(r);row('Vibration','vib')}

/* Map */
function openMap(){if(G.state==='play')leavePlay();show('map');buildMap()}
function buildMap(){const box=$('#mapIn');box.innerHTML='';const n=LEVELS.length;const step=112,top=70;let y=top;const pos=[];let lastTh=-1;const bands=[];
 for(let i=0;i<n;i++){const L=LEVELS[i];if(L.th!==lastTh){if(bands.length)bands[bands.length-1].end=y-step/2+10;bands.push({th:L.th,start:y-56});y+=56;lastTh=L.th}
  const xr=.5+Math.sin(i*1.15)*.27;pos.push({x:xr,y});y+=step}
 bands[bands.length-1].end=y;const totalH=y+20;box.style.height=totalH+'px';const wpx0=box.clientWidth||Math.min(560,W);
 for(const b of bands){const th=THEMES[b.th];const d=document.createElement('div');d.className='mband';d.style.top=b.start+'px';d.style.height=(b.end-b.start+40)+'px';
  d.style.background='linear-gradient(180deg,'+th.sky[1]+' 0%,'+th.band+' 30%,'+th.g[1]+' 100%)';box.appendChild(d);bandArt(d,b,wpx0);
  const lb=document.createElement('span');lb.className='tlabel';lb.style.top=(b.start+12)+'px';lb.style.transform='translateX(-50%) rotate(-2deg)';lb.textContent=th.name;box.appendChild(lb)}
 const wpx=box.clientWidth||Math.min(560,W);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id='mapSvg';svg.setAttribute('width',wpx);svg.setAttribute('height',totalH);
 let dpath='';pos.forEach((p,i)=>{const x=p.x*wpx;if(!i)dpath+='M'+x+' '+p.y;else{const q=pos[i-1];const qx=q.x*wpx;dpath+=' C'+qx+' '+(q.y+step*.5)+' '+x+' '+(p.y-step*.5)+' '+x+' '+p.y}});
 svg.innerHTML='<path d="'+dpath+'" fill="none" stroke="#1d1330" stroke-width="14" stroke-linecap="round" opacity=".8"/><path d="'+dpath+'" fill="none" stroke="#fff8ea" stroke-width="7" stroke-dasharray="2 14" stroke-linecap="round"/>';box.appendChild(svg);
 let cur=0;for(let i=0;i<n;i++)if(levelUnlocked(i))cur=i;
 pos.forEach((p,i)=>{const b=document.createElement('button');const un=levelUnlocked(i),st=S.stars[i]||0;b.className='node'+(!un?' lock':st>0?' done':'')+(i===cur&&!(st>0)?' cur':'');b.style.left=(p.x*100)+'%';b.style.top=p.y+'px';
  b.innerHTML=un?(i+1)+'':IC.lock;if(un){const s=document.createElement('div');s.className='st';s.innerHTML=[0,1,2].map(k=>k<st?IC.star:IC.star0).join('');b.appendChild(s);b.onclick=()=>{auInit();SFX.click();startLevel(i)}}
  else b.onclick=()=>{SFX.huh();toast('Erst Level '+i+' schaffen!')};box.appendChild(b)});
 // unlock bar
 const ub=$('#unlockBar');const next=SKINS.find(s=>!skinUnlocked(s));ub.innerHTML='';
 if(next){const c=document.createElement('canvas');skinPreview(c,next,'smug',true,44);ub.appendChild(c);const d=document.createElement('div');
  d.innerHTML=next.stars?'<b>'+next.name+'</b><br>Sammle '+next.stars+' Sterne ('+totalStars()+'/'+next.stars+')':'<b>'+next.name+'</b><br>Freischalten: Level '+next.lvl+' schaffen';ub.appendChild(d)}
 else ub.innerHTML='<div><b>Alle Nervberts freigeschaltet!</b> Du Held.</div>';
 const sc=$('#mapScroll');requestAnimationFrame(()=>{sc.scrollTop=Math.max(0,pos[cur].y-sc.clientHeight*.5)})}
function bandArt(d,b,w){const h=b.end-b.start+40;const c=document.createElement('canvas');const dp=Math.min(2,DPR);c.width=Math.round(w*dp);c.height=Math.round(h*dp);d.appendChild(c);
 const x=c.getContext('2d');x.setTransform(dp,0,0,dp,0,0);x.lineJoin='round';x.lineCap='round';const th=THEMES[b.th];const R=mulberry(b.th*13+3);const items=[];
 for(let i=0;i<6;i++){const side=i%2?1:-1;const fx=side<0?R()*.14+.06:.94-R()*.14;items.push({fx,fy:.12+R()*.8,t:th.decor[Math.floor(R()*th.decor.length)]})}
 items.sort((a,b2)=>a.fy-b2.fy);for(const it of items){if(it.t==='lights'||it.t==='flag')continue;const s=/house|barn|clubhouse|silo|flood|caravan|hut/.test(it.t)?9:14;x.save();x.translate(it.fx*w,it.fy*h+20);x.scale(s,s);x.lineWidth=2/s;x.strokeStyle=OL;
  const o=mkDecor(it.t,0,0,R,b.th);if(DECOR[it.t])try{DECOR[it.t](x,o,1)}catch(e){}x.restore()}}
function skinPreview(cvs,sk,expr='smug',headOnly=false,size=96){const d=2;cvs.width=size*d;cvs.height=size*d;const c=cvs.getContext('2d');c.setTransform(d,0,0,d,0,0);
 const L=headOnly?size*1.9:size*.5;const by=headOnly?size*.52+1.62*L:size*.97;const P=REST.map(r=>({x:size/2+r[0]*L,y:by-r[1]*L})),Z=REST.map(r=>r[2]);if(!skinUnlocked(sk)&&!headOnly){c.filter='brightness(0) opacity(.35)'}
 drawNB(c,P,Z,L,sk,expr,1.3,{});c.filter='none'}
function glovePreview(cvs,id){const d=2,s=96;cvs.width=s*d;cvs.height=s*d;const c=cvs.getContext('2d');c.setTransform(d,0,0,d,0,0);const g=GL[id];
 c.fillStyle='rgba(29,19,48,.08)';circ(c,s/2,s/2,s*.46);c.fill();drawGlove(c,id,s/2,s*.5,s*(g.size>1.4?.29:.26),.25,1.2,id==='rakete')}

$$('.tab').forEach(b=>bindBtn(b,()=>{SHOP_TAB=b.dataset.tab;buildShop()}));
function openShop(tab,back){SHOP_TAB=tab;SHOP_BACK=back;if(G.state==='play')leavePlay();show('shop');buildShop()}
function buildShop(){$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===SHOP_TAB));$('#shopTitle').textContent=SHOP_TAB==='skins'?'Garderobe':'Werkstatt';const g=$('#shopGrid');g.innerHTML='';coinsUI();
 if(SHOP_TAB==='gloves'){for(const gl of GLOVES){const own=!!S.gloves[gl.id],eq=S.glove===gl.id;const d=document.createElement('div');d.className='card'+(eq?' eq':'');
   const cvs=document.createElement('canvas');glovePreview(cvs,gl.id);d.appendChild(cvs);d.insertAdjacentHTML('beforeend','<h4>'+gl.name+'</h4><p>'+gl.desc+'</p><div class="bars"><div class="bar"><span>Kraft</span><i><b style="width:'+Math.round(gl.pow/1.8*100)+'%"></b></i></div><div class="bar"><span>Größe</span><i><b style="width:'+Math.round(gl.size/1.6*100)+'%;background:#ff9ad0"></b></i></div></div>');
   const b=document.createElement('button');b.className='btn sm '+(eq?'gray':own?'teal':S.coins>=gl.price?'':'gray');b.innerHTML=eq?'Ausgerüstet':own?'Ausrüsten':IC.coin+fmt(gl.price);if(!own&&S.coins<gl.price)b.disabled=true;if(eq)b.disabled=true;
   b.onclick=()=>{auInit();if(own){S.glove=gl.id;SFX.click()}else if(S.coins>=gl.price){S.coins-=gl.price;S.gloves[gl.id]=1;S.glove=gl.id;SFX.buy();toast(gl.name+' gekauft!')}save();buildShop()};d.appendChild(b);g.appendChild(d)}}
 else if(SHOP_TAB==='up'){for(const u of UPGRADES){const l=S.up[u.id],mx=l>=u.max,pr=mx?0:u.price[l];const d=document.createElement('div');d.className='card';
   d.innerHTML='<div style="width:72px;height:72px">'+IC['up_'+u.id].replace('<svg','<svg width="72" height="72"')+'</div><h4>'+u.name+'</h4><div class="pips">'+Array.from({length:u.max},(_,i)=>'<span class="pip'+(i<l?' on':'')+'"></span>').join('')+'</div><p>'+u.desc(l)+(mx?'':'<br><b>→ '+u.desc(l+1)+'</b>')+'</p>';
   const b=document.createElement('button');b.className='btn sm '+(mx?'gray':S.coins>=pr?'':'gray');b.innerHTML=mx?'Maximal':IC.coin+fmt(pr);if(mx||S.coins<pr)b.disabled=true;
   b.onclick=()=>{auInit();if(S.coins>=pr&&!mx){S.coins-=pr;S.up[u.id]++;SFX.buy();toast(u.name+' Stufe '+S.up[u.id]+'!');save();buildShop()}};d.appendChild(b);g.appendChild(d)}}
 else{for(const sk of SKINS){const un=skinUnlocked(sk),eq=S.skin===sk.id;const d=document.createElement('div');d.className='card'+(eq?' eq':'');const cvs=document.createElement('canvas');skinPreview(cvs,sk,eq?'laugh':'smug');d.appendChild(cvs);
   if(un&&!S.seenSkins[sk.id])d.insertAdjacentHTML('beforeend','<span class="tag">NEU</span>');
   d.insertAdjacentHTML('beforeend','<h4>'+(un?sk.name:'???')+'</h4><p>'+(un?'Bereit zum Verhauen.':sk.stars?'Sammle '+sk.stars+' Sterne':'Level '+sk.lvl+' schaffen')+'</p>');
   const b=document.createElement('button');b.className='btn sm '+(eq?'gray':un?'pink':'gray');b.innerHTML=eq?'Angezogen':un?'Anziehen':IC.lock.replace('class="lk"','')+' Gesperrt';b.disabled=eq||!un;
   b.onclick=()=>{S.skin=sk.id;S.seenSkins[sk.id]=1;save();SFX.boing();buildShop()};d.appendChild(b);g.appendChild(d)}
  SKINS.forEach(s=>{if(skinUnlocked(s))S.seenSkins[s.id]=1});save()}}

/* Play */
function startLevel(i){$('#toast').classList.remove('on');modal('end',false);modal('pause',false);G.state='play';G.paused=false;loadLevel(i,false);show('hud');const L=LEVELS[i],th=THEMES[L.th];
 $('#inLvl').textContent='Level '+(i+1);$('#inName').textContent=L.n;$('#inTheme').textContent=th.name+' · '+L.p+' Schläge';const gt=goalText(L);$('#inGoal').innerHTML=gt[0]+'<small>'+gt[1]+'</small>';
 $('#inTip').textContent=L.tip||(L.dg?'Achtung: Nervbert weicht aus!':L.mv?'Nervbert läuft herum – Zeitlupe hilft!':'2★ ab '+fmt(L.s2)+' · 3★ ab '+fmt(L.s3)+' Punkten');modal('intro',true);
 S.plays++;save()}
bindBtn($('#bGo'),()=>{modal('intro',false);setPhase('aim');G.talkT=.6});
function leavePlay(){G.state='menu';G.paused=false;modal('pause',false);modal('end',false);modal('intro',false);loadLevel(pick([0,3,6,9,12,15,18,21,24]),true)}
function togglePause(){if(G.state!=='play'||G.phase==='done')return;G.paused=!G.paused;if(G.paused){buildSettings($('#pauseSet'));const r=$('#pauseSet');r.lastChild&&0}modal('pause',G.paused)}
bindBtn($('#bPause'),togglePause);bindBtn($('#bResume'),togglePause);
bindBtn($('#bRetry'),()=>startLevel(G.li));bindBtn($('#bToMap'),()=>openMap());
$('#bSlow').addEventListener('pointerdown',e=>{e.stopPropagation();auInit();if(G.state!=='play'||G.paused||G.slowCharges<=0||G.slowT>0)return;G.slowCharges--;G.slowT=3+S.up.slowmo;SFX.whoosh(.5);tone('sine',300,120,.6,.25);updHUD()});
function updHUDlite(){const L=G.L;if(!L||G.demo)return;const g=L.g;const pr=clamp(goalProgress(),0,1);let txt='';
 if(g.t==='dist')txt='Weite '+fmt(G.best,1)+' / '+g.v+' m';else if(g.t==='total')txt='Gesamt '+fmt(G.total,0)+' / '+g.v+' m';else if(g.t==='break')txt=(g.only?ONAME[g.only]:'Objekte')+' '+(g.only?G.brokenOnly:G.broken)+' / '+g.v;
 else if(g.t==='zone')txt='Ziel: '+ZONES[G.zone.t].replace(/^(in den|ins|auf den|in die) /,'')+(G.zoneDone?' ✓':'');else txt='Höhe '+fmt(G.maxH,1)+' / '+g.v+' m';
 $('#hGoalT').textContent=txt;$('#hGoalB').style.width=(pr*100)+'%';$('#hGoal').classList.toggle('ok',pr>=1)}
function updHUD(){if(G.demo||!G.L)return;const L=G.L;$('#hLvl').innerHTML='Level '+(G.li+1)+'<small>'+THEMES[L.th].name+'</small>';updHUDlite();
 const ns=G.score>=L.s3?'3★ erreicht':G.score>=L.s2?'3★ ab '+fmt(L.s3):'2★ ab '+fmt(L.s2);$('#hScore').innerHTML=fmt(G.score)+'<small>'+ns+'</small>';
 let ph='';for(let i=0;i<L.p;i++)ph+=IC.glove.replace('<svg','<svg class="'+(i<G.used?'used':'')+'"');$('#hPunch').innerHTML=ph;
 const cap=comboCap(S.up.combo);$('#hComboT').textContent='Combo x'+fmt(G.comboMult,2).replace(/,?0+$/,'').replace(/,$/,'');$('#hComboB').style.width=((G.comboMult-1)/(cap-1)*100)+'%';
 $('#bSlowN').textContent=G.slowCharges;$('#bSlow').disabled=G.slowCharges<=0&&G.slowT<=0;$('#bSlow').classList.toggle('act',G.slowT>0)}
function endLevel(){if(G.phase==='done')return;setPhase('done');const L=G.L,i=G.li;const met=goalProgress()>=1;const stars=met?1+(G.score>=L.s2?1:0)+(G.score>=L.s3?1:0):0;
 const before=SKINS.filter(skinUnlocked).map(s=>s.id);const old=S.stars[i]||0;const newStars=Math.max(0,stars-old);
 const coins=met?Math.floor(G.score/12*G.glove.coin)+newStars*25:Math.floor(G.score/30*G.glove.coin);S.coins+=coins;if(stars>old)S.stars[i]=stars;S.best[i]=Math.max(S.best[i]||0,G.score);save();
 const unl=SKINS.filter(s=>skinUnlocked(s)&&!before.includes(s.id));
 setTimeout(()=>{$('#endRib').textContent=met?'Geschafft!':'Nicht geschafft';$('#endRib').style.background=met?'var(--teal)':'var(--pink)';
  $('#endH').textContent=met?pick(['Nervbert ist bedient!','Ruhe im Viertel!','Sauber verhauen!','Das saß!']):pick(['Nervbert lacht dich aus…','Fast! Nochmal!','Der Nachbar gewinnt… vorerst.']);
  $('#endSub').textContent='Level '+(i+1)+' · '+L.n;const es=$('#endStars');es.innerHTML=[0,1,2].map(k=>k<stars?IC.star:IC.star0).join('');
  [...es.children].forEach((s,k)=>setTimeout(()=>{s.classList.add('show');if(k<stars)SFX.star(k)},250+k*280));
  const gt=goalText(L);$('#endStats').innerHTML='<div><span>Ziel: '+gt[0].replace(/!$/,'')+'</span><b>'+(met?'✓':'✗')+'</b></div><div><span>Punkte</span><b>'+fmt(G.score)+'</b></div><div><span>Weitester Schlag</span><b>'+fmt(G.best,1)+' m</b></div><div><span>Gesamtweite</span><b>'+fmt(G.total,1)+' m</b></div><div><span>Zerstört</span><b>'+G.broken+'</b></div>';
  $('#endGain').innerHTML='+'+fmt(coins)+' '+IC.coin;const eu=$('#endUnl');eu.innerHTML='';
  unl.forEach(s=>{const d=document.createElement('div');d.className='unl';const c=document.createElement('canvas');skinPreview(c,s,'laugh',true,52);d.appendChild(c);d.insertAdjacentHTML('beforeend','<div>Neues Kostüm freigeschaltet:<br><b>'+s.name+'</b></div>');eu.appendChild(d)});
  const hasNext=i+1<LEVELS.length&&levelUnlocked(i+1);$('#bEndNext').style.display=hasNext?'':'none';$('#bEndRetry').className='btn '+(hasNext?'yel':'');
  modal('end',true);coinsUI();(met?SFX.win:SFX.lose)()},500)}
bindBtn($('#bEndMap'),()=>{modal('end',false);openMap()});bindBtn($('#bEndRetry'),()=>startLevel(G.li));bindBtn($('#bEndNext'),()=>startLevel(G.li+1));bindBtn($('#bEndShop'),()=>{modal('end',false);openShop('up','map')});
