.binder-gold .slot.unknown { background: rgba(255,215,0,.04); border: 1px solid rgba(255,215,0,.4); }
.binder-gold .album-count span { background: linear-gradient(90deg, #fff1b8, #ffd700, #b8860b); -webkit-background-clip: text; background-clip: text; color: transparent; }
.binder-comic .seg { background: #fff; outline: 2px solid #111; }
.binder-comic .seg button { color: #111; }
.binder-comic .seg button.on, .binder-comic .chips button.on { background: #111; color: #ffd23f; border-color: #111; }
.binder-comic .chips button { background: #fff; color: #111; border: 2px solid #111; }
.binder-comic .binder-btn { background: #fff; color: #111; border: 2px solid #111; }

/* ============ Lexikon & Hinweise ============ */
.help-btn { font-family: var(--display); font-size: 20px; }
.help-list { display: grid; gap: 6px; padding-bottom: 10px; }
.help-item { border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; }
.help-q { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px; font-weight: 700; font-size: 16px; text-align: left; }
.help-ic { font-size: 20px; width: 26px; text-align: center; }
.help-chev { margin-left: auto; color: var(--ink-soft); transition: transform .2s; }
.help-item.open .help-chev { transform: rotate(180deg); }
.help-a { padding: 0 14px 12px 48px; }
.help-a p { margin: 0 0 8px; font-size: 15px; line-height: 1.45; color: var(--ink); }
.tip { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin-bottom: 14px; padding: 12px; border-radius: 16px; background: rgba(242,183,5,.14); border: 1px solid rgba(242,183,5,.5); animation: tagIn .3s both; }
.tip-ic { font-size: 20px; }
.tip p { margin: 0; font-size: 15px; line-height: 1.35; }
.tip-actions { grid-column: 2; display: flex; gap: 8px; justify-content: flex-end; }

/* ============ Steckbrief ============ */
.bio-top { display: grid; grid-template-columns: 70px 1fr; gap: 12px; align-items: center; margin-bottom: 10px; }
.bio-top > div:last-child { display: grid; gap: 2px; }
.bio-top strong { font-family: var(--display); font-weight: 400; font-size: 20px; }
.bio-top em { font-weight: 700; color: var(--ink-soft); }
.bio-top span { font-size: 13px; color: var(--ink-soft); }
.bio-turn { margin: 0 0 10px; padding: 8px 10px; border-radius: 10px; background: linear-gradient(90deg, rgba(224,35,61,.15), rgba(45,108,223,.15)); font-size: 14px; font-weight: 600; }
.bio-dl { margin: 0 0 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.bio-dl > div { display: grid; padding: 6px 0; border-bottom: 1px solid var(--line); }
.bio-dl dt { font-size: 12px; color: var(--ink-soft); }
.bio-dl dd { margin: 0; font-weight: 700; font-size: 15px; }
.bio-story { display: grid; gap: 8px; padding-bottom: 10px; }
.bio-story p { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--surface2); font-size: 15px; line-height: 1.35; }
.bio-story b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--red); margin-bottom: 2px; }

/* ============ Pay-per-View ============ */
.ppv { margin-bottom: 14px; padding: 12px; border-radius: 18px; color: #fff; background: linear-gradient(135deg, var(--p2), #0b0820 70%); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--p1) 60%, transparent); }
.ppv.teaser { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.ppv-text { display: grid; gap: 1px; }
.ppv-text small { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--p1); }
.ppv-text strong { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.1; }
.ppv-text span { font-size: 13px; opacity: .8; }
.ppv-cards { display: grid; grid-template-columns: repeat(3, 44px); gap: 6px; }
.ppv.live .ppv-cards { grid-template-columns: repeat(3, 1fr); }
.ppv-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ppv-live { padding: 3px 8px; border-radius: 6px; background: #e0233d; font-size: 12px; font-weight: 700; animation: pulse 1.2s ease-in-out infinite; }
.ppv-body { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
.ppv-pack { width: 100%; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); animation: packIdle 3s ease-in-out infinite; }
.ppv-info { display: grid; gap: 8px; }
.ppv-info p { margin: 0; font-size: 14px; line-height: 1.3; opacity: .9; }
.ppv-card { display: grid; gap: 2px; justify-items: center; }
.ppv-card em { font-style: normal; font-size: 10px; font-weight: 700; opacity: .85; text-align: center; }
.ppv .st-mini.unknown { border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.06); }
.edition-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.edition { padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--p1); display: grid; gap: 8px; }
.edition.live { box-shadow: 0 0 0 2px #e0233d; } .edition.next { box-shadow: 0 0 0 2px var(--gold); }
.edition-head { display: grid; }
.edition-head strong { font-size: 14px; line-height: 1.15; }
.edition-head span { font-size: 12px; color: var(--ink-soft); }
.edition .ppv-cards { grid-template-columns: repeat(3, 1fr); }
.seg.album-tabs { grid-template-columns: repeat(5, 1fr); }
.seg.album-tabs button { font-size: 12.5px; padding: 4px 2px; }

/* ============ Spielerprofil ============ */
.profile-chip { width: 34px; flex: none; margin-right: -2px; }
.pc-av { display: block; width: 34px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 2px var(--gold); }
.pc-empty { display: grid; place-items: center; aspect-ratio: 5 / 7; background: var(--surface); font-size: 18px; }
.pf-card { display: grid; grid-template-columns: 38% 1fr; gap: 14px; align-items: start; padding: 12px; border-radius: 18px; background: linear-gradient(135deg, rgba(224,35,61,.18), rgba(45,108,223,.18)); border: 1px solid var(--line); }
.pf-av { display: block; width: 100%; }
.pf-av-empty { display: grid; place-items: center; aspect-ratio: 5 / 7; border-radius: 10px; border: 2px dashed var(--line); font-size: 36px; }
.pf-av-empty span { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.pf-main { display: grid; gap: 4px; min-width: 0; }
.pf-main strong { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.05; word-break: break-word; }
.pf-main em { font-style: normal; font-weight: 700; color: var(--red); }
.pf-main dl { margin: 6px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
.pf-main dl div { display: grid; }
.pf-main dt { font-size: 11px; color: var(--ink-soft); }
.pf-main dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.pf-share { display: flex; justify-content: center; margin-top: 10px; }
.pf-name { display: flex; gap: 8px; }
.pf-name input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface2); color: var(--ink); font: inherit; font-weight: 700; }
.pf-titles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-bottom: 10px; }
.pf-title { display: grid; gap: 1px; padding: 8px 10px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); text-align: left; }
.pf-title b { font-size: 14px; } .pf-title span { font-size: 12px; color: var(--ink-soft); }
.pf-title.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.pf-title.locked { opacity: .5; }

.pack-title.sm { font-size: 25px; }
.logo { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (max-width: 360px) { .logo { font-size: 15px; } }

.logo { font-size: clamp(13px, 3.6vw, 18px); letter-spacing: 0; }
.topbar { gap: 8px; }
</style>

en \u25C6\u25C6\u25C6, Ultra Rare \u2605, Secret Mythic \u265B, Hall of Fame \u272A.","Rookie Packs sind gratis. Gold Packs kosten 600 W$ und bringen fast immer ein Ultra Rare. Das Royal Rumble Pack kostet 2.500 W$, enth\xE4lt 30 Karten und garantiert mindestens ein Ultra Rare.","Garantie: Sp\xE4testens jedes 12. Rookie Pack bzw. jedes 4. Gold Pack enth\xE4lt ein Ultra Rare. Die genauen Chancen stehen unter \u201EDrop-Raten\u201C bei jedem Pack."]},{id:"daily",icon:"\u{1F4C5}",title:"Tagesgrenze, Serie & Tages-Quests",body:["Pro Tag gibt es 2 Rookie Packs gratis und 3 weitere per Werbung. Um Mitternacht setzt sich das zur\xFCck.","Anmeldeserie: Hol dir jeden Tag deine Belohnung ab. Tag 7 bringt ein Gold Pack. Wer einen Tag ausl\xE4sst, beginnt wieder bei Tag 1.","Tages-Quests: Jeden Tag 3 kleine Aufgaben, f\xFCr alle Spieler dieselben. Alle drei geschafft? Dann gibt es 150 W$ Bonus."]},{id:"extras",icon:"\u26A1",title:"Run-ins, Walkouts & Karte des Tages",body:["Run-in: Manchmal st\xFCrmt ein Wrestler das Opening. Ein Schurke klaut deine schw\xE4chste Karte und l\xE4sst seine eigene da, ein Held bringt eine Bonuskarte mit.","Walkout: Ziehst du eine Secret Mythic oder Hall-of-Fame-Karte, gibt es vorher einen gro\xDFen Auftritt mit Hinweisen zu Heimat, Stil und Gesinnung.","Karte des Tages: Eine seltene Karte hat heute in jedem Pack doppelte Chance. Sie steht oben auf dem Pack-Screen."]},{id:"album",icon:"\u{1F4D6}",title:"Album, Season 1 & Mappen",body:["Das Hauptalbum hat 250 Karten. Season 1 \u201ETurncoats\u201C sind 30 Wrestler, die die Seite gewechselt haben. Turn-Karten tauchen zuf\xE4llig in jedem Pack auf.","Karte antippen: Detailansicht mit Steckbrief, Trash Talk und deinen Exemplaren. Karte gedr\xFCckt halten: Einmarsch mit eigener Melodie.","Sammelmappen \xE4ndern das Aussehen des Albums. Sie sind rein optisch und werden mit W$ gekauft."]},{id:"copies",icon:"\u{1F50D}",title:"Exemplare & Zustand",body:["Jede gezogene Karte ist ein eigenes Exemplar mit Zustand: Zentrierung, Ecken, Kanten und Oberfl\xE4che. Man sieht ihn auf der Karte, zum Beispiel an wei\xDFen Ecken oder Kratzern.","Duplikate werden nicht automatisch verkauft. Beim H\xE4ndler im Grading-Tab verkaufst du sie nach Seltenheit, dein bestes Exemplar bleibt dabei immer erhalten."]},{id:"grading",icon:"\u{1F3C5}",title:"Grading",body:["Reiche Exemplare ein und erhalte eine Note von 1 bis 10. Die Karte kommt dann im Acryl-Case zur\xFCck. Eine \u201EGem Mint 10\u201C ist selten und viel wert.","Geb\xFChr und Wartezeit h\xE4ngen von der Seltenheit ab: von 2 Minuten bei Gew\xF6hnlichen bis 4 Stunden bei Hall of Fame. Du hast 5 Pl\xE4tze, per Upgrade mehr.","Tipp: Karten in gutem Zustand bekommen bessere Noten. Der Gl\xFCcksbringer verbessert den Zustand neu gezogener Karten."]},{id:"variants",icon:"\u270D",title:"Fehlpressungen & Autogramme",body:["Etwa 1 von 330 gezogenen Karten ist falsch gedruckt: Druck verrutscht, Farben vertauscht, Doppeldruck, Leerdruck oder Bild steht Kopf. Fehlpressungen sind dreimal so viel wert.","Autogramm-Stunde: An etwa jedem zweiten Tag gibt ein Wrestler Autogramme. Besitzt du ihn, lass ein Exemplar signieren. Das kostet eine Geb\xFChr und verdoppelt den Wert. Ein Autogramm pro Event."]},{id:"ring",icon:"\u{1F3DF}",title:"Ring & Show-Wert",body:["Stell bis zu 5 Lieblingskarten in den Ring: 4 Ecken und in die Mitte deinen Champion. Der Show-Wert ist die Summe der Show-Stats, der Champion z\xE4hlt doppelt.","Bonus gibt es f\xFCr einen Titelg\xFCrtel am Champion (+5 bis +60), ein komplettes Stable im Ring (+30) und zwei Rivalen einer Fehde (+15).","Neue Ringe kaufst du mit W$ im Ring-Shop."]},{id:"weekly",icon:"\u{1F3C6}",title:"Wochenthema",body:["Jede Woche gibt es ein Thema, zum Beispiel \u201EMaskenball\u201C oder \u201ENur B\xF6sewichte\u201C. Es z\xE4hlen nur passende Karten im Ring.","Je nach Punkten erreichst du Kreisliga, Landesliga, Bundesliga, Main Event oder Weltklasse. Einmal pro Woche kannst du die Wertung abgeben und bekommst 100 bis 1.000 W$."]},{id:"belts",icon:"\u{1F947}",title:"Titelg\xFCrtel",body:["Es gibt 8 G\xFCrtel, vom Kreisliga-Titel bis zum Legenden-G\xFCrtel. Sie droppen zuf\xE4llig aus Packs: Rookie 1,5 %, Gold 5 %, Royal Rumble 30 %.","Leg deinem Champion im Ring einen G\xFCrtel um, das bringt Show-Bonus. Doppelte G\xFCrtel werden automatisch verkauft."]},{id:"stables",icon:"\u{1F91D}",title:"Stables & Fehden",body:["Stables sind Teams aus 4 Wrestlern. Hast du alle vier, gibt es 500 W$, ein Gold Pack und die Team-Karte.","Fehden sind Rivalit\xE4ten zwischen zwei Wrestlern. Stehen beide im Ring, gibt es Show-Bonus und einen Schlagabtausch per Trash Talk."]},{id:"money",icon:"\u{1F4B0}",title:"Wrestling-Dollar (W$)",body:["W$ bekommst du durch Verk\xE4ufe beim H\xE4ndler, Quests, die Anmeldeserie, die Wochenwertung, Stables und Codes.","Ausgeben kannst du sie f\xFCr Gold Packs, Royal Rumbles, Grading, Autogramme, Ringe, Mappen und Upgrades. Echtes Geld brauchst du f\xFCr nichts davon."]},{id:"ppv",icon:"\u{1F4FA}",title:"Pay-per-View-Wochenenden",body:["Am letzten Wochenende jedes Monats (Freitag bis Sonntag) l\xE4uft ein Pay-per-View mit eigenem Namen, etwa \u201EWeihnachtsfehde\u201C oder \u201EGrusel-Nacht\u201C.","Jedes Event hat 3 exklusive Event-Karten: Selten (70 %), Ultra Rare (25 %) und Secret Mythic (5 %). Das PPV-Pack kostet 1.000 W$ und enth\xE4lt garantiert eine davon. Ein PPV-Pack pro Event gibt es gratis.","Verpasst? Jede Ausgabe kommt erst in einem Jahr wieder. Alle Event-Karten findest du im Album unter \u201EEvents\u201C."]},{id:"profile",icon:"\u{1F464}",title:"Spielerprofil & Titel",body:["Tippe oben links auf den Avatar: Dort w\xE4hlst du deinen Namen, eine deiner Karten als Avatar und einen Titel.","Titel schaltest du frei, zum Beispiel \u201EFehldruck-J\xE4ger\u201C f\xFCr eine Fehlpressung oder \u201EKomplettist\u201C f\xFCr das volle Album. Dein Profil kannst du als Bild teilen."]},{id:"codes",icon:"\u{1F381}",title:"Codes",body:["In Streams und auf Social Media gibt es Codes f\xFCr Bonus-Packs oder W$. Du l\xF6st sie auf dem Pack-Screen unter \u201ECode einl\xF6sen\u201C ein.","Jeder Code funktioniert pro Spieler einmal. Pack-Belohnungen liegen danach als Gutschein am jeweiligen Pack."]},{id:"save",icon:"\u{1F4BE}",title:"Spielstand & Statistik",body:["Dein Spielstand wird automatisch auf diesem Ger\xE4t gespeichert. F\xFCr einen Ger\xE4tewechsel kopierst du in den Einstellungen deinen Backup-Code und f\xFCgst ihn auf dem neuen Ger\xE4t ein.","Unter Einstellungen \u2192 Statistik siehst du deinen Fortschritt. \u201EStatistik kopieren\u201C eignet sich, um Feedback an den Entwickler zu schicken."]}];function wi({onClose:t,start:r}){let[a,n]=S(r??null);return e.createElement(j,{title:"Lexikon",onClose:t},e.createElement("p",{className:"muted small"},"Alles Wichtige zu Ring Legends, kurz erkl\xE4rt."),e.createElement("div",{className:"help-list"},dl.map(i=>e.createElement("div",{key:i.id,className:`help-item${a===i.id?" open":""}`},e.createElement("button",{className:"help-q","aria-expanded":a===i.id,onClick:()=>n(a===i.id?null:i.id)},e.createElement("span",{className:"help-ic","aria-hidden":"true"},i.icon),i.title,e.createElement("span",{className:"help-chev","aria-hidden":"true"},"\u25BE")),a===i.id&&e.createElement("div",{className:"help-a"},i.body.map((s,o)=>e.createElement("p",{key:o},s)))))))}var cl={packs:{text:"Hier \xF6ffnest du Packs: 2 Rookie Packs am Tag sind gratis, oben holst du deine Tagesserie ab.",topic:"packs"},album:{text:"Dein Album. Karte antippen f\xFCr Details und Steckbrief, gedr\xFCckt halten f\xFCr den Einmarsch.",topic:"album"},ring:{text:"Stell deine Lieblinge in den Ring. Show-Wert, G\xFCrtel, Stables und Wochenthema bringen Belohnungen.",topic:"ring"},grading:{text:"Lass Karten bewerten oder verkaufe Duplikate beim H\xE4ndler. Eine Gem Mint 10 ist richtig viel wert.",topic:"grading"},quests:{text:"Oben die 3 Tages-Quests, darunter deine Erfolge. Einl\xF6sen nicht vergessen!",t
